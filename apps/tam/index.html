    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useLayoutEffect } from 'https://esm.sh/react@18.2.0';

        // Firebase (modular v10) from Google's official module CDN - the three
        // modules share one app instance here, which esm.sh does not reliably do.
        import { initializeApp, getApps, getApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getFirestore, collection, onSnapshot, doc, getDoc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence, createUserWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

        // Custom Hook for Local Storage (used for the Script URL)
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });
            useEffect(() => {
                try { window.localStorage.setItem(key, JSON.stringify(storedValue)); } catch (error) {}
            }, [key, storedValue]);
            return [storedValue, setStoredValue];
        }

        // Money boxes group thousands as you type - 1234567 shows as 1,234,567 -
        // because a run of seven digits is where a missing zero slips through.
        // The value handed back has no commas, so every sum downstream is unchanged.
        function groupMoney(raw) {
            if (raw === null || raw === undefined) return '';
            const str = String(raw).replace(/[^\d.]/g, '');
            const dot = str.indexOf('.');
            let whole = dot === -1 ? str : str.slice(0, dot);
            const frac = dot === -1 ? null : str.slice(dot + 1).replace(/\./g, '').slice(0, 2);
            whole = whole.replace(/^0+(?=\d)/, '');
            const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return frac === null ? grouped : (grouped || '0') + '.' + frac;
        }

        function MoneyInput({ value, onChange, ...rest }) {
            const ref = useRef(null);
            const caretFromEnd = useRef(null);
            const shown = groupMoney(value);

            // Put the caret back the same number of digits from the end, so a
            // comma appearing in front of it does not shove it along.
            useLayoutEffect(() => {
                const el = ref.current;
                if (!el || caretFromEnd.current === null) return;
                if (document.activeElement === el) {
                    let pos = el.value.length, n = caretFromEnd.current;
                    while (pos > 0 && n > 0) { pos--; if (/[\d.]/.test(el.value[pos])) n--; }
                    try { el.setSelectionRange(pos, pos); } catch (e) {}
                }
                caretFromEnd.current = null;
            });

            const handle = (e) => {
                const el = e.target;
                const at = el.selectionStart === null ? el.value.length : el.selectionStart;
                caretFromEnd.current = (el.value.slice(at).match(/[\d.]/g) || []).length;
                onChange(groupMoney(el.value).replace(/,/g, ''));
            };

            return <input {...rest} ref={ref} type="text" inputMode="decimal" autoComplete="off" value={shown} onChange={handle} />;
        }

        function App() {

                apiKey: "AIzaSyDigyvF9L_BvPZh7BsAPcVjRR0gaIsb6ZI",
                authDomain: "timinvtrasys.firebaseapp.com",
                projectId: "timinvtrasys",
                storageBucket: "timinvtrasys.firebasestorage.app",
                messagingSenderId: "91354575877",

            };

            // --- Core App Navigation State ---
            const [activeTab, setActiveTab] = useState('dashboard');

            // --- Connection Settings ---

            const [fbConfig, setFbConfig] = useLocalStorage('ee_fb_config', '');

            // --- Cloud / Auth State ---
            const [loading, setLoading] = useState(true);

            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [user, setUser] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [initError, setInitError] = useState('');

            // --- Install (PWA) state ---
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isStandalone, setIsStandalone] = useState(false);
            const [isIos, setIsIos] = useState(false);
            const [installDismissed, setInstallDismissed] = useState(false);
            const [showIosHelp, setShowIosHelp] = useState(false);

            const [projects, setProjects] = useState([]);
            const [people, setPeople] = useState([]);
            const [timeLogs, setTimeLogs] = useState([]);
            const [materialLogs, setMaterialLogs] = useState([]);
            const [rosterEntries, setRosterEntries] = useState([]);
            const [payments, setPayments] = useState([]);
            // Per-job checklists: outstanding works to tick off, and materials to buy.
            const [tasks, setTasks] = useState([]);
            const [shoppingItems, setShoppingItems] = useState([]);
            // Cash jobs: an agreed cash rate per lad per job, and the cash actually
            // handed over. Internal only - never part of the accountant export
            // unless it is deliberately switched on.
            const [cashRates, setCashRates] = useState([]);
            const [cashOut, setCashOut] = useState([]);
            // The quote and the cash flag live here, apart from the job record, so
            // that a crew account can read a job without ever seeing its money.
            const [projectFinance, setProjectFinance] = useState([]);
            // One doc per person who can sign in: { id: <auth uid>, role, name }.
            const [users, setUsers] = useState([]);

            // Tolerant parse: accepts strict JSON or the JS object literal you copy
            // straight out of the Firebase console (unquoted keys).
            const parseConfig = (raw) => {
                if (!raw || !raw.trim()) return null;
                try { return JSON.parse(raw); } catch (e) {}
                try { return Function('return (' + raw + ')')(); } catch (e) { return null; }
            };

            // Initialise Firebase. Uses a Settings override if present, else the
            // baked-in config above.
            useEffect(() => {
                const cfg = parseConfig(fbConfig) || FIREBASE_CONFIG;
                if (!cfg || !cfg.projectId) { setInitError('Firebase config could not be read.'); setLoading(false); return; }
                try {
                    const app = getApps().length ? getApp() : initializeApp(cfg);
                    const _auth = getAuth(app);
                    setPersistence(_auth, browserLocalPersistence).catch(() => {});
                    setDb(getFirestore(app));
                    setAuth(_auth);
                    const unsub = onAuthStateChanged(_auth, (u) => { setUser(u); setAuthReady(true); });
                    return () => unsub();
                } catch (e) {
                    setInitError(e.message || 'Firebase failed to initialise.');
                    setLoading(false);
                }
            }, [fbConfig]);

            // Detect whether the app is already installed (standalone) and on iOS,
            // and capture Android/Chrome's install prompt when it is offered.
            useEffect(() => {
                const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                setIsStandalone(standalone);
                setIsIos(/iphone|ipad|ipod/i.test(window.navigator.userAgent) && !window.MSStream);

                const onBeforeInstall = (e) => { e.preventDefault(); setDeferredPrompt(e); };
                const onInstalled = () => { setDeferredPrompt(null); setIsStandalone(true); };
                window.addEventListener('beforeinstallprompt', onBeforeInstall);
                window.addEventListener('appinstalled', onInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onBeforeInstall);
                    window.removeEventListener('appinstalled', onInstalled);
                };
            }, []);

            const runInstall = async () => {
                if (isIos) { setShowIosHelp(true); return; }
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                try { await deferredPrompt.userChoice; } catch (e) {}
                setDeferredPrompt(null);
            };

            // Banner shows only when not already installed and either Android offered
            // a prompt or we're on iOS Safari (which installs via the Share menu).
            const canInstall = !isStandalone && (deferredPrompt || isIos);

            const [officeRole, setOfficeRole] = useState('checking');   // 'checking' | 'owner' | 'crew' | 'none'
            const [accessDenied, setAccessDenied] = useState(false);
            useEffect(() => {
                setAccessDenied(false);
                if (!db || !user) { setOfficeRole('checking'); return; }
                let cancelled = false;
                setOfficeRole('checking');
                getDoc(doc(db, 'users', user.uid))
                    .then(snap => { if (!cancelled) setOfficeRole(snap.exists() ? (snap.data().role || 'none') : 'none'); })
                    .catch(() => { if (!cancelled) setOfficeRole('none'); });
                return () => { cancelled = true; };
            }, [db, user]);

            // Real-time listeners: each collection streams straight into state (each
            // record takes its id from the document ID, so ones made by hand in the
            // Firebase console are found too), so
            // every device sees changes the instant they happen. No polling, and two
            // people editing different records never collide (per-document writes).
            useEffect(() => {
                // 'none' still loads: before the owner records exist (first-time
                // setup) owners have no users document yet. The rules decide.
                if (!db || !user || officeRole === 'checking' || officeRole === 'crew') return;
                setLoading(true);
                const setters = { projects: setProjects, people: setPeople, timeLogs: setTimeLogs, materialLogs: setMaterialLogs, rosterEntries: setRosterEntries, payments: setPayments, tasks: setTasks, shoppingItems: setShoppingItems, cashRates: setCashRates, cashOut: setCashOut, projectFinance: setProjectFinance, users: setUsers };
                const unsubs = Object.keys(setters).map(name =>
                    onSnapshot(collection(db, name),
                        (snap) => { setters[name](snap.docs.map(d => ({ id: d.id, ...d.data() }))); setLoading(false); },
                        (err) => {
                            console.error('Listener error (' + name + '):', err);
                            if (name === 'projects' && err && err.code === 'permission-denied') setAccessDenied(true);
                            setLoading(false);
                        }
                    )
                );
                return () => unsubs.forEach(u => u());
            }, [db, user, officeRole]);

            // Save a SINGLE record. upsert -> setDoc (keyed by the record's own id),
            // delete -> deleteDoc. The listeners above then update the UI automatically.
            const pushOp = async (action, type, record) => {
                if (!db || !record || !record.id) return;
                setSaving(true);
                try {
                    if (action === 'delete') await deleteDoc(doc(db, type, record.id));
                    else await setDoc(doc(db, type, record.id), record);
                } catch (err) {
                    console.error('Save failed:', err);
                    alert('Could not save to the cloud: ' + (err.message || err));
                } finally {
                    setSaving(false);
                }
            };

            // Wrapped Setters: update local state optimistically (instant UI), then
            // write the one record that changed. The snapshot reconciles right after.
            const handleSetProjects = (newProjects, action, record) => {
                if (action !== 'delete' && record && (record.quote !== undefined || record.payMode !== undefined)) {
                    if (!projectFinance.some(f => f.id === record.id)) {
                        const finRec = { id: record.id, quote: Number(record.quote || 0), payMode: record.payMode || 'standard' };
                        setProjectFinance(prev => [...prev.filter(f => f.id !== finRec.id), finRec]);
                        pushOp('upsert', 'projectFinance', finRec);
                    }
                    const clean = { ...record };
                    delete clean.quote;
                    delete clean.payMode;
                    record = clean;
                    newProjects = newProjects.map(p => p.id === clean.id ? clean : p);
                }
                setProjects(newProjects);
                pushOp(action, 'projects', record);
            };
            const handleSetPeople = (newPeople, action, record) => { setPeople(newPeople); pushOp(action, 'people', record); };
            const handleSetTimeLogs = (newLogs, action, record) => { setTimeLogs(newLogs); pushOp(action, 'timeLogs', record); };
            const handleSetMaterialLogs = (newLogs, action, record) => { setMaterialLogs(newLogs); pushOp(action, 'materialLogs', record); };
            const handleSetRoster = (newEntries, action, record) => { setRosterEntries(newEntries); pushOp(action, 'rosterEntries', record); };
            const handleSetPayments = (newPayments, action, record) => { setPayments(newPayments); pushOp(action, 'payments', record); };
            const handleSetTasks = (newTasks, action, record) => { setTasks(newTasks); pushOp(action, 'tasks', record); };
            const handleSetShopping = (newItems, action, record) => {
                if (action !== 'delete' && record && record.cost !== undefined) {
                    const clean = { ...record };
                    delete clean.cost;
                    record = clean;
                    newItems = newItems.map(n => n.id === clean.id ? clean : n);
                }
                setShoppingItems(newItems);
                pushOp(action, 'shoppingItems', record);
            };
            const handleSetCashRates = (newRates, action, record) => { setCashRates(newRates); pushOp(action, 'cashRates', record); };
            const handleSetCashOut = (newCash, action, record) => { setCashOut(newCash); pushOp(action, 'cashOut', record); };
            const handleSetFinance = (newFin, action, record) => { setProjectFinance(newFin); pushOp(action, 'projectFinance', record); };
            const handleSetUsers = (newUsers, action, record) => { setUsers(newUsers); pushOp(action, 'users', record); };

            // Date helpers (local time, no timezone drift)
            const formatYMD = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const parseYMD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
            const startOfWeekMon = (d) => { const x = new Date(d); const off = (x.getDay() + 6) % 7; x.setDate(x.getDate() - off); x.setHours(0,0,0,0); return x; };
            const prettyDate = (s) => parseYMD(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

            // --- Form States ---
            const [projectFilter, setProjectFilter] = useState('All');
            const [analyticsFilter, setAnalyticsFilter] = useState('All');
            const [analyticsSite, setAnalyticsSite] = useState('All');

            // --- Roster State ---
            const [rosterMode, setRosterMode] = useState('month'); // 'month' | 'week' | 'day'
            const [rosterRef, setRosterRef] = useState(new Date().toISOString().split('T')[0]); // focused date
            const [assignSite, setAssignSite] = useState('');
            const [assignPerson, setAssignPerson] = useState('');
            const [jobRosterDate, setJobRosterDate] = useState(new Date().toISOString().split('T')[0]);
            const [jobRosterPerson, setJobRosterPerson] = useState('');

            // --- Payment State ---
            const PAY_STAGES = ['Preliminary Works', 'Containment', 'First Fix', 'Second Fix', 'Testing & Commissioning', 'Snagging', 'Handover / Certification', 'Other'];
            const [payAmount, setPayAmount] = useState('');
            const [payDate, setPayDate] = useState(new Date().toISOString().split('T')[0]);
            const [payStage, setPayStage] = useState('Preliminary Works');
            const [payOther, setPayOther] = useState('');
            const [editingPayment, setEditingPayment] = useState(null);
            const [editPayAmount, setEditPayAmount] = useState('');
            const [editPayDate, setEditPayDate] = useState('');
            const [editPayStage, setEditPayStage] = useState('Preliminary Works');
            const [editPayOther, setEditPayOther] = useState('');
            const [newProjName, setNewProjName] = useState('');
            const [newProjClient, setNewProjClient] = useState('');
            const [newProjQuote, setNewProjQuote] = useState('');
            const [newProjStatus, setNewProjStatus] = useState('Quotes Submitted');
            const [newProjStart, setNewProjStart] = useState('');
            
            // --- Edit Project Form States ---
            const [editProjName, setEditProjName] = useState('');
            const [editProjClient, setEditProjClient] = useState('');
            const [editProjQuote, setEditProjQuote] = useState('');
            const [editProjStart, setEditProjStart] = useState('');
            
            // --- Log & Edit Time States ---
            const [timeDate, setTimeDate] = useState(new Date().toISOString().split('T')[0]); // Default today
            const [timePersonId, setTimePersonId] = useState('');
            const [timeHours, setTimeHours] = useState('');
            const [timeNotes, setTimeNotes] = useState('');
            const [editingTimeLog, setEditingTimeLog] = useState(null);
            const [editTimeDate, setEditTimeDate] = useState('');
            const [editTimePersonId, setEditTimePersonId] = useState('');
            const [editTimeHours, setEditTimeHours] = useState('');
            const [editTimeNotes, setEditTimeNotes] = useState('');
            
            // --- Crew Login States ---
            const [newCrewUid, setNewCrewUid] = useState('');
            const [newCrewName, setNewCrewName] = useState('');
            const [newCrewEmail, setNewCrewEmail] = useState('');
            const [newCrewPwd, setNewCrewPwd] = useState('');
            const [crewSendLink, setCrewSendLink] = useState(true);
            const [crewCreating, setCrewCreating] = useState('');
            const [crewCreated, setCrewCreated] = useState(null);
            const [showUidFallback, setShowUidFallback] = useState(false);
            const [migrating, setMigrating] = useState('');

            // --- Cash Job States ---
            const [newProjCash, setNewProjCash] = useState(false);
            const [editProjCash, setEditProjCash] = useState(false);
            const [newPersonCashRate, setNewPersonCashRate] = useState('');
            const [editPersonCashRate, setEditPersonCashRate] = useState('');
            const [editingRateFor, setEditingRateFor] = useState(null);   // personId whose job cash rate is being set
            const [rateInput, setRateInput] = useState('');
            const [cashPersonId, setCashPersonId] = useState('');
            const [cashAmount, setCashAmount] = useState('');
            const [cashDate, setCashDate] = useState(new Date().toISOString().split('T')[0]);
            const [cashNote, setCashNote] = useState('');
            const [editingCashOut, setEditingCashOut] = useState(null);
            const [editCashPersonId, setEditCashPersonId] = useState('');
            const [editCashAmount, setEditCashAmount] = useState('');
            const [editCashDate, setEditCashDate] = useState('');
            const [editCashNote, setEditCashNote] = useState('');
            const [includeCashJobs, setIncludeCashJobs] = useState(false);   // accountant export: off by default

            // --- Outstanding Works / Materials Needed States ---
            const [newTaskText, setNewTaskText] = useState('');
            const [editingTaskId, setEditingTaskId] = useState(null);
            const [editingTaskText, setEditingTaskText] = useState('');
            const [showDoneTasks, setShowDoneTasks] = useState(false);

            const [buyCost, setBuyCost] = useState('');

            const [matDate, setMatDate] = useState(new Date().toISOString().split('T')[0]); // Default today
            const [matItem, setMatItem] = useState('');
            const [matCost, setMatCost] = useState('');

            const [editMatItem, setEditMatItem] = useState('');

            // --- Team Member States ---
            const [newPersonName, setNewPersonName] = useState('');
            const [newPersonRole, setNewPersonRole] = useState('Electrician');
            const [newPersonRate, setNewPersonRate] = useState('');

            // --- Edit Team Member States ---
            const [editingPerson, setEditingPerson] = useState(null);
            const [editPersonName, setEditPersonName] = useState('');
            const [editPersonRole, setEditPersonRole] = useState('');
            const [editPersonRate, setEditPersonRate] = useState('');

            // Export States & Settings
            const [showAccountantExport, setShowAccountantExport] = useState(false);
            const [exportStartDate, setExportStartDate] = useState('');
            const [exportEndDate, setExportEndDate] = useState('');
            const [localConfigInput, setLocalConfigInput] = useState(fbConfig || '');

            // Login form
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPwd, setLoginPwd] = useState('');
            const [loginError, setLoginError] = useState('');
            const [loggingIn, setLoggingIn] = useState(false);

            // Helper: Format Euros (Ireland locale defaults)
            const formatCurrency = (amount) => new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' }).format(amount);

            // --- Job checklists: outstanding works + materials needed ---
            // Counts used on the Jobs list and dashboard so anyone can see, before
            // travelling to a site, what is still to do and what still has to be bought.
            const openTasksFor = (projectId) => tasks.filter(t => t.projectId === projectId && !t.done).length;
            const openNeedsFor = (projectId) => shoppingItems.filter(n => n.projectId === projectId && !n.purchased).length;
            const whoAmI = () => (user && user.email ? user.email.split('@')[0] : '');
            const newId = (prefix) => prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            const needLabel = (n) => (n.qty ? n.item + ' (x' + n.qty + ')' : n.item);

            // --- Cash jobs ---
            // On a cash job the lads are paid an agreed cash rate rather than their
            // standard rate, so that is the rate the job is costed at. The cash
            // actually handed over SETTLES that cost - it is not an extra cost on
            // top, or the same money would be counted twice.
            // Creating a login from inside the app: a SECOND Firebase app instance
            // does the sign-up, so your own session is untouched. A plain
            // createUser call on the main instance would sign you out and sign you
            // in as the new lad instead.
            const createCrewLogin = async () => {
                const name = newCrewName.trim();
                const email = newCrewEmail.trim();
                if (!name || !email) { alert('Enter a name and an email address.'); return; }
                if (users.some(u => (u.email || '').toLowerCase() === email.toLowerCase())) { alert('That email already has access.'); return; }

                // Their password: whatever you typed, else a random one they will
                // never need if the reset link is being sent.
                const pwd = newCrewPwd.trim() || (Math.random().toString(36).slice(2, 10) + 'Aa1!');
                setCrewCreating('Creating login...');
                setCrewCreated(null);

                let secondary = null;
                try {
                    const cfg = parseConfig(fbConfig) || FIREBASE_CONFIG;
                    secondary = getApps().find(a => a.name === 'crewmaker') || initializeApp(cfg, 'crewmaker');
                    const secondaryAuth = getAuth(secondary);
                    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pwd);
                    const uid = cred.user.uid;

                    // Give them crew access. Written by you, from your own session.
                    const rec = { id: uid, role: 'crew', name, email };
                    handleSetUsers([...users, rec], 'upsert', rec);

                    await signOut(secondaryAuth).catch(() => {});

                    if (crewSendLink) {
                        await sendPasswordResetEmail(secondaryAuth, email);
                        setCrewCreating('');
                        setCrewCreated({ name, email, sent: true });
                    } else {
                        setCrewCreating('');
                        setCrewCreated({ name, email, sent: false, pwd });
                    }
                    setNewCrewName(''); setNewCrewEmail(''); setNewCrewPwd('');
                } catch (e) {
                    const code = (e && e.code) || '';
                    let msg = e.message || String(e);
                    if (code === 'auth/operation-not-allowed') msg = 'Email/Password sign-up is switched off for this project. Turn it on in Firebase console > Authentication > Sign-in method, or add the login by UID below.';
                    else if (code === 'auth/email-already-in-use') msg = 'That email already has a Firebase account. Add it by UID below instead.';
                    else if (code === 'auth/weak-password') msg = 'Password too short - it needs at least 6 characters.';
                    else if (code === 'auth/invalid-email') msg = 'That email address does not look right.';
                    setCrewCreating('');
                    alert('Could not create the login.\n\n' + msg);
                } finally {
                    if (secondary) { try { await deleteApp(secondary); } catch (err) {} }
                }
            };

            const financeFor = (projectId) => projectFinance.find(f => f.id === projectId) || {};
            const quoteOf = (project) => {
                if (!project) return 0;
                const fin = financeFor(project.id);
                const q = fin.quote !== undefined && fin.quote !== null ? fin.quote : project.quote;
                return Number(q || 0);
            };
            const isCashJob = (project) => {
                if (!project) return false;
                const fin = financeFor(project.id);
                const mode = fin.payMode !== undefined && fin.payMode !== null ? fin.payMode : project.payMode;
                return mode === 'cash';
            };
            // Saving a job writes the name/status half and the money half separately.
            const saveProjectRecord = (project, finance) => {
                const stripped = { ...project };
                delete stripped.quote;
                delete stripped.payMode;
                handleSetProjects(projects.some(p => p.id === stripped.id) ? projects.map(p => p.id === stripped.id ? stripped : p) : [...projects, stripped], 'upsert', stripped);
                const finRec = { id: stripped.id, quote: Number(finance.quote || 0), payMode: finance.payMode || 'standard' };
                handleSetFinance([...projectFinance.filter(f => f.id !== finRec.id), finRec], 'upsert', finRec);
                return stripped;
            };
            const cashRateFor = (projectId, personId) => {
                const set = cashRates.find(c => c.projectId === projectId && c.personId === personId);
                if (set && set.rate !== '' && set.rate !== null && !isNaN(Number(set.rate))) return Number(set.rate);
                const person = people.find(p => p.id === personId);
                if (person && person.cashRate !== undefined && person.cashRate !== null && person.cashRate !== '') return Number(person.cashRate);
                return null;   // nothing agreed yet - fall back to the standard rate
            };
            const effectiveRate = (project, personId) => {
                const person = people.find(p => p.id === personId);
                const standard = person ? Number(person.rate || 0) : 0;
                if (!isCashJob(project)) return standard;
                const cash = cashRateFor(project.id, personId);
                return cash === null ? standard : cash;
            };

            // Calculate Financials
            const getProjectFinancials = (projectId, startDate = null, endDate = null) => {
                const project = projects.find(p => p.id === projectId);
                if (!project) return null;

                let projectTime = timeLogs.filter(t => t.projectId === projectId);
                let projectMaterials = materialLogs.filter(m => m.projectId === projectId);
                let projectPayments = payments.filter(p => p.projectId === projectId);
                let projectCashOut = cashOut.filter(c => c.projectId === projectId);

                if (startDate) {
                    projectTime = projectTime.filter(t => t.date.split('T')[0] >= startDate);
                    projectMaterials = projectMaterials.filter(m => m.date.split('T')[0] >= startDate);
                    projectPayments = projectPayments.filter(p => (p.date || '').split('T')[0] >= startDate);
                    projectCashOut = projectCashOut.filter(c => (c.date || '').split('T')[0] >= startDate);
                }
                if (endDate) {
                    projectTime = projectTime.filter(t => t.date.split('T')[0] <= endDate);
                    projectMaterials = projectMaterials.filter(m => m.date.split('T')[0] <= endDate);
                    projectPayments = projectPayments.filter(p => (p.date || '').split('T')[0] <= endDate);
                    projectCashOut = projectCashOut.filter(c => (c.date || '').split('T')[0] <= endDate);
                }

                // Costed at the cash rate on a cash job, the standard rate otherwise.
                const labourCost = projectTime.reduce((total, log) => total + (log.hours * effectiveRate(project, log.personId)), 0);

                const totalHours = projectTime.reduce((total, log) => total + Number(log.hours), 0);

                const materialCost = projectMaterials.reduce((total, log) => total + Number(log.cost), 0);
                // Cash handed over is deliberately NOT added here: the hours it pays
                // for are already in labourCost. It is a settlement, not a cost.
                const cashPaid = projectCashOut.reduce((total, c) => total + Number(c.amount), 0);
                const cashOwed = labourCost - cashPaid;
                const totalCost = labourCost + materialCost;
                const received = projectPayments.reduce((total, p) => total + Number(p.amount), 0);

                // Potential = best case if paid in full at quote. Realised = money
                // actually in (stage payments) minus what has been spent.
                const quote = quoteOf(project);
                const potentialProfit = quote - totalCost;
                const realisedProfit = received - totalCost;
                const potentialMargin = quote > 0 ? (potentialProfit / quote) * 100 : 0;
                const spendPercentage = quote > 0 ? (totalCost / quote) * 100 : 0;
                const receivedPercentage = quote > 0 ? (received / quote) * 100 : 0;

                return { labourCost, materialCost, totalCost, totalHours, received, potentialProfit, realisedProfit, potentialMargin, spendPercentage, receivedPercentage, quote, cashPaid, cashOwed, isCash: isCashJob(project) };
            };

            // Cloud Status Indicator (real-time)
            const CloudIndicator = () => {
                if (!db || !user) return <div className="absolute top-5 right-5 flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider text-red-500"><Cloud size={12}/> Offline</div>;
                return (
                    <div className="absolute top-5 right-5 flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider text-gray-400 bg-gray-800 px-2 py-1 rounded-lg border border-gray-700 shadow-md">
                        {saving
                            ? <><RefreshCw size={12} className="animate-spin text-yellow-400"/> Saving...</>
                            : <><span className="w-2 h-2 rounded-full bg-green-400 inline-block"></span> Live</>}
                    </div>
                );
            };

            // --- CSV EXPORT FUNCTIONS ---
            const exportAccountantCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += `Accountant Report (${exportStartDate || 'All Time'} to ${exportEndDate || 'All Time'})\n`;

                // Cash jobs stay out of this report unless the box is ticked.
                const included = projects.filter(p => includeCashJobs || !isCashJob(p));
                const heldBack = projects.length - included.length;
                if (!includeCashJobs && heldBack > 0) {
                    csvContent += `Note:,${heldBack} cash ${heldBack === 1 ? 'job' : 'jobs'} excluded from this report\n`;
                }
                csvContent += `\n`;
                csvContent += "Project Name,Client,Status,Job Type,Quoted (EUR),Labour Cost (EUR),Material Cost (EUR),Total Cost (EUR),Received (EUR),Potential Profit (EUR),Realised Profit (EUR)\n";

                included.forEach(p => {
                    const fin = getProjectFinancials(p.id, exportStartDate, exportEndDate);
                    if (fin) {
                        csvContent += `"${p.name}","${p.client}","${p.status}",${isCashJob(p) ? 'Cash' : 'Standard'},${fin.quote},${fin.labourCost},${fin.materialCost},${fin.totalCost},${fin.received},${fin.potentialProfit},${fin.realisedProfit}\n`;
                    }
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Accountant_Report_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setShowAccountantExport(false);
            };

            const exportProjectCSV = () => {
                if (!activeProject) return;
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += `Project:,${activeProject.name}\n`;
                csvContent += `Client:,${activeProject.client}\n`;
                csvContent += `Status:,${activeProject.status}\n`;
                csvContent += `Job Type:,${isCashJob(activeProject) ? 'Cash' : 'Standard'}\n`;
                csvContent += `Quote:,€${quoteOf(activeProject)}\n\n`;

                csvContent += `--- TIME LOGS ---\n`;
                csvContent += `Date,Person,Hours,Cost (EUR),Notes\n`;
                
                const pTime = timeLogs.filter(t => t.projectId === activeProject.id).sort((a,b) => new Date(b.date) - new Date(a.date));
                pTime.forEach(t => {
                    const person = people.find(p => p.id === t.personId);
                    const cost = t.hours * effectiveRate(activeProject, t.personId);
                    const dateObj = new Date(t.date);
                    const formattedDate = `${dateObj.getDate().toString().padStart(2, '0')}/${(dateObj.getMonth()+1).toString().padStart(2, '0')}/${dateObj.getFullYear()}`;
                    csvContent += `${formattedDate},"${person?.name || 'Unknown'}",${t.hours},${cost},"${t.notes || ''}"\n`;
                });

                csvContent += `\n--- MATERIAL LOGS ---\n`;
                csvContent += `Date,Item Description,Cost (EUR)\n`;
                
                const pMat = materialLogs.filter(m => m.projectId === activeProject.id).sort((a,b) => new Date(b.date) - new Date(a.date));
                pMat.forEach(m => {
                    const dateObj = new Date(m.date);
                    const formattedDate = `${dateObj.getDate().toString().padStart(2, '0')}/${(dateObj.getMonth()+1).toString().padStart(2, '0')}/${dateObj.getFullYear()}`;
                    csvContent += `${formattedDate},"${m.item}",${m.cost}\n`;
                });

                csvContent += `\n--- PAYMENTS RECEIVED ---\n`;
                csvContent += `Date,Stage,Amount (EUR)\n`;
                const pPay = payments.filter(p => p.projectId === activeProject.id).sort((a,b) => new Date(b.date) - new Date(a.date));
                pPay.forEach(p => {
                    const dateObj = new Date(p.date);
                    const formattedDate = `${dateObj.getDate().toString().padStart(2, '0')}/${(dateObj.getMonth()+1).toString().padStart(2, '0')}/${dateObj.getFullYear()}`;
                    csvContent += `${formattedDate},"${p.label || ''}",${p.amount}\n`;
                });

                if (isCashJob(activeProject)) {
                    csvContent += `\n--- CASH OUT (INTERNAL) ---\n`;
                    csvContent += `Date,Paid To,Amount (EUR),Note\n`;
                    cashOut.filter(c => c.projectId === activeProject.id)
                        .sort((a, b) => new Date(b.date) - new Date(a.date))
                        .forEach(c => {
                            const who = people.find(p => p.id === c.personId);
                            const d = new Date(c.date);
                            const fd = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getFullYear()}`;
                            csvContent += `${fd},"${who?.name || 'Unknown'}",${c.amount},"${c.note || ''}"\n`;
                        });
                }

                csvContent += `\n--- OUTSTANDING WORKS ---\n`;
                csvContent += `Status,Item,Completed,By\n`;
                const pWorks = tasks.filter(t => t.projectId === activeProject.id);
                pWorks.forEach(t => {
                    const doneDate = t.done && t.doneAt ? new Date(t.doneAt).toLocaleDateString('en-GB') : '';
                    csvContent += `${t.done ? 'Done' : 'Outstanding'},"${t.text}",${doneDate},"${t.doneBy || ''}"\n`;
                });

                csvContent += `\n--- MATERIALS NEEDED ---\n`;
                csvContent += `Status,Item,Qty,Bought,By,Cost (EUR)\n`;
                const pNeedsCsv = shoppingItems.filter(n => n.projectId === activeProject.id);
                pNeedsCsv.forEach(n => {
                    const boughtDate = n.purchased && n.purchasedAt ? new Date(n.purchasedAt).toLocaleDateString('en-GB') : '';
                    csvContent += `${n.purchased ? 'Bought' : 'To buy'},"${n.item}","${n.qty || ''}",${boughtDate},"${n.purchasedBy || ''}",${n.cost || ''}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Project_Report_${activeProject.name.replace(/\s+/g, '_')}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- VIEW: HOME / DASHBOARD ---
            const renderDashboard = () => {
                const ongoingProjects = projects.filter(p => p.status === 'Ongoing');
                const totalPipeline = projects.filter(p => p.status === 'Quotes Submitted' || p.status === 'Upcoming').reduce((sum, p) => sum + quoteOf(p), 0);
                
                return (
                    <div className="p-5 space-y-6 pb-24 relative">
                        <CloudIndicator />
                        <header className="mb-4 pr-12">
                            <h1 className="text-[16px] min-[375px]:text-[18px] sm:text-[22px] font-black text-white leading-tight whitespace-nowrap tracking-tighter">
                                <span className="text-yellow-400">T</span>imes <span className="text-yellow-400">I</span>nventory <span className="text-yellow-400">T</span>racking <span className="text-yellow-400">S</span>ystem
                            </h1>
                            <p className="text-gray-400 text-[11px] mt-1 italic font-medium whitespace-nowrap">
                                <span className="text-yellow-400 font-bold tracking-widest">[+][+]</span> Because Bigger Jobs Need Better Control.
                            </p>
                        </header>

                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-inner">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Active Jobs</h3>
                                <p className="text-3xl font-bold text-white">{ongoingProjects.length}</p>
                            </div>
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-inner">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Pipeline (Quotes)</h3>
                                <p className="text-xl font-bold text-blue-400">{formatCurrency(totalPipeline)}</p>
                            </div>
                        </div>

                        {/* Accountant Export Button */}
                        <button onClick={() => setShowAccountantExport(true)} className="w-full bg-gray-800 border border-gray-700 hover:border-yellow-400 text-gray-300 py-3 rounded-xl flex items-center justify-center gap-2 transition-colors text-sm font-bold shadow-sm">
                            <FileSpreadsheet className="text-yellow-400" size={18} />
                            Accountant Excel Export
                        </button>

                        <div>
                            <h2 className="text-lg font-bold text-white mb-3 flex items-center gap-2"><Activity size={18} className="text-yellow-400"/> Health Check (Ongoing)</h2>
                            <div className="space-y-4">
                                {ongoingProjects.length === 0 && <p className="text-gray-500 text-sm p-4 bg-gray-800/50 rounded-xl border border-gray-800 text-center">No ongoing jobs. Update a status in the Jobs tab.</p>}
                                
                                {ongoingProjects.map(project => {
                                    const fin = getProjectFinancials(project.id);
                                    let statusColor = 'bg-green-500';
                                    let statusText = 'Healthy';
                                    if (fin.spendPercentage > 85 && fin.spendPercentage <= 100) { statusColor = 'bg-orange-500'; statusText = 'Overspend Risk'; }
                                    if (fin.spendPercentage > 100) { statusColor = 'bg-red-500'; statusText = 'Loss Making'; }

                                    return (
                                        <div key={project.id} onClick={() => { setActiveProject(project); setView('project-detail'); }} className="bg-gray-800 p-4 rounded-xl border border-gray-700 active:bg-gray-700 transition-colors cursor-pointer shadow-md">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-white">{project.name}</h3>
                                                <span className={`text-[10px] font-bold px-2 py-1 rounded-full text-white ${statusColor}`}>{statusText}</span>
                                            </div>
                                            <div className="flex justify-between text-sm mb-2">
                                                <span className="text-gray-400">Potential: <span className={fin.potentialMargin > 20 ? 'text-green-400' : fin.potentialMargin > 0 ? 'text-orange-400' : 'text-red-400'}>{fin.potentialMargin.toFixed(1)}%</span></span>
                                                <span className="text-white font-bold">{formatCurrency(fin.potentialProfit)}</span>
                                            </div>
                                            <div className="w-full bg-gray-700 rounded-full h-2">
                                                <div className={`${statusColor} h-2 rounded-full`} style={{ width: `${Math.min(fin.spendPercentage, 100)}%` }}></div>
                                            </div>

                                            {(openTasksFor(project.id) > 0 || openNeedsFor(project.id) > 0 || isCashJob(project)) && (
                                                <div className="flex flex-wrap gap-2 mt-3">
                                                    {openTasksFor(project.id) > 0 && (
                                                        <span className="text-[10px] font-bold px-2 py-1 rounded-full bg-yellow-400/10 text-yellow-400 flex items-center gap-1">
                                                            <ClipboardList size={11}/> {openTasksFor(project.id)} to do
                                                        </span>
                                                    )}
                                                    {openNeedsFor(project.id) > 0 && (
                                                        <span className="text-[10px] font-bold px-2 py-1 rounded-full bg-purple-400/10 text-purple-400 flex items-center gap-1">
                                                            <ShoppingCart size={11}/> {openNeedsFor(project.id)} to buy
                                                        </span>
                                                    )}
                                                    {isCashJob(project) && (
                                                        <span className="text-[10px] font-bold px-2 py-1 rounded-full bg-emerald-400/10 text-emerald-400 flex items-center gap-1">
                                                            <Banknote size={11}/> Cash
                                                        </span>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Accountant Export Modal */}
                        {showAccountantExport && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                                <div className="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative">
                                    <button onClick={() => setShowAccountantExport(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white">
                                        <X size={20} />
                                    </button>
                                    <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2">
                                        <FileSpreadsheet className="text-yellow-400" size={24} /> Export Report
                                    </h3>
                                    <p className="text-sm text-gray-400 mb-6">Select a date range to generate an Excel-compatible report of all projects and costs.</p>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">Start Date (Optional)</label>
                                            <input type="date" value={exportStartDate} onChange={e => setExportStartDate(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-yellow-400 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">End Date (Optional)</label>
                                            <input type="date" value={exportEndDate} onChange={e => setExportEndDate(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-yellow-400 outline-none" />
                                        </div>
                                        
                                        <label className="flex items-center justify-between gap-3 bg-gray-900 border border-gray-700 rounded-xl p-3 cursor-pointer">
                                            <span>
                                                <span className="block text-sm font-bold text-white">Include cash jobs</span>
                                                <span className="block text-[11px] text-gray-500 mt-0.5">Off by default. {projects.filter(p => isCashJob(p)).length} cash {projects.filter(p => isCashJob(p)).length === 1 ? 'job' : 'jobs'} on file.</span>
                                            </span>
                                            <button type="button" onClick={() => setIncludeCashJobs(!includeCashJobs)} className={`shrink-0 w-14 h-8 rounded-full transition-colors relative ${includeCashJobs ? 'bg-emerald-500' : 'bg-gray-600'}`}>
                                                <span className={`absolute top-1 w-6 h-6 bg-white rounded-full transition-all ${includeCashJobs ? 'left-7' : 'left-1'}`}></span>
                                            </button>
                                        </label>

                                        <button onClick={exportAccountantCSV} className="w-full bg-yellow-400 text-gray-900 hover:bg-yellow-300 font-bold py-3 rounded-xl mt-4 flex justify-center items-center gap-2">
                                            <Download size={18} /> Download CSV
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- VIEW: PROJECTS LIST ---
            const renderProjects = () => {
                const statuses = ['All', 'Quotes Submitted', 'Upcoming', 'Ongoing', 'Completed'];
                const filtered = projectFilter === 'All' ? projects : projects.filter(p => p.status === projectFilter);

                const updateProjectStatus = (projectId, newStatus) => {
                    const updated = { ...projects.find(p => p.id === projectId), status: newStatus };
                    const updatedProjects = projects.map(p => p.id === projectId ? updated : p);
                    handleSetProjects(updatedProjects, 'upsert', updated);
                };

                return (
                    <div className="p-5 space-y-4 pb-24 relative">
                        <CloudIndicator />
                        <h1 className="text-2xl font-bold text-yellow-400 mt-8">Jobs</h1>
                        <button onClick={() => setView('add-project')} className="w-full bg-yellow-400 text-gray-900 px-3 py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-1 shadow-lg shadow-yellow-400/20">
                            <Plus size={16} /> New Job
                        </button>

                        <div className="flex gap-2 overflow-x-auto pb-2 -mx-5 px-5 scrollbar-hide" style={{ WebkitOverflowScrolling: 'touch' }}>
                            {statuses.map(s => (
                                <button key={s} onClick={() => setProjectFilter(s)} className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold transition-colors ${projectFilter === s ? 'bg-yellow-400 text-gray-900' : 'bg-gray-800 text-gray-400 border border-gray-700'}`}>
                                    {s}
                                </button>
                            ))}
                        </div>

                        <div className="space-y-3">

            // --- VIEW: EDIT EXISTING PROJECT ---
            const renderEditProject = () => {
                const handleSave = () => {

                    const updatedProject = {

                    setActiveProject(saved);

                const handleDelete = () => {
                    const tl = timeLogs.filter(t => t.projectId === activeProject.id);
                    const ml = materialLogs.filter(m => m.projectId === activeProject.id);
                    const pm = payments.filter(p => p.projectId === activeProject.id);

                    const nd = shoppingItems.filter(n => n.projectId === activeProject.id);

                    const cr = cashRates.filter(c => c.projectId === activeProject.id);

                    if (!window.confirm(msg)) return;
                    tl.forEach(t => pushOp('delete', 'timeLogs', t));

                    rs.forEach(r => pushOp('delete', 'rosterEntries', r));
                    tk.forEach(t => pushOp('delete', 'tasks', t));

                    cr.forEach(c => pushOp('delete', 'cashRates', c));

                    setPayments(payments.filter(p => p.projectId !== activeProject.id));

                    setShoppingItems(shoppingItems.filter(n => n.projectId !== activeProject.id));
                    setProjectFinance(projectFinance.filter(f => f.id !== activeProject.id));

                                </button>
                            </div>

            // --- VIEW: PROJECT DETAILS & ANALYTICS ---
            const renderProjectDetail = () => {
                if (!activeProject) return null;
                const fin = getProjectFinancials(activeProject.id);
                const pTimeLogs = timeLogs.filter(t => t.projectId === activeProject.id).sort((a,b) => new Date(b.date) - new Date(a.date));
                const pMaterialLogs = materialLogs.filter(m => m.projectId === activeProject.id).sort((a,b) => new Date(b.date) - new Date(a.date));
                const pPayments = payments.filter(p => p.projectId === activeProject.id).sort((a,b) => new Date(b.date) - new Date(a.date));

                const updateStatus = (newStatus) => {
                    const updated = { ...activeProject, status: newStatus };
                    handleSetProjects(projects.map(p => p.id === activeProject.id ? updated : p), 'upsert', updated);
                    setActiveProject(updated);
                };

                // --- Outstanding works ---
                const pTasks = tasks.filter(t => t.projectId === activeProject.id);
                const openWorks = pTasks.filter(t => !t.done).sort((a, b) => (a.createdAt || '') < (b.createdAt || '') ? -1 : 1);
                const doneWorks = pTasks.filter(t => t.done).sort((a, b) => (a.doneAt || '') < (b.doneAt || '') ? 1 : -1);

                const addTask = () => {
                    const text = newTaskText.trim();
                    if (!text) return;
                    const rec = { id: newId('task'), projectId: activeProject.id, text, done: false, doneAt: '', doneBy: '', createdAt: new Date().toISOString(), createdBy: whoAmI() };
                    handleSetTasks([...tasks, rec], 'upsert', rec);
                    setNewTaskText('');
                };
                const toggleTask = (t) => {
                    const nowDone = !t.done;
                    const rec = { ...t, done: nowDone, doneAt: nowDone ? new Date().toISOString() : '', doneBy: nowDone ? whoAmI() : '' };
                    handleSetTasks(tasks.map(x => x.id === t.id ? rec : x), 'upsert', rec);
                };
                const saveTaskEdit = (t) => {
                    const text = editingTaskText.trim();
                    if (text) {
                        const rec = { ...t, text };
                        handleSetTasks(tasks.map(x => x.id === t.id ? rec : x), 'upsert', rec);
                    }
                    setEditingTaskId(null); setEditingTaskText('');
                };
                const deleteTask = (t) => {
                    if (!window.confirm('Remove "' + t.text + '" from the works list?')) return;
                    handleSetTasks(tasks.filter(x => x.id !== t.id), 'delete', t);
                };

                // --- Materials needed ---
                const pNeeds = shoppingItems.filter(n => n.projectId === activeProject.id);
                const openNeeds = pNeeds.filter(n => !n.purchased).sort((a, b) => (a.createdAt || '') < (b.createdAt || '') ? -1 : 1);
                const boughtNeeds = pNeeds.filter(n => n.purchased).sort((a, b) => (a.purchasedAt || '') < (b.purchasedAt || '') ? 1 : -1);

                const addNeed = () => {
                    const item = newNeedItem.trim();
                    if (!item) return;
                    const rec = { id: newId('need'), projectId: activeProject.id, item, qty: newNeedQty.trim(), purchased: false, purchasedAt: '', purchasedBy: '', materialLogId: '', createdAt: new Date().toISOString(), createdBy: whoAmI() };
                    handleSetShopping([...shoppingItems, rec], 'upsert', rec);
                    setNewNeedItem(''); setNewNeedQty('');
                };
                const saveNeedEdit = (n) => {
                    const item = editingNeedItem.trim();
                    if (item) {
                        const rec = { ...n, item, qty: editingNeedQty.trim() };
                        handleSetShopping(shoppingItems.map(x => x.id === n.id ? rec : x), 'upsert', rec);
                    }
                    setEditingNeedId(null); setEditingNeedItem(''); setEditingNeedQty('');
                };
                const deleteNeed = (n) => {
                    if (!window.confirm('Remove "' + n.item + '" from the materials list?')) return;
                    handleSetShopping(shoppingItems.filter(x => x.id !== n.id), 'delete', n);
                };
                const openBuy = (n) => { setBuyingItem(n); setBuyCost(''); setBuyDate(new Date().toISOString().split('T')[0]); };

                // Ticking an item off marks it bought. If a cost is entered it also
                // writes a normal material entry against the job, so the spend shows
                // up in the financials exactly as a manually logged receipt would.
                const confirmBuy = () => {
                    const n = buyingItem;
                    if (!n) return;
                    const cost = buyCost === '' ? null : Number(buyCost);
                    // No price is stored on the item itself - it goes on the material
                    // entry only, which is owner-only. Crew never hold a cost field.
                    const rec = { ...n, purchased: true, purchasedAt: new Date(buyDate).toISOString(), purchasedBy: whoAmI(), materialLogId: '' };
                    delete rec.cost;
                    if (cost !== null && !isNaN(cost) && cost > 0) {
                        const log = { id: newId('mat'), projectId: n.projectId, item: needLabel(n), cost: cost, date: new Date(buyDate).toISOString(), sourceNeedId: n.id };
                        rec.materialLogId = log.id;
                        handleSetMaterialLogs([log, ...materialLogs], 'upsert', log);
                    }
                    handleSetShopping(shoppingItems.map(x => x.id === n.id ? rec : x), 'upsert', rec);
                    setBuyingItem(null); setBuyCost('');
                };

                // Un-ticking puts the item back on the list and takes its cost back
                // off the job, so a mistaken tick never leaves a stray material entry.
                const unbuy = (n) => {
                    const linked = n.materialLogId ? materialLogs.find(m => m.id === n.materialLogId) : null;
                    const msg = linked
                        ? 'Put "' + n.item + '" back on the needed list and remove its ' + formatCurrency(linked.cost) + ' material entry from this job?'
                        : 'Put "' + n.item + '" back on the needed list?';
                    if (!window.confirm(msg)) return;
                    if (linked) handleSetMaterialLogs(materialLogs.filter(m => m.id !== linked.id), 'delete', linked);
                    const rec = { ...n, purchased: false, purchasedAt: '', purchasedBy: '', materialLogId: '' };
                    delete rec.cost;
                    handleSetShopping(shoppingItems.map(x => x.id === n.id ? rec : x), 'upsert', rec);
                };

                // --- Cash out (cash jobs only) ---
                const cashJob = isCashJob(activeProject);
                const pCashOut = cashOut.filter(c => c.projectId === activeProject.id).sort((a, b) => new Date(b.date) - new Date(a.date));
                const cashRows = !cashJob ? [] : people.map(person => {
                    const hrs = pTimeLogs.filter(t => t.personId === person.id).reduce((sum, t) => sum + Number(t.hours), 0);
                    const paid = pCashOut.filter(c => c.personId === person.id).reduce((sum, c) => sum + Number(c.amount), 0);
                    const agreed = cashRateFor(activeProject.id, person.id);
                    const rate = effectiveRate(activeProject, person.id);
                    const earned = hrs * rate;
                    return { person, hrs, rate, agreed, earned, paid, balance: earned - paid };
                }).filter(r => r.hrs > 0 || r.paid > 0 || r.agreed !== null);

                const cashEarnedTotal = cashRows.reduce((sum, r) => sum + r.earned, 0);
                const cashPaidTotal = cashRows.reduce((sum, r) => sum + r.paid, 0);

                const saveCashRate = (personId) => {
                    const id = 'cr_' + activeProject.id + '_' + personId;
                    const rec = { id, projectId: activeProject.id, personId, rate: rateInput === '' ? null : Number(rateInput) };
                    handleSetCashRates([...cashRates.filter(c => c.id !== id), rec], 'upsert', rec);
                    setEditingRateFor(null); setRateInput('');
                };

                // --- Who can see this job in the crew app ---
                const crewUsers = users.filter(u => u.role === 'crew');
                const assigned = activeProject.crew || [];
                const toggleCrew = (uid) => {
                    const next = assigned.includes(uid) ? assigned.filter(x => x !== uid) : [...assigned, uid];
                    const updated = { ...activeProject, crew: next };
                    handleSetProjects(projects.map(p => p.id === activeProject.id ? updated : p), 'upsert', updated);
                    setActiveProject(updated);

                const openEditProject = () => {
                    setEditProjName(activeProject.name);
                    setEditProjClient(activeProject.client);
                    setEditProjQuote(quoteOf(activeProject));
                    setEditProjStart(activeProject.startDate || '');

                    setView('edit-project');

                return (
                    <div className="flex flex-col min-h-screen bg-gray-900 pb-24">
                        <header className="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-10 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setView('main')} className="p-2 -ml-2 text-gray-400 hover:text-white"><ArrowLeft size={24} /></button>
                                <div>
                                    <h1 className="text-lg font-bold text-white leading-tight">{activeProject.name}</h1>
                                    <p className="text-xs text-yellow-400">{activeProject.status}</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-1">
                                <button onClick={openEditProject} className="p-2 text-gray-400 hover:text-yellow-400 transition-colors" title="Edit Job Details">
                                    <Edit size={20} />
                                </button>
                                <button onClick={exportProjectCSV} className="p-2 text-gray-400 hover:text-yellow-400 transition-colors" title="Export Project CSV">
                                    <Download size={22} />
                                </button>
                            </div>
                        </header>

                        <div className="p-4 space-y-6">
                            <div className="bg-gray-800 rounded-xl p-2 border border-gray-700 flex relative">
                                <select value={activeProject.status} onChange={e => updateStatus(e.target.value)} className="bg-transparent text-white w-full p-2 outline-none font-bold text-sm appearance-none">
                                    <option value="Quotes Submitted" className="bg-gray-800">Status: Quote Submitted</option>
                                    <option value="Upcoming" className="bg-gray-800">Status: Upcoming</option>
                                    <option value="Ongoing" className="bg-gray-800">Status: Ongoing (Active)</option>
                                    <option value="Completed" className="bg-gray-800">Status: Completed</option>
                                </select>
                                <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                                    <ChevronRight size={16} className="rotate-90" />
                                </div>
                            </div>

                            <div className="bg-gray-800 rounded-xl p-5 border border-gray-700 shadow-lg">
                                <h3 className="text-gray-400 text-xs font-bold uppercase mb-4 flex items-center gap-2"><PieChart size={14}/> Financial Analytics</h3>
                                <div className="flex justify-between items-end mb-2">
                                    <div>
                                        <p className="text-sm text-gray-400">Total Spend</p>
                                        <p className="text-2xl font-bold text-white">{formatCurrency(fin.totalCost)}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-sm text-gray-400">Quoted</p>
                                        <p className="text-lg font-bold text-white">{formatCurrency(fin.quote)}</p>
                                    </div>
                                </div>
                                
                                <div className="w-full bg-gray-700 rounded-full h-3 mb-1 overflow-hidden">

            // --- VIEW: SETTINGS ---

                        {/* One-off data migration */}
                        {user && (() => {

                            const todo = needFinance.length + needCrew.length + needItems.length;

                            const runMigration = async () => {
                                if (!window.confirm('Move quotes and cash flags into their own owner-only records? Run this once, before publishing the new rules.')) return;
                                setMigrating('Working...');
                                try {
                                    for (const p of needFinance) {
                                        const finRec = { id: p.id, quote: Number(p.quote || 0), payMode: p.payMode || 'standard' };
                                        await pushOp('upsert', 'projectFinance', finRec);
                                    }
                                    for (const p of projects) {
                                        const stripped = { ...p, crew: Array.isArray(p.crew) ? p.crew : [] };
                                        delete stripped.quote;

                                        await pushOp('upsert', 'projects', stripped);

                                    for (const n of needItems) {

                                                    : ' · no owner record yet (create users/' + user.uid + " with role 'owner' in the Firebase console before publishing the new rules)"}
                                        </p>

                        })()}

                        {/* Account */}
                        {user && (
                            <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-3 shadow-lg">
                                <h3 className="font-bold text-white flex items-center gap-2"><Users size={18} className="text-yellow-400"/> Account</h3>

                                    Sign Out

            // --- VIEW: LOGIN ---
            const renderLogin = () => {

                            </button>

                        </div>
                    </div>
