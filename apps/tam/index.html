            };

            // --- VIEW: ANALYTICS ---
            const renderAnalytics = () => {
                const statuses = ['All', 'Quotes Submitted', 'Upcoming', 'Ongoing', 'Completed'];
                const statusProjects = analyticsFilter === 'All' ? projects : projects.filter(p => p.status === analyticsFilter);
                const siteValid = analyticsSite !== 'All' && statusProjects.some(p => p.id === analyticsSite);
                const scopedProjects = siteValid ? statusProjects.filter(p => p.id === analyticsSite) : statusProjects;
                const scopedIds = new Set(scopedProjects.map(p => p.id));

                // Per-job financials
                const jobStats = scopedProjects
                    .map(p => {
                        const fin = getProjectFinancials(p.id);
                        return fin ? { id: p.id, name: p.name, status: p.status, ...fin } : null;
                    })
                    .filter(Boolean);

                const totalLabour = jobStats.reduce((s, j) => s + j.labourCost, 0);
                const totalMaterials = jobStats.reduce((s, j) => s + j.materialCost, 0);
                const totalSpend = totalLabour + totalMaterials;
                const totalPotential = jobStats.reduce((s, j) => s + j.potentialProfit, 0);
                const totalReceived = jobStats.reduce((s, j) => s + j.received, 0);
                const totalRealised = totalReceived - totalSpend;

                // Potential profit by job (only jobs with a quote or some spend)
                const profitJobs = jobStats
                    .filter(j => j.quote > 0 || j.totalCost > 0)
                    .sort((a, b) => b.potentialProfit - a.potentialProfit);
                const maxAbsProfit = Math.max(1, ...profitJobs.map(j => Math.abs(j.potentialProfit)));

                // Hours per team member (only on the jobs in scope)
                const hoursByPerson = people
                    .map(person => {
                        const hrs = timeLogs
                            .filter(t => t.personId === person.id && scopedIds.has(t.projectId))
                            .reduce((s, t) => s + Number(t.hours), 0);
                        const cost = timeLogs
                            .filter(t => t.personId === person.id && scopedIds.has(t.projectId))
                            .reduce((s, t) => s + Number(t.hours) * effectiveRate(projects.find(p => p.id === t.projectId), person.id), 0);
                        return { id: person.id, name: person.name, role: person.role, hrs, cost };
                    })
                    .filter(p => p.hrs > 0)
                    .sort((a, b) => b.hrs - a.hrs);
                const maxHrs = Math.max(1, ...hoursByPerson.map(p => p.hrs));

                // Jobs not yet completed, longest-running first (by start date, or by
                // when the job was created if no start date is set).
                const today = new Date();
                const runningJobs = scopedProjects
                    .filter(p => p.status !== 'Completed')
                    .map(p => {
                        const start = p.startDate ? new Date(p.startDate) : (p.date ? new Date(p.date) : today);
                        const days = Math.max(0, Math.floor((today - start) / 86400000));
                        return { id: p.id, name: p.name, status: p.status, days, hasStart: !!p.startDate };
                    })
                    .sort((a, b) => b.days - a.days);
                const maxDays = Math.max(1, ...runningJobs.map(j => j.days));

                // Cash owed per lad, across every cash job in this view. Earned is
                // hours x the agreed cash rate; paid is what has actually been handed
                // over. The difference is what is still owed.
                const cashProjects = scopedProjects.filter(p => isCashJob(p));
                const cashProjectIds = new Set(cashProjects.map(p => p.id));
                const cashByPerson = people
                    .map(person => {
                        let earned = 0, hrs = 0;
                        timeLogs.filter(t => cashProjectIds.has(t.projectId) && t.personId === person.id).forEach(t => {
                            const proj = projects.find(p => p.id === t.projectId);
                            hrs += Number(t.hours);
                            earned += Number(t.hours) * effectiveRate(proj, person.id);
                        });
                        const paid = cashOut.filter(c => cashProjectIds.has(c.projectId) && c.personId === person.id).reduce((sum, c) => sum + Number(c.amount), 0);
                        return { id: person.id, name: person.name, hrs, earned, paid, owed: earned - paid };
                    })
                    .filter(r => r.earned > 0 || r.paid > 0)
                    .sort((a, b) => b.owed - a.owed);
                const cashOwedTotal = cashByPerson.reduce((sum, r) => sum + r.owed, 0);

                // Donut geometry for labour vs materials
                const R = 42, C = 2 * Math.PI * R;
                const labourFrac = totalSpend > 0 ? totalLabour / totalSpend : 0;
                const labourLen = labourFrac * C;

                const Section = ({ icon, title, children }) => (
                    <div className="bg-gray-800 rounded-xl p-5 border border-gray-700 shadow-lg">
                        <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4 flex items-center gap-2">{icon} {title}</h3>
                        {children}
                    </div>
                );

                return (
                    <div className="p-5 space-y-6 pb-24 relative">
                        <CloudIndicator />
                        <h1 className="text-2xl font-bold text-yellow-400 mb-2">Analytics</h1>

                        {/* Status filter */}
                        <div className="flex gap-2 overflow-x-auto pb-2 -mx-5 px-5 scrollbar-hide" style={{ WebkitOverflowScrolling: 'touch' }}>
                            {statuses.map(s => (
                                <button key={s} onClick={() => { setAnalyticsFilter(s); setAnalyticsSite('All'); }} className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold transition-colors ${analyticsFilter === s ? 'bg-yellow-400 text-gray-900' : 'bg-gray-800 text-gray-400 border border-gray-700'}`}>
                                    {s}
                                </button>
                            ))}
                        </div>

                        {/* Site selector */}
                        <div className="relative">
                            <select value={siteValid ? analyticsSite : 'All'} onChange={e => setAnalyticsSite(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 pr-10 text-white text-sm font-bold appearance-none focus:border-yellow-400 outline-none">
                                <option value="All" className="bg-gray-800">All sites{analyticsFilter !== 'All' ? ` (${analyticsFilter})` : ''}</option>
                                {statusProjects.map(p => <option key={p.id} value={p.id} className="bg-gray-800">{p.name}</option>)}
                            </select>
                            <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                                <ChevronRight size={16} className="rotate-90" />
                            </div>
                        </div>

                        {/* KPI row */}
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-inner">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Potential Profit</h3>
                                <p className={`text-2xl font-bold ${totalPotential >= 0 ? 'text-green-400' : 'text-red-400'}`}>{formatCurrency(totalPotential)}</p>
                            </div>
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-inner">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Total Spend</h3>
                                <p className="text-2xl font-bold text-white">{formatCurrency(totalSpend)}</p>
                            </div>
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-inner">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Received</h3>
                                <p className="text-2xl font-bold text-green-400">{formatCurrency(totalReceived)}</p>
                            </div>
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-inner">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Realised Profit</h3>
                                <p className={`text-2xl font-bold ${totalRealised >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(totalRealised)}</p>
                            </div>

            // --- VIEW: EDIT CASH PAID ---
            const renderEditCash = () => {
                if (!editingCashOut) return null;

                const handleSave = () => {
                    if (!editCashPersonId || editCashAmount === '') return alert('Pick a person and enter an amount.');
                    const rec = { ...editingCashOut, personId: editCashPersonId, amount: Number(editCashAmount), date: new Date(editCashDate).toISOString(), note: editCashNote.trim() };
                    handleSetCashOut(cashOut.map(c => c.id === editingCashOut.id ? rec : c), 'upsert', rec);
                    setEditingCashOut(null);
                    setView('project-detail');
                };

                const handleDelete = () => {
                    if (!window.confirm('Delete this cash payment?')) return;
                    handleSetCashOut(cashOut.filter(c => c.id !== editingCashOut.id), 'delete', editingCashOut);
                    setEditingCashOut(null);
                    setView('project-detail');

                return (

                        <div className="space-y-4">

                                <label className="block text-sm font-bold text-gray-400 mb-1">Paid To</label>
                                <select value={editCashPersonId} onChange={e => setEditCashPersonId(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:border-emerald-400 outline-none appearance-none">
                                    {people.map(p => <option key={p.id} value={p.id} className="bg-gray-800">{p.name}</option>)}

            // --- VIEW: ROSTER (calendar) ---
            const renderRoster = () => {
                const ref = parseYMD(rosterRef);
                const todayYMD = formatYMD(new Date());
                const pName = id => (people.find(p => p.id === id) || {}).name || 'Unknown';
                const jName = id => (projects.find(p => p.id === id) || {}).name || 'Unknown';
                const entriesFor = ymd => rosterEntries.filter(r => r.date === ymd);

                const shift = (n) => {
                    const d = parseYMD(rosterRef);
                    if (rosterMode === 'month') d.setMonth(d.getMonth() + n);
                    else if (rosterMode === 'week') d.setDate(d.getDate() + 7 * n);
                    else d.setDate(d.getDate() + n);
                    setRosterRef(formatYMD(d));
                };

                const addAssignment = () => {
                    if (!assignSite || !assignPerson) return alert('Pick a site and a person.');
                    if (rosterEntries.some(r => r.date === rosterRef && r.projectId === assignSite && r.personId === assignPerson)) return alert('That person is already on that site for this day.');
                    const entry = { id: 'rost_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), projectId: assignSite, personId: assignPerson, date: rosterRef };
                    handleSetRoster([...rosterEntries, entry], 'upsert', entry);
                    setAssignPerson('');

                const removeEntry = (entry) => handleSetRoster(rosterEntries.filter(r => r.id !== entry.id), 'delete', entry);

                let label = '';
                if (rosterMode === 'month') label = ref.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                else if (rosterMode === 'week') { const s = startOfWeekMon(ref); const e = new Date(s); e.setDate(s.getDate() + 6); label = `${s.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} - ${e.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`; }
                else label = ref.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

                const monthCells = [];
                if (rosterMode === 'month') {
                    const start = startOfWeekMon(new Date(ref.getFullYear(), ref.getMonth(), 1));
                    for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); monthCells.push(d); }
                }

                return (
                    <div className="p-5 space-y-4 pb-24 relative">
                        <CloudIndicator />
                        <h1 className="text-2xl font-bold text-yellow-400 mt-8">Roster</h1>

                        <div className="flex gap-2">
                            {['day', 'week', 'month'].map(m => (
                                <button key={m} onClick={() => setRosterMode(m)} className={`flex-1 py-2 rounded-lg text-sm font-bold capitalize ${rosterMode === m ? 'bg-yellow-400 text-gray-900' : 'bg-gray-800 text-gray-400 border border-gray-700'}`}>{m}</button>
                            ))}
                        </div>

                        <div className="flex items-center justify-between">
                            <button onClick={() => shift(-1)} className="p-2 bg-gray-800 rounded-lg border border-gray-700"><ChevronRight size={18} className="rotate-180 text-gray-300" /></button>
                            <div className="text-center">
                                <p className="font-bold text-white">{label}</p>
                                <button onClick={() => setRosterRef(todayYMD)} className="text-[11px] text-yellow-400 font-bold">Today</button>
                            </div>
                            <button onClick={() => shift(1)} className="p-2 bg-gray-800 rounded-lg border border-gray-700"><ChevronRight size={18} className="text-gray-300" /></button>
                        </div>

                        {rosterMode === 'month' && (
                            <div>
                                <div className="grid grid-cols-7 gap-1 mb-1">
                                    {['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => <div key={i} className="text-center text-[10px] font-bold text-gray-500">{d}</div>)}
                                </div>
                                <div className="grid grid-cols-7 gap-1">
                                    {monthCells.map((d, i) => {
                                        const ymd = formatYMD(d); const inMonth = d.getMonth() === ref.getMonth(); const count = entriesFor(ymd).length; const isToday = ymd === todayYMD;
                                        return (
                                            <button key={i} onClick={() => { setRosterRef(ymd); setRosterMode('day'); }} className={`aspect-square rounded-lg flex flex-col items-center justify-center text-xs ${inMonth ? 'bg-gray-800 border border-gray-700' : 'bg-gray-900/40 border border-transparent text-gray-600'} ${isToday ? 'ring-1 ring-yellow-400' : ''}`}>
                                                <span className={inMonth ? 'text-white' : ''}>{d.getDate()}</span>
                                                {count > 0 && <span className="mt-0.5 text-[9px] font-bold text-gray-900 bg-yellow-400 rounded-full px-1.5">{count}</span>}
                                            </button>
                                        );
                                    })}
                                </div>
                                <p className="text-[11px] text-gray-500 mt-2 text-center">Tap a day to view and edit its roster.</p>
                            </div>
                        )}

                        {rosterMode === 'week' && (
                            <div className="space-y-2">
                                {Array.from({ length: 7 }).map((_, i) => {
                                    const s = startOfWeekMon(ref); const d = new Date(s); d.setDate(s.getDate() + i); const ymd = formatYMD(d); const ents = entriesFor(ymd); const isToday = ymd === todayYMD;
                                    return (
                                        <div key={i} className={`bg-gray-800 rounded-xl border ${isToday ? 'border-yellow-400' : 'border-gray-700'} p-3`}>
                                            <div className="flex justify-between items-center mb-1">
                                                <button onClick={() => { setRosterRef(ymd); setRosterMode('day'); }} className="font-bold text-white text-sm">{d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })}</button>

                                                <div className="flex flex-wrap gap-1">

                                                        <span key={e.id} className="text-[11px] bg-gray-900 border border-gray-700 rounded-full px-2 py-1 text-gray-200 flex items-center gap-1">
                                                            {pName(e.personId)} <span className="text-gray-500">@ {jName(e.projectId)}</span>
                                                            <button onClick={() => removeEntry(e)} className="text-gray-500 hover:text-red-400"><X size={11} /></button>
                                                        </span>
                                                    ))}
                                                </div>}
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {rosterMode === 'day' && (

                                    <h3 className="text-sm font-bold text-white">Assign someone</h3>
                                    <select value={assignSite} onChange={e => setAssignSite(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm appearance-none focus:border-yellow-400 outline-none">
                                        <option value="">Select site...</option>
                                        {projects.filter(p => p.status !== 'Completed').map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>
                                    <select value={assignPerson} onChange={e => setAssignPerson(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm appearance-none focus:border-yellow-400 outline-none">

                                    <button onClick={addAssignment} className="w-full bg-yellow-400 text-gray-900 font-bold py-3 rounded-xl flex justify-center items-center gap-2"><Plus size={18} /> Add to {prettyDate(rosterRef)}</button>

                                <div className="space-y-2">
                                    {entriesFor(rosterRef).length === 0 ? <p className="text-center text-gray-500 text-sm py-6">No one rostered for this day.</p> :
                                        entriesFor(rosterRef).map(e => (

                                                <button onClick={() => removeEntry(e)} className="text-gray-500 hover:text-red-400 p-1"><Trash2 size={16} /></button>

            // --- VIEW: ROSTER FOR A JOB ---
            const renderRosterJob = () => {

                    const entry = { id: 'rost_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), projectId: activeProject.id, personId: jobRosterPerson, date: jobRosterDate };
                    handleSetRoster([...rosterEntries, entry], 'upsert', entry);
                    setJobRosterPerson('');
                };
                const removeEntry = (entry) => handleSetRoster(rosterEntries.filter(r => r.id !== entry.id), 'delete', entry);

                return (
                    <div className="p-5 pt-10 min-h-screen bg-gray-900 z-50">
                        <button onClick={() => setView('project-detail')} className="text-gray-400 mb-6 flex items-center gap-2"><ArrowLeft size={20} /> Back</button>
                        <h2 className="text-2xl font-bold text-white mb-1">Roster</h2>
                        <p className="text-yellow-400 text-sm mb-6">{activeProject.name}</p>

                        <div className="bg-gray-800 rounded-xl border border-gray-700 p-4 space-y-3 mb-6">
                            <h3 className="text-sm font-bold text-white">Add a day</h3>
                            <input type="date" value={jobRosterDate} onChange={e => setJobRosterDate(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-yellow-400 outline-none" />
                            <select value={jobRosterPerson} onChange={e => setJobRosterPerson(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm appearance-none focus:border-yellow-400 outline-none">
                                <option value="">Select person...</option>
                                {people.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                            </select>
                            <button onClick={addJobRoster} className="w-full bg-yellow-400 text-gray-900 font-bold py-3 rounded-xl flex justify-center items-center gap-2"><Plus size={18} /> Add to Roster</button>
                        </div>

                        <h3 className="font-bold text-white border-b border-gray-700 pb-2 mb-3 flex items-center gap-2"><Calendar size={16} /> Scheduled Days</h3>
                        <div className="space-y-2">
                            {jobEntries.length === 0 ? <p className="text-center text-gray-500 text-sm py-4">No days rostered yet.</p> :
                                jobEntries.map(e => (
                                    <div key={e.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center">
                                        <div>
                                            <p className="font-bold text-white text-sm">{prettyDate(e.date)}</p>
                                            <p className="text-xs text-gray-400">{pName(e.personId)}</p>
                                        </div>
                                        <button onClick={() => removeEntry(e)} className="text-gray-500 hover:text-red-400 p-1"><Trash2 size={16} /></button>
                                    </div>
                                ))}
                        </div>
                    </div>
                );
            };

            // --- VIEW: LOG PAYMENT ---
            const renderAddPayment = () => {
                if (!activeProject) return null;
                const handleSave = () => {
                    if (!payAmount) return alert('Enter a payment amount.');
                    const label = payStage === 'Other' ? (payOther.trim() || 'Other') : payStage;
                    const rec = { id: 'pay_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), projectId: activeProject.id, amount: Number(payAmount), date: new Date(payDate).toISOString(), label };
                    handleSetPayments([rec, ...payments], 'upsert', rec);
                    setPayAmount(''); setPayOther(''); setPayStage('Preliminary Works'); setPayDate(new Date().toISOString().split('T')[0]);
                    setView('project-detail');
                };

                return (
                    <div className="p-5 pt-10 min-h-screen bg-gray-900 z-50">
                        <button onClick={() => setView('project-detail')} className="text-gray-400 mb-6 flex items-center gap-2"><ArrowLeft size={20}/> Cancel</button>
                        <h2 className="text-2xl font-bold text-white mb-6">Log Payment for<br/><span className="text-yellow-400 text-lg">{activeProject?.name}</span></h2>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-gray-400 mb-1">Date Received</label>
                                <input type="date" value={payDate} onChange={e => setPayDate(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:border-yellow-400 outline-none" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-400 mb-1">Stage</label>
                                <select value={payStage} onChange={e => setPayStage(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white appearance-none focus:border-yellow-400 outline-none">
                                    {PAY_STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            {payStage === 'Other' && (
                                <div>
                                    <label className="block text-sm font-bold text-gray-400 mb-1">Describe Stage</label>
                                    <input type="text" value={payOther} onChange={e => setPayOther(e.target.value)} placeholder="e.g. Retention release" className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:border-yellow-400 outline-none" />
                                </div>
                            )}
                            <div>
                                <label className="block text-sm font-bold text-gray-400 mb-1">Amount (€)</label>
                                <MoneyInput value={payAmount} onChange={v => setPayAmount(v)} placeholder="e.g. 2500" className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:border-yellow-400 outline-none" />
                            </div>
                            <button onClick={handleSave} className="w-full bg-yellow-400 text-gray-900 font-bold py-4 rounded-xl mt-6 flex justify-center items-center gap-2">
                                <Save size={20} /> Save Payment
                            </button>
                        </div>
                    </div>
                );
            };

            // --- VIEW: EDIT PAYMENT ---
            const renderEditPayment = () => {
                if (!editingPayment) return null;
                const handleSave = () => {
                    if (!editPayAmount) return alert('Enter a payment amount.');
                    const label = editPayStage === 'Other' ? (editPayOther.trim() || 'Other') : editPayStage;
                    const updated = { ...editingPayment, amount: Number(editPayAmount), date: new Date(editPayDate).toISOString(), label };
                    handleSetPayments(payments.map(p => p.id === editingPayment.id ? updated : p), 'upsert', updated);
                    setEditingPayment(null);
                    setView('project-detail');
                };
                const handleDelete = () => {
                    if (window.confirm('Delete this payment?')) {
                        handleSetPayments(payments.filter(p => p.id !== editingPayment.id), 'delete', editingPayment);
                        setEditingPayment(null);
                        setView('project-detail');
                    }
                };

                return (
                    <div className="p-5 pt-10 min-h-screen bg-gray-900 z-50">
                        <button onClick={() => { setEditingPayment(null); setView('project-detail'); }} className="text-gray-400 mb-6 flex items-center gap-2"><ArrowLeft size={20}/> Cancel</button>
                        <h2 className="text-2xl font-bold text-white mb-6">Edit Payment</h2>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-gray-400 mb-1">Date Received</label>
                                <input type="date" value={editPayDate} onChange={e => setEditPayDate(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:border-yellow-400 outline-none" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-400 mb-1">Stage</label>
                                <select value={editPayStage} onChange={e => setEditPayStage(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white appearance-none focus:border-yellow-400 outline-none">
                                    {PAY_STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            {editPayStage === 'Other' && (
                                <div>
                                    <label className="block text-sm font-bold text-gray-400 mb-1">Describe Stage</label>
                                    <input type="text" value={editPayOther} onChange={e => setEditPayOther(e.target.value)} placeholder="e.g. Retention release" className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:border-yellow-400 outline-none" />
                                </div>
                            )}
                            <div>
                                <label className="block text-sm font-bold text-gray-400 mb-1">Amount (€)</label>
                                <MoneyInput value={editPayAmount} onChange={v => setEditPayAmount(v)} className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:border-yellow-400 outline-none" />
                            </div>

                            <div className="pt-4 space-y-3">
                                <button onClick={handleSave} className="w-full bg-yellow-400 text-gray-900 font-bold py-4 rounded-xl flex justify-center items-center gap-2">
                                    <Save size={20} /> Save Changes
                                </button>
                                <button onClick={handleDelete} className="w-full bg-red-500/10 border border-red-500/30 text-red-500 font-bold py-4 rounded-xl flex justify-center items-center gap-2">
                                    <Trash2 size={20} /> Delete Payment
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // 4. MAIN RENDER ROUTING
            // ==========================================
            const renderContent = () => {
                // Firebase is configured in code, so go straight to connecting/sign-in.
                // 1. Still starting up (or failed to start).
                if (!authReady && activeTab !== 'settings') {
                    if (initError) {
                        return (
                            <div className="h-screen flex flex-col items-center justify-center p-6 text-center">
                                <Cloud className="text-red-500 mb-4" size={48} />
                                <h2 className="text-lg font-bold text-white mb-2">Could not connect</h2>
                                <p className="text-gray-400 text-sm mb-2">{initError}</p>
                                <p className="text-gray-500 text-xs mb-6">Check that Cloud Firestore is created and its rules are published.</p>
                                <button onClick={() => setActiveTab('settings')} className="bg-yellow-400 text-gray-900 font-bold py-3 px-6 rounded-xl">Open Settings</button>
                            </div>
                        );
                    }
                    return <div className="h-screen flex flex-col items-center justify-center text-yellow-400"><RefreshCw className="animate-spin mb-4" size={32}/><p className="text-sm font-bold text-gray-400">Connecting...</p></div>;
                }

                // 2. Connected but not signed in -> login (Settings stays reachable).
                if (authReady && !user && activeTab !== 'settings') {
                    return renderLogin();
                }

                if (user && officeRole === 'crew') {
                    return (
                        <div className="h-screen flex flex-col items-center justify-center p-6 text-center">
                            <Users className="text-blue-400 mb-4" size={44}/>
                            <h2 className="text-lg font-bold text-white mb-2">This is the office app</h2>
                            <p className="text-gray-400 text-sm mb-6 max-w-xs">Your login is for the crew app, which shows the works and materials for your jobs.</p>
                            <a href="crew.html" className="bg-blue-500 text-white font-bold py-3 px-6 rounded-xl mb-4">Open the crew app</a>
                            <button onClick={() => { if (auth) signOut(auth); }} className="text-sm text-gray-500 hover:text-white">Sign out</button>
                        </div>
                    );
                }

                if (user && accessDenied && activeTab !== 'settings') {
                    return (
                        <div className="h-screen flex flex-col items-center justify-center p-6 text-center">
                            <Cloud className="text-red-500 mb-4" size={44}/>
                            <h2 className="text-lg font-bold text-white mb-2">No access</h2>
                            <p className="text-gray-400 text-sm mb-2 max-w-xs">This login is not set up as an owner.</p>
                            <p className="text-gray-500 text-xs mb-6 max-w-xs break-all">If this is you setting up: add a document at users/{user.uid} with role = owner in the Firebase console, then reload.</p>
                            <button onClick={() => { if (auth) signOut(auth); }} className="text-sm text-gray-500 hover:text-white">Sign out</button>
                        </div>
                    );
                }

                if ((officeRole === 'checking' || loading) && user && activeTab !== 'settings') return <div className="h-screen flex flex-col items-center justify-center text-yellow-400"><RefreshCw className="animate-spin mb-4" size={32}/><p className="text-sm font-bold text-gray-400">Loading Data...</p></div>;
                
                if (view === 'add-project') return renderAddProject();
                if (view === 'edit-project') return renderEditProject();
                if (view === 'add-person') return renderAddPerson();
                if (view === 'edit-person') return renderEditPerson();
                if (view === 'project-detail') return renderProjectDetail();
                if (view === 'add-time') return renderAddTime();
                if (view === 'edit-time') return renderEditTime();
                if (view === 'add-material') return renderAddMaterial();
                if (view === 'edit-material') return renderEditMaterial();
                if (view === 'roster-job') return renderRosterJob();
                if (view === 'add-cash') return renderAddCash();
                if (view === 'edit-cash') return renderEditCash();
                if (view === 'add-payment') return renderAddPayment();
                if (view === 'edit-payment') return renderEditPayment();
                
                switch(activeTab) {
                    case 'dashboard': return renderDashboard();
                    case 'projects': return renderProjects();
                    case 'analytics': return renderAnalytics();
                    case 'roster': return renderRoster();
                    case 'team': return renderTeam();
                    case 'settings': return renderSettings();
                    default: return renderDashboard();
                }
            };

            const onLoginScreen = authReady && !user && activeTab !== 'settings';
            const showNav = view === 'main' && !onLoginScreen && !(user && (officeRole === 'crew' || accessDenied));

            return (
                <div className="bg-gray-900 min-h-screen max-w-md mx-auto relative shadow-2xl border-x border-gray-800">
                    {canInstall && !installDismissed && (
                        <div className="bg-yellow-400 text-gray-900 px-4 py-2 flex items-center justify-between gap-2 text-sm font-bold">
                            <span className="flex items-center gap-2"><Download size={16}/> Install TITS on your phone</span>
                            <span className="flex items-center gap-1">
                                <button onClick={runInstall} className="bg-gray-900 text-yellow-400 px-3 py-1 rounded-lg">Install</button>
                                <button onClick={() => setInstallDismissed(true)} className="p-1"><X size={16}/></button>
                            </span>
                        </div>
                    )}

                    {showIosHelp && (
                        <div className="fixed inset-0 bg-black/80 flex items-end justify-center p-4 z-50" onClick={() => setShowIosHelp(false)}>
                            <div className="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl mb-4" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-lg font-bold text-white">Add to Home Screen</h3>
                                    <button onClick={() => setShowIosHelp(false)} className="text-gray-400 hover:text-white"><X size={20}/></button>
                                </div>
                                <ol className="text-sm text-gray-300 space-y-2 list-decimal list-inside">
                                    <li>Tap the <span className="text-yellow-400 font-bold">Share</span> button in Safari's toolbar.</li>
                                    <li>Scroll down and tap <span className="text-yellow-400 font-bold">Add to Home Screen</span>.</li>
                                    <li>Tap <span className="text-yellow-400 font-bold">Add</span>. TITS will appear like a normal app.</li>
                                </ol>
                                <p className="text-xs text-gray-500 mt-4">Note: this only works in Safari, not Chrome, on iPhone.</p>
                            </div>
                        </div>
                    )}

                    <div className="h-full overflow-y-auto">
                        {renderContent()}
                    </div>

                    {showNav && (
                        <nav className="fixed bottom-0 w-full max-w-md bg-gray-800 border-t border-gray-700 px-1.5 py-3 flex justify-around items-center z-40 pb-safe">
                            <NavItem icon={<Home />} label="Home" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                            <NavItem icon={<Briefcase />} label="Jobs" active={activeTab === 'projects'} onClick={() => setActiveTab('projects')} />
                            <NavItem icon={<Calendar />} label="Roster" active={activeTab === 'roster'} onClick={() => setActiveTab('roster')} />
                            <NavItem icon={<BarChart3 />} label="Analytics" active={activeTab === 'analytics'} onClick={() => setActiveTab('analytics')} />
                            <NavItem icon={<Users />} label="Team" active={activeTab === 'team'} onClick={() => setActiveTab('team')} />
                            <NavItem icon={<Settings />} label="Settings" active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
                        </nav>
                    )}
                </div>
            );
        }

        function NavItem({ icon, label, active, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center gap-1 transition-colors ${active ? 'text-yellow-400' : 'text-gray-500 hover:text-gray-300'}`}>
                    {React.cloneElement(icon, { size: active ? 24 : 22, strokeWidth: active ? 2.5 : 2 })}
                    <span className="text-[10px] font-bold tracking-wide">{label}</span>
                </button>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
