          <Dropdown label="Overall Condition of Installation" value={job.periodic.condition} onChange={v=>up({periodic:{...job.periodic, condition:v}})} options={['Satisfactory', 'Unsatisfactory']} required/>
          {job.periodic.condition === 'Unsatisfactory' && <div className="text-xs text-red-600 font-bold">Ensure you log specific defects in the Notes tab.</div>}
        </div>)}
      </Section>

      <Section title="Customer & job" right={<button className="text-xs font-bold" style={{color:'var(--c1)'}} onClick={saveAsCustomer}>Save to customers</button>}>
        <div className="grid sm:grid-cols-2 gap-3">
          <Field label="Customer name" value={job.customerName} onChange={v=>up({customerName:v})} required/>
          <Field label="Phone" value={job.phone} onChange={v=>up({phone:v})} type="tel"/>
          <Field label="Installation address" value={job.address} onChange={v=>up({address:v})} required/>
          <Field label="Email" value={job.email} onChange={v=>up({email:v})} type="email"/>
          <Field label="Job reference" value={job.jobNo} onChange={v=>up({jobNo:v})}/>
          <Field label="Date" type="date" value={job.date} onChange={v=>up({date:v})}/>
          <Field label="Electrician" value={job.electrician} onChange={v=>up({electrician:v})} required/>
          <Field label="Distribution board ref" value={job.dbRef} onChange={v=>up({dbRef:v})}/>
        </div>
      </Section>
      {api.cloud && (<Section title="Assigned electrician" chip={job.assignedTo ? <span className="chip stagechip-done">{job.assignedName || job.assignedTo}</span> : <span className="chip stagechip-pre">Unassigned</span>}>
        <p className="text-sm text-slate-500 mb-3">Whoever is assigned sees this job on their dashboard. Hand it over after pre-connection and a different electrician can finish the post-connection tests.</p>
        <div className="flex flex-wrap gap-1.5">
          <button className={'tabbtn ' + (!job.assignedTo ? 'on' : 'off')} onClick={()=>handover(null)}>Unassigned</button>
          {members.map(m => <button key={m.email} className={'tabbtn ' + (job.assignedTo===m.email ? 'on' : 'off')} onClick={()=>handover(m)}>{m.name || m.email}{m.email===api.email ? ' (me)' : ''}</button>)}
        </div>
      </Section>)}
      <Section title="Record sheet references">
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <Field label="MPRN No" value={job.mprn} onChange={v=>up({mprn:v})} type="number" inputMode="numeric"/>
          <Field label="Cert No" value={job.certNo} onChange={v=>up({certNo:v})}/>
          <Field label="Seal No" value={job.sealNo} onChange={v=>up({sealNo:v})}/>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Sheet" value={job.sheetNo} onChange={v=>up({sheetNo:v})} type="number" inputMode="numeric"/>
            <Field label="of" value={job.sheetOf} onChange={v=>up({sheetOf:v})} type="number" inputMode="numeric"/>
          </div>
        </div>
      </Section>
      {nextBtn('Job')}
    </div>)}

    {tab==='Install' && (<div className="space-y-4">
      <Section title="Installation">
        <div className="space-y-4">
          <Dropdown label="Category" value={job.category} onChange={v=>up({category:v})} options={SUG.category}/>
          <Dropdown label="Type of installation" value={job.installType} onChange={v=>up({installType:v})} options={SUG.installType}/>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Maximum demand" value={job.maxDemand} onChange={v=>up({maxDemand:v})} type="number" inputMode="decimal"/>
            <Field label="Supply characteristics" value={job.supplyChar} onChange={v=>up({supplyChar:v})} placeholder="e.g. 230 V single phase TN-C-S"/>
            <Field label="Max Rp+Re (Ω)" value={job.maxRpRe} onChange={v=>up({maxRpRe:v})} type="number" inputMode="decimal"/>
            <Field label="Max Res. Prot. Conductor Re (Ω)" value={job.maxRe} onChange={v=>up({maxRe:v})} type="number" inputMode="decimal"/>
          </div>
          <Field label="Comments" value={job.comments} onChange={v=>up({comments:v})} area/>
        </div>
      </Section>
      <Section title="Bonding & earthing checks">
        <YesNA label="Main bonding verified for GAS" value={job.bonding.gas} onChange={v=>up({bonding:{...job.bonding, gas:v}})}/>
        <YesNA label="Main bonding verified for WATER" value={job.bonding.water} onChange={v=>up({bonding:{...job.bonding, water:v}})}/>
        <YesNA label="Supplementary bonding verified" value={job.bonding.supp} onChange={v=>up({bonding:{...job.bonding, supp:v}})}/>
        <YesNA label="Electrode earthing conductor" value={job.bonding.electrode} onChange={v=>up({bonding:{...job.bonding, electrode:v}})}/>
        <YesNA label="Other" value={job.bonding.other} onChange={v=>up({bonding:{...job.bonding, other:v}})}/>
        {job.bonding.other==='Yes' && <div className="pt-2"><Field label="Other details" value={job.bonding.otherDetails} onChange={v=>up({bonding:{...job.bonding, otherDetails:v}})}/></div>}
      </Section>
      {nextBtn('Install')}
    </div>)}

    {tab==='Instruments' && (<div className="space-y-4">
      <Section title="Test instruments used" right={<button className="text-xs font-bold" style={{color:'var(--c1)'}} onClick={()=>up({instruments:[...job.instruments, {id:uid(), use:'', make:'', model:'', serial:'', calExpiry:''}]})}>+ Add</button>}>
        <div className="space-y-3">
          {job.instruments.map((ins) => (<div key={ins.id} className="rounded-xl border border-slate-200 p-3 grid grid-cols-2 sm:grid-cols-5 gap-2.5 relative">
            <Dropdown label="Used for" value={ins.use} onChange={v=>up({instruments: job.instruments.map(x=>x.id===ins.id?{...x,use:v}:x)})} options={SUG.instruments} className="col-span-2 sm:col-span-1"/>
            <Field label="Make" value={ins.make} onChange={v=>up({instruments: job.instruments.map(x=>x.id===ins.id?{...x,make:v}:x)})}/>
            <Field label="Model" value={ins.model} onChange={v=>up({instruments: job.instruments.map(x=>x.id===ins.id?{...x,model:v}:x)})}/>
            <Field label="Serial no" value={ins.serial} onChange={v=>up({instruments: job.instruments.map(x=>x.id===ins.id?{...x,serial:v}:x)})}/>
            <Field label="Calibration expiry" type="date" value={ins.calExpiry} onChange={v=>up({instruments: job.instruments.map(x=>x.id===ins.id?{...x,calExpiry:v}:x)})}
              hint={ins.calExpiry && new Date(ins.calExpiry) < new Date() ? '⚠ Calibration expired' : ''}/>
          </div>))}
        </div>
        <p className="text-xs text-slate-400 mt-2">Instrument details drop straight into the Excel sheet and PDF report. They carry over to your next job automatically.</p>
      </Section>
      {nextBtn('Instruments')}
    </div>)}

    {tab==='Circuits' && (<div className="space-y-3">
      {job.circuits.map((c, i) => <CircuitCard key={c.id} c={c} i={i} total={job.circuits.length}
        upC={(p)=>upCircuit(c.id, p)} dupC={()=>dupCircuit(c)} delC={()=>delCircuit(c)} moveC={(d)=>moveCircuit(c, d)}
        saveTemplate={()=>saveTemplate(c)} templates={templates} applyTemplate={(t)=>applyTemplate(c, t)}/>)}
      <button className="btn btn-p w-full !py-4" onClick={addCircuit}>+ Add circuit</button>
      {nextBtn('Circuits')}
    </div>)}

    {tab==='Pre tests' && (<div className="space-y-3">
      {job.preLocked && (<div className="card p-4 flex items-center justify-between gap-3 bg-cyan-50 border-cyan-200">
        <span className="text-sm text-cyan-900 font-medium">🔒 Pre-connection results are signed off and locked.</span>
        <button className="btn btn-o !min-h-[38px] !py-1 text-sm shrink-0" onClick={()=>setTab('Sign-off')}>Manage</button>
      </div>)}
      {job.circuits.map(c => <PreTestCard key={c.id} c={c} upPre={(p)=>upPre(c.id, p)} locked={job.preLocked}/>)}
      {job.circuits.length===0 && <div className="card p-8 text-center text-slate-400 text-sm">Add circuits first, then record pre-connection tests here.</div>}
      
      <div className="mt-4">
        {sigBlock('pre', job.preLocked, signOffPre, 'Pre Connection Tested By', job.preLocked, preErrors)}
      </div>
      {nextBtn('Pre tests')}
    </div>)}

    {tab==='Post tests' && (<div className="space-y-3">
      {!job.preLocked && (<div className="card p-4 bg-amber-50 border-amber-200 text-sm text-amber-900 font-medium">Pre-connection testing has not been signed off yet. You can still record post results, but the two-stage flow works best pre first.</div>)}
      {job.circuits.map(c => <PostTestCard key={c.id} c={c} upPost={(p)=>upPost(c.id, p)}/>)}
      {job.circuits.length===0 && <div className="card p-8 text-center text-slate-400 text-sm">Add circuits first, then record post-connection tests here.</div>}
      
      <div className="mt-4">
        {sigBlock('post', false, signOffPost, 'Post Connection Tested By', job.status==='complete', postErrors)}
      </div>
      {nextBtn('Post tests')}
    </div>)}

    {tab==='PIR' && <PirView job={job} up={up} settings={settings}/>}

    {tab==='Photos' && (<div className="space-y-3">
      <Section title="Add photos">
        <div className="grid grid-cols-2 gap-2 mb-3">
          <button className="btn btn-p" onClick={()=>cameraInput.current.click()}>📷 Take photo</button>
          <button className="btn btn-o" onClick={()=>photoInput.current.click()}>Upload photos</button>
        </div>
        <label className="block"><span className="text-[13px] font-semibold text-slate-600 mb-1 block">Attach new photos to</span>
          <select className="field" value={photoCircuit} onChange={e=>setPhotoCircuit(e.target.value)}>
            <option value="">General / whole job</option>
            {job.circuits.map(c => <option key={c.id} value={c.id}>Circuit {c.number} – {c.designation || 'unnamed'}</option>)}
          </select></label>
        <input ref={cameraInput} type="file" accept="image/*" capture="environment" className="hidden" onChange={addPhotos}/>
        <input ref={photoInput} type="file" accept="image/*" multiple className="hidden" onChange={addPhotos}/>
      </Section>
      <div className="grid grid-cols-2 gap-3">
        {job.photos.map(p => { const cir = job.circuits.find(c=>c.id===p.circuitId);
          return (<div key={p.id} className="card overflow-hidden">
            <img src={p.data} className="w-full h-32 object-cover"/>
            <div className="p-2.5 space-y-2">
              <div className="text-[11px] text-slate-400">{cir ? 'Circuit '+cir.number : 'General'} • {fmtDT(p.ts)}</div>
              <input className="field !min-h-[38px] !py-1.5 text-sm" placeholder="Caption…" value={p.caption} onChange={e=>upPhoto(p.id, {caption: e.target.value})}/>
              <div className="flex items-center justify-between">
                <button className={'chip ' + (p.include ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500')} onClick={()=>upPhoto(p.id, {include: !p.include})}>{p.include ? 'In report' : 'Excluded'}</button>
                <button className="text-red-500 text-sm font-semibold" onClick={()=>{ if(confirm('Delete photo?')) delPhoto(p.id); }}>Delete</button>
              </div>
            </div>
          </div>); })}
      </div>
      {job.photos.length===0 && <div className="card p-8 text-center text-slate-400 text-sm">Before, after, fault and completion photos live here – timestamped and included in the PDF report.</div>}
      {nextBtn('Photos')}
    </div>)}

    {tab==='Notes' && (<div className="space-y-4">
      <Section title="Job notes">
        <div className="space-y-3">
          <Field label="General notes" value={job.notes.general} onChange={v=>up({notes:{...job.notes, general:v}})} area/>
          <Field label="Completion notes" value={job.notes.completion} onChange={v=>up({notes:{...job.notes, completion:v}})} area/>
          <Field label="Recommendations" value={job.notes.recommendations} onChange={v=>up({notes:{...job.notes, recommendations:v}})} area/>
          <Field label="Observations / Defects" value={job.notes.observations} onChange={v=>up({notes:{...job.notes, observations:v}})} area/>
        </div>
      </Section>
      {nextBtn('Notes')}
    </div>)}

    {tab==='Sign-off' && (<div className="space-y-4">
      {sigBlock('pre', job.preLocked, signOffPre, 'Pre connection tested by', job.preLocked, preErrors)}
      {api.cloud && job.preLocked && job.status !== 'complete' && (<Section title="Hand over for post-connection">
        <p className="text-sm text-slate-500 mb-3">Pre-connection is locked. Pass the job to whoever is doing the post-connection tests, or keep it yourself.</p>
        <div className="flex flex-wrap gap-1.5">
          {members.map(m => <button key={m.email} className={'tabbtn ' + (job.assignedTo===m.email ? 'on' : 'off')} onClick={()=>handover(m)}>{m.name || m.email}{m.email===api.email ? ' (me)' : ''}</button>)}
        </div>
      </Section>)}
      {sigBlock('post', false, signOffPost, 'Post connection tested by', job.status==='complete', postErrors)}
      {nextBtn('Sign-off')}
    </div>)}

    {tab==='Export' && (<div className="space-y-4">
      {missing.length > 0 && <div className="card p-4 bg-amber-50 border-amber-200 text-sm text-amber-900"><b>Missing:</b> {missing.join(', ')}. Reports still export, but check these first.</div>}
      <Section title="Excel – test record sheet" chip={<span className="chip stagechip-pre">Report 3</span>}>
        <p className="text-sm text-slate-500 mb-3">One workbook: a sheet laid out like the paper test record for quick transfer, plus filterable data sheets (customer, installation, circuits, pre, post, photos, notes). Carries your logo and the "for filling purposes only – not an official certificate" line.</p>
        <button className="btn btn-p w-full" onClick={()=>buildExcel(job, settings).then(()=>toast('Excel downloaded')).catch(e=>alert('Excel export failed: '+e.message))}>Download Excel workbook</button>
      </Section>
      {job.jobType === 'Periodic' && (
        <Section title="PDF – inspection form layout" chip={<span className="chip stagechip-post">Report 2</span>}>
          <p className="text-sm text-slate-500 mb-3">The periodic inspection laid out as a form: numbered questions with tick boxes, RCD table, observations with the 1–4 recommendation codes, and signature block. Carries your branding and the "not for official use" banner.</p>
          <button className="btn btn-p w-full" onClick={()=>{ try{ buildPirForm(job, settings); toast('Form report downloaded'); }catch(e){ alert('Form export failed: '+e.message); } }}>Download inspection form report</button>
        </Section>
      )}
      <Section title="PDF – customer report" chip={<span className="chip stagechip-post">Report 1</span>}>
        <p className="text-sm text-slate-500 mb-3">Branded PDF with your colours, logo, all test results, photos and signatures. Adapts to Installation or Periodic mode.</p>
        <button className="btn btn-p w-full" onClick={()=>{ try{ buildPDF(job, settings); toast('PDF downloaded'); }catch(e){ alert('PDF export failed: '+e.message); } }}>Download PDF report</button>
      </Section>
    </div>)}
  </div>);
}

/* ================= SETTINGS VIEW ================= */
function SettingsView({settings, setSettings, api, members, links}){
  const s = settings;
  const up = (patch) => setSettings(Object.assign({}, s, patch));
  const logoInput = useRef(null);
  const [toastMsg, setToastMsg] = useState('');
  const unlocked = protechUnlocked();
  const toast = (m) => { setToastMsg(m); setTimeout(()=>setToastMsg(''), 2200); };
  
  const onLogo = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    if(f.size > 400*1024 && !confirm('That logo is ' + Math.round(f.size/1024) + ' KB. Large logos bloat the app file. Use it anyway?')){ e.target.value=''; return; }
    const data = await new Promise(function(res, rej){
      const r = new FileReader();
      r.onload = function(){ res(r.result); };
      r.onerror = rej;
      r.readAsDataURL(f);   /* original file, untouched: no resize, no re-compression */
    });
    up({ logo: data }); toast('Logo saved at original quality');
  };

  const [newEmail, setNewEmail] = useState(''); const [newName, setNewName] = useState(''); const [newRole, setNewRole] = useState('electrician');
  const readOnly = api.cloud && api.role !== 'admin';
  const addMember = async () => {
    if(!newEmail.includes('@')) return alert('Enter a valid email address.');
    try{ await api.addMember(newEmail, newName, newRole); setNewEmail(''); setNewName(''); toast('Electrician added'); }
    catch(e){ alert('Could not add: ' + e.message); }
  };
  return (<div className="space-y-4 pb-24">
    {readOnly && <div className="card p-4 bg-amber-50 border-amber-200 text-sm text-amber-900 font-medium">Company details and branding are managed by your admin. You can still see them here.</div>}
    {api.cloud && api.role === 'admin' && (<Section title="Team" chip={<span className="chip stagechip-done">Admin</span>}>
      <div className="space-y-2 mb-3">
        {members.map(m => (<div key={m.email} className="flex items-center justify-between gap-2 py-2 border-b border-slate-100 last:border-0">
          <div className="min-w-0">
            <div className="font-semibold text-slate-800 text-sm truncate">{m.name || m.email}</div>
            <div className="text-xs text-slate-500 truncate">{m.email}</div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <span className={'chip ' + (m.role==='admin' ? 'stagechip-done' : 'stagechip-pre')}>{m.role}</span>
            {m.email !== api.email && <button className="text-red-500 text-xs font-bold" onClick={()=>{ if(confirm('Remove ' + m.email + '? They lose access at their next login.')) api.removeMember(m.email); }}>Remove</button>}
          </div>
        </div>))}
      </div>
      <div className="grid sm:grid-cols-4 gap-2 items-end">
        <Field label="Email" value={newEmail} onChange={setNewEmail} type="email"/>
        <Field label="Name" value={newName} onChange={setNewName}/>
        <label className="block"><span className="text-[13px] font-semibold text-slate-600 mb-1 block">Role</span>
          <select className="field" value={newRole} onChange={e=>setNewRole(e.target.value)}>
            <option value="electrician">Electrician</option><option value="admin">Admin</option>
          </select></label>
        <button className="btn btn-p" onClick={addMember}>Add electrician</button>
      </div>
      <p className="text-xs text-slate-400 mt-2">They sign in with this exact email address. Admins manage branding and the team; electricians record and finish jobs.</p>
    </Section>)}
    <Section title="Company details">
      <div className="grid sm:grid-cols-2 gap-3">
        {unlocked
          ? <Field label="Company name" value={s.companyName} onChange={v=>up({companyName:v})} required/>
          : <div><label className="block text-xs font-semibold text-slate-600 mb-1">Company name</label>
              <div className="field bg-slate-50 text-slate-500 flex items-center">{s.companyName}</div></div>}
        <Field label="Registration number" value={s.regNo} onChange={v=>up({regNo:v})}/>
        <Field label="Address" value={s.address} onChange={v=>up({address:v})}/>
        <Field label="Phone" value={s.phone} onChange={v=>up({phone:v})} type="tel"/>
        <Field label="Email" value={s.email} onChange={v=>up({email:v})} type="email"/>
        <Field label="Website" value={s.website} onChange={v=>up({website:v})}/>
      </div>
    </Section>
    {unlocked && (<Section title="Logo" chip={<span className="chip bg-slate-800 text-white">Protech</span>}>
      <div className="flex items-center gap-4">
        <div className="w-28 h-16 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-center overflow-hidden">
          {s.logo ? <img src={s.logo} className="max-w-full max-h-full object-contain"/> : <span className="text-xs text-slate-400">No logo</span>}
        </div>
        <div className="flex gap-2">
          <button className="btn btn-o" onClick={()=>logoInput.current.click()}>Upload manual override</button>
          {s.logo && <button className="btn btn-g" onClick={()=>up({logo:''})}>Clear</button>}
        </div>
        <input ref={logoInput} type="file" accept="image/png,image/jpeg" className="hidden" onChange={onLogo}/>
      </div>
      <div className="mt-3">
        <Check label="White box behind logo in PDF (turn off for logos that already have a light background)" value={s.logoBox !== false} onChange={v=>up({logoBox: v})}/>
        <div className="mt-2">
          <Check label='Footer line on periodic reports: "the official Safe Electric report must still be completed and submitted"' value={s.pirDisclaimer !== false} onChange={v=>up({pirDisclaimer: v})}/>
          <p className="text-xs text-slate-400 mt-1 ml-6">Recommended. It keeps the report clearly distinct from the official Safe Electric form.</p>
        </div>
      </div>
      <p className="text-xs text-slate-400 mt-2">The app checks for a <b>logo.txt</b> file in the same directory automatically. You can upload an image here to override it locally. Logos are used at their original size and aspect ratio.</p>
    </Section>)}
    {unlocked && (<Section title="Brand colours" chip={<span className="chip bg-slate-800 text-white">Protech</span>}>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        {[['c1','Primary (admin colour)', true],['c2','Secondary', s.useC2, 'useC2'],['c3','Accent', s.useC3, 'useC3']].map(([key,label,on,toggleKey]) => (
          <div key={key} className={'rounded-xl border-[1.5px] p-3 ' + (on ? 'border-slate-200' : 'border-dashed border-slate-200 opacity-60')}>
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm font-semibold text-slate-700">{label}</span>
              {toggleKey && <button className={'chip ' + (on ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500')} onClick={()=>up({[toggleKey]: !on})}>{on ? 'On' : 'Off'}</button>}
            </div>
            <div className="flex items-center gap-3">
              <input type="color" value={s[key]} onChange={e=>up({[key]: e.target.value})} className="w-14 h-12 rounded-lg border border-slate-200 cursor-pointer" disabled={toggleKey && !on}/>
              <input className="field !min-h-[42px]" value={s[key]} onChange={e=>up({[key]: e.target.value})} disabled={toggleKey && !on}/>
            </div>
          </div>
        ))}
      </div>
    </Section>)}
    {(links && links.length > 0) && (
      <Section title="Company links">
        <div className="flex flex-wrap gap-2">
          {links.map((l,i) => (
            <a key={i} href={l.url} target="_blank" rel="noopener" className="btn btn-o">{l.label}</a>
          ))}
        </div>
      </Section>
    )}
    <Toast msg={toastMsg}/>
  </div>);
}

/* Form-style periodic inspection report: the same numbered questions and tick-box
   layout an electrician expects, rendered in the company's own branding.
   Deliberately NOT a reproduction of the official Safe Electric form, which
   carries a CER copyright notice prohibiting reproduction. */
function buildPirForm(job, settings){
  const doc = new jspdf.jsPDF({ unit:'mm', format:'a4' });
  const W = 210, M = 12, BOT = 272;
  const p = job.pir || {};
  const audit = pirAudit(job);
  const rgb1 = hexToRgb(settings.c1);
  const rgb2 = hexToRgb(settings.useC2 ? settings.c2 : settings.c1);
  const onC1 = textOn(settings.c1) === '#ffffff' ? [255,255,255] : [15,23,42];
  /* jsPDF's built-in fonts cannot encode the ohm or delta symbols: they come out
     as garbage and wreck the letter spacing. Use plain words instead. */
  const OHM = 'ohms', MOHM = 'Mohms';

  const head = () => {
    doc.setFillColor(...rgb1); doc.rect(0, 0, W, 20, 'F');
    doc.setFillColor(...rgb2); doc.rect(0, 20, W, 1.4, 'F');
    let tx = M;
    if (settings.logo) {
      try {
        const pr = doc.getImageProperties(settings.logo);
        const fit = fitBox(pr.width, pr.height, 24, 12);
        const ly = 4 + (12 - fit.h) / 2;
        if (settings.logoBox !== false) { doc.setFillColor(255,255,255); doc.roundedRect(M - 1.5, ly - 1.5, fit.w + 3, fit.h + 3, 1.5, 1.5, 'F'); }
        doc.addImage(settings.logo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, ly, fit.w, fit.h, undefined, 'FAST');
        tx = M + fit.w + 6;
      } catch(e){}
    }
    doc.setTextColor(...onC1); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Periodic Inspection Report for an Electrical Installation', tx, 9);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text([settings.companyName, settings.regNo && ('Reg ' + settings.regNo)].filter(Boolean).join('   |   '), tx, 14.5);
    doc.setFontSize(7.5);
    doc.text('PR No: ' + (p.prNo || '____________'), W - M, 9, { align:'right' });
    doc.text('Date: ' + fmtDate(job.date), W - M, 14.5, { align:'right' });
    doc.setTextColor(15,23,42);
    return 29;
  };

  let y = head();
  const room = (need) => { if (y + need > BOT) { doc.addPage(); y = head(); } };

  const tick = (x, yy, on) => {
    doc.setDrawColor(120,133,150); doc.setLineWidth(0.25);
    doc.rect(x, yy - 2.7, 3.4, 3.4);
    if (on) {
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1);
      doc.text('X', x + 0.7, yy + 0.1);
      doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    }
  };
  const opts = (x, yy, list, val) => {
    let cx = x;
    doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(15,23,42);
    list.forEach(o => {
      doc.text(o, cx, yy);
      const w = doc.getTextWidth(o);
      tick(cx + w + 1.5, yy, val === o);
      cx += w + 9;
    });
  };
  const line = (label, val, x, yy, w) => {
    doc.setFontSize(7.2); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
    doc.text(label, x, yy);
    const lw = doc.getTextWidth(label);
    doc.setDrawColor(210,218,228); doc.setLineWidth(0.2);
    doc.line(x + lw + 2, yy + 0.9, x + w, yy + 0.9);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    doc.text(String(val || ''), x + lw + 3.5, yy);
    doc.setFont('helvetica','normal');
  };
  const sect = (t) => {
    room(12);
    doc.setFillColor(240,244,248); doc.rect(M, y - 4.2, W - M*2, 6.4, 'F');
    doc.setFillColor(...rgb2); doc.rect(M, y - 4.2, 1.6, 6.4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1);
    doc.text(t.toUpperCase(), M + 4, y);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    y += 8;
  };

  const COL2 = 108;   /* right column x */
  const HALF = 90;    /* half-width line length */

  /* ---------- details ---------- */
  sect('Registered contractor');
  line('Name', settings.companyName, M, y, 96); line('Reg No.', settings.regNo, COL2, y, COL2 + HALF); y += 7;
  line('Address', settings.address, M, y, 96); line('Phone', settings.phone, COL2, y, COL2 + HALF); y += 9;

  sect('Installation details');
  line('Occupant / trading as', p.occupant || job.customerName, M, y, 96);
  line('Approx age', p.approxAge, COL2, y, COL2 + HALF); y += 7;
  line('Address', job.address, M, y, 96);
  doc.setFontSize(7.2); doc.setTextColor(100,116,139);
  doc.text('Occupant in attendance?', COL2, y);
  doc.setTextColor(15,23,42);
  opts(COL2 + 40, y, ['Yes','No'], p.occupantAttended); y += 9;

  sect('Category and reason');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Installation category', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 42, y, ['Domestic','Commercial','Industrial','Other'], p.category); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Reason for inspection', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 42, y, ['Insurance Inspection','Safety Audit','Other'], job.periodic.reason); y += 6.5;
  if (p.reasonOther) { line('If other, specify', p.reasonOther, M, y, W - M); y += 7; }
  y += 2;

  sect('Extent of installation covered by this report');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Entire installation?', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 40, y, ['Yes','No'], p.entireInstall); y += 5.5;
  doc.setFontSize(6.5); doc.setTextColor(120,133,150);
  doc.text('Cables concealed within trunking, conduit, the fabric of the building or underground have not been inspected unless stated otherwise.', M, y);
  doc.setTextColor(15,23,42); y += 5;
  if (p.entireInstall === 'No') {
    doc.setFontSize(7.2);
    const ls = doc.splitTextToSize('This report refers to: ' + (p.partialDetail || ''), W - M*2);
    room(ls.length * 4 + 4);
    doc.text(ls, M, y); y += ls.length * 4 + 2;
  }
  y += 3;

  sect('Supply characteristics');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Type of system earthing', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 46, y, ['TNCS','TT','TNS','IT'], p.earthing); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Installation voltage', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 46, y, ['Single Phase','Three Phase'], p.phase); y += 6.5;
  const volts = [['L1', p.v1], ['L2', p.v2], ['L3', p.v3], ['L1-L2', p.v12], ['L2-L3', p.v23], ['L3-L1', p.v31]].filter(v => v[1]);
  if (volts.length) {
    let vx = M;
    volts.forEach(v => { line(v[0], v[1] + ' V', vx, y, vx + 26); vx += 31; });
    y += 7;
  }
  line('Max prospective S/C current (A)', p.pscc, M, y, 96);
  line('Nominal rating (A)', p.nominalRating, COL2, y, COL2 + HALF); y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Main isolation / overcurrent device', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 62, y, ['None','Switch Fuse','MCB','MCCB'], p.mainIsolation); y += 7;
  line('If main RCD: rated current In (A)', p.mainRcdIn, M, y, 96);
  line('Tripping current (mA)', p.mainRcdIdn, COL2, y, COL2 + HALF); y += 4;

  /* ---------- the 30 questions: single clean column, answers right-aligned ---------- */
  doc.addPage(); y = head();
  doc.setFont('helvetica','bold'); doc.setFontSize(7.4); doc.setTextColor(185,28,28);
  doc.text('Any question answered "No" must be referred to in the observations section. All questions must be answered.', M, y);
  doc.setTextColor(15,23,42); y += 7;

  const q = p.q || {};
  const ANSX = W - M - 40;           /* where the Yes/No/NA block starts */
  const drawQ = (n, label, na) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
    const lines = doc.splitTextToSize(n + '.   ' + label, ANSX - M - 6);
    const h = Math.max(lines.length * 3.9, 5) + 2.4;
    room(h + 2);
    const val = q['q' + n] || '';
    if (val === 'No') { doc.setFillColor(254,242,242); doc.rect(M - 1.5, y - 3.4, W - M*2 + 3, h, 'F'); doc.setDrawColor(220,38,38); doc.setLineWidth(0.7); doc.line(M - 1.5, y - 3.4, M - 1.5, y - 3.4 + h); }
    doc.setTextColor(15,23,42);
    doc.text(lines, M + 2, y);
    let bx = ANSX;
    ['Yes','No'].concat(na ? ['N/A'] : []).forEach(o => {
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(90,103,120);
      doc.text(o, bx, y);
      tick(bx + doc.getTextWidth(o) + 1.2, y, val === o);
      bx += doc.getTextWidth(o) + 7.5;
    });
    doc.setTextColor(15,23,42);
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.15);
    doc.line(M, y - 3.4 + h, W - M, y - 3.4 + h);
    y += h;
  };

  PIR_Q.forEach(g => {
    room(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.8); doc.setTextColor(...rgb1);
    doc.text(g.g.toUpperCase(), M, y);
    doc.setTextColor(15,23,42); y += 5;
    /* Q17 and Q20 belong inside the distribution board group, in the right order */
    if (g.g === 'Distribution board(s)') {
      g.items.filter(it => it[0] < 17).forEach(it => drawQ(it[0], it[1], it[2]));
      room(12);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
      doc.text('17.   Sub circuit isolation and overcurrent device type', M + 2, y);
      opts(ANSX, y, ['Fuse','Mcb'], p.q17type);
      doc.setDrawColor(232,238,244); doc.setLineWidth(0.15); doc.line(M, y + 2.2, W - M, y + 2.2);
      y += 7.4;
      g.items.filter(it => it[0] > 17).forEach(it => drawQ(it[0], it[1], it[2]));
      room(26);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
      doc.text('20.   RCDs', M + 2, y); y += 1.5;
      doc.autoTable({
        startY: y, margin:{ left: M + 2, right: M },
        head: [['Circuit description', 'Tripping current (mA)', 'Longest tripping time (ms)']],
        body: (p.rcds || []).length ? p.rcds.map(r => [r.desc || '', r.trip || '', r.time || '']) : [['', '', ''], ['', '', '']],
        theme:'grid', styles:{ fontSize:7, cellPadding:1.6, lineColor:[210,218,228], minCellHeight:6 },
        headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7, fontStyle:'bold' },
        columnStyles:{ 1:{ cellWidth:32, halign:'center' }, 2:{ cellWidth:40, halign:'center' } },
        didParseCell: function(d){
          if (d.section === 'body' && d.column.index === 2) {
            const t = parseFloat(d.cell.raw);
            if (!isNaN(t) && t > 300) { d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
          }
        }
      });
      y = doc.lastAutoTable.finalY + 7;
    } else {
      g.items.forEach(it => drawQ(it[0], it[1], it[2]));
      y += 3;
    }
  });

  /* ---------- summary / declaration ---------- */
  doc.addPage(); y = head();

  sect('Summary test data');
  line('Min insulation resistance (' + MOHM + ')', p.minIR, M, y, 96);
  line('Max resistance of protective conductor (' + OHM + ')', p.maxRp, COL2, y, COL2 + HALF); y += 7;
  line('Max fault loop impedance (' + OHM + ')', p.maxZs, M, y, 96);
  line('Associated device type / size', [p.zsDeviceType, p.zsDeviceSize].filter(Boolean).join(' '), COL2, y, COL2 + HALF); y += 9;

  sect('Quality of workmanship');
  opts(M, y, ['Very Good','Satisfactory','Poor'], p.workmanship); y += 9;

  sect('Test instrument serial numbers');
  line('Continuity tester', p.instContinuity, M, y, 96);
  line('Insulation resistance tester', p.instIR, COL2, y, COL2 + HALF); y += 7;
  line('Loop impedance tester', p.instLoop, M, y, 96);
  line('RCD tester', p.instRcd, COL2, y, COL2 + HALF); y += 9;

  sect('Observations and recommendations');
  opts(M, y, ['No remedial work is required','The following observations are made'], p.noRemedial); y += 6;
  const obsRows = (p.obs || []).filter(o => (o.comment || '').trim());
  doc.autoTable({
    startY: y, margin:{ left:M, right:M },
    head: [['Ref No.', 'Comments', 'Recommendation']],
    body: obsRows.length ? obsRows.map((o, i) => [o.ref || String(i+1), o.comment, '(' + o.code + ')  ' + (PIR_CODES[o.code] || '')])
                         : [['', '', ''], ['', '', ''], ['', '', '']],
    theme:'grid', styles:{ fontSize:7.2, cellPadding:1.8, lineColor:[210,218,228], minCellHeight:7 },
    headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7.2, fontStyle:'bold' },
    columnStyles:{ 0:{ cellWidth:16, halign:'center' }, 2:{ cellWidth:52 } },
    didParseCell: function(d){
      if (d.section === 'body' && d.column.index === 2 && String(d.cell.raw).indexOf('(1)') === 0) {
        d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold';
      }
    }
  });
  y = doc.lastAutoTable.finalY + 4;

  doc.setFontSize(6.6); doc.setTextColor(100,116,139);
  doc.text('Each observation is given one of the following numbers to indicate the action recommended:', M, y); y += 3.3;
  doc.text('(1) Requires urgent attention     (2) Requires improvements     (3) Requires some attention     (4) Does not comply with current National Rules for Electrical Installations.', M, y); y += 3.3;
  doc.text('Using (4) does not necessarily imply that the electrical installation inspected is unsafe.', M, y); y += 6;
  doc.setTextColor(15,23,42);

  if (audit.urgent.length) {
    room(11);
    doc.setFillColor(220,38,38); doc.rect(M, y - 4, W - M*2, 7.5, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
    doc.text('URGENT ATTENTION REQUIRED. The person responsible for the installation must be notified without delay.', M + 3, y + 0.8);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); y += 11;
  }

  doc.setFontSize(7.4);
  const rec = doc.splitTextToSize('On the basis that all observations requiring urgent attention have been completed without delay, we recommend that this installation is further inspected and tested after an interval of not more than ' +
    (p.intervalValue || '____') + ' ' + (p.intervalUnit || 'years') + '.', W - M*2);
  room(rec.length * 4 + 6);
  doc.text(rec, M, y); y += rec.length * 4 + 5;

  sect('Overall condition of the installation');
  opts(M, y, ['Satisfactory','Unsatisfactory'], audit.condition || job.periodic.condition); y += 12;

  sect('Declaration');
  doc.setFontSize(6.8); doc.setTextColor(100,116,139);
  const dec = doc.splitTextToSize('I/We are responsible for the inspection and testing of the electrical installation described in this report, and confirm to the best of my/our knowledge that the tests and observations recorded represent an accurate assessment, within the limits specified, of the condition of the electrical installation.', W - M*2);
  doc.text(dec, M, y); y += dec.length * 3.2 + 6;
  doc.setTextColor(15,23,42);

  const sg = (job.sig && job.sig.post) || {};
  room(26);
  if (sg.sig) { try { doc.addImage(sg.sig, 'PNG', M + 2, y - 1, 44, 15); } catch(e){} }
  const sy = y + 16;
  doc.setDrawColor(150,163,180); doc.setLineWidth(0.25);
  doc.line(M, sy, M + 62, sy);
  doc.line(M + 70, sy, M + 124, sy);
  doc.line(M + 132, sy, W - M, sy);
  doc.setFontSize(7.4); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
  doc.text((sg.name || '').toUpperCase(), M + 2, sy - 2);
  doc.text(p.certifierNo || '', M + 72, sy - 2);
  doc.text(fmtDate(sg.date || job.date), M + 134, sy - 2);
  doc.setFontSize(6.6); doc.setFont('helvetica','normal'); doc.setTextColor(120,133,150);
  doc.text('Inspected and tested by (signed)', M, sy + 3.6);
  doc.text('Certifier No.', M + 70, sy + 3.6);
  doc.text('Date', M + 132, sy + 3.6);

  /* ---------- page furniture, added once at the end so nothing lands mid-page ---------- */
  const total = doc.internal.getNumberOfPages();
  for (let i = 1; i <= total; i++) {
    doc.setPage(i);
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.25);
    doc.line(M, 283, W - M, 283);
    doc.setFontSize(6.4); doc.setFont('helvetica','normal'); doc.setTextColor(140,152,168);
    if (settings.pirDisclaimer !== false) {
      doc.text('This report is issued for record purposes. The official Safe Electric Periodic Inspection Report must still be completed and submitted.', M, 287);
    }
    doc.setTextColor(100,116,139); doc.setFont('helvetica','bold'); doc.setFontSize(6.8);
    doc.text('Page ' + i + ' of ' + total, W - M, 287, { align:'right' });
  }

  doc.save('PIR-' + (job.customerName || 'record').replace(/[^a-z0-9]/gi, '-') + '.pdf');
}

/* ================= PIR VIEW (Safe Electric periodic inspection) ================= */
function TriState({n, label, na, value, onChange}){
  const opts = na ? ['Yes','No','N/A'] : ['Yes','No'];
  return (
    <div className="flex items-start gap-2 py-1.5 border-b border-slate-100">
      <span className="text-xs font-bold text-slate-400 w-6 pt-1">{n}</span>
      <span className="text-sm text-slate-700 flex-1">{label}</span>
      <div className="flex gap-1">
        {opts.map(o => (
          <button key={o} onClick={()=>onChange(value === o ? '' : o)}
            className={'text-xs px-2 py-1 rounded-md border font-semibold ' +
              (value === o
                ? (o === 'No' ? 'bg-red-600 text-white border-red-600' : o === 'Yes' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-500 text-white border-slate-500')
                : 'border-slate-300 text-slate-500')}>{o}</button>
        ))}
      </div>
    </div>
  );
}

function PirView({job, up, settings}){
  const p = job.pir || {};
  const setP = (patch) => up({ pir: Object.assign({}, p, patch) });
  /* The PIR carries its own declaration, so the signature is captured here
     rather than on the (hidden) Sign-off tab. Stored in sig.post so both
     reports and the form layout pick it up. */
  const sig = (job.sig && job.sig.post) || { name:'', sig:'', date:'' };
  const upSig = (patch) => up({ sig: Object.assign({}, job.sig, { post: Object.assign({}, sig, patch) }) });
  const setQ = (n, v) => setP({ q: Object.assign({}, p.q || {}, { ['q'+n]: v }) });
  const audit = pirAudit(job);

  const addObs = () => setP({ obs: [...(p.obs||[]), { id: uid(), ref:'', comment:'', code:'3' }] });
  const upObs = (id, patch) => setP({ obs: (p.obs||[]).map(o => o.id === id ? Object.assign({}, o, patch) : o) });
  const delObs = (id) => setP({ obs: (p.obs||[]).filter(o => o.id !== id) });
  const addRcd = () => setP({ rcds: [...(p.rcds||[]), { id: uid(), desc:'', trip:'30', time:'' }] });
  const upRcd = (id, patch) => setP({ rcds: (p.rcds||[]).map(r => r.id === id ? Object.assign({}, r, patch) : r) });
  const delRcd = (id) => setP({ rcds: (p.rcds||[]).filter(r => r.id !== id) });


  return (<div className="space-y-4 pb-24">
    <div className="rounded-xl border border-amber-300 bg-amber-50 p-3 text-xs text-amber-900">
      <b>Not an official Safe Electric report.</b> This records the same information for your own use. The official Safe Electric Periodic Inspection Report must still be completed and submitted.
    </div>

    {(audit.unanswered.length > 0 || audit.nos.length > 0) && (
      <div className="rounded-xl border border-slate-200 bg-white p-3 text-xs space-y-1">
        {audit.unanswered.length > 0 && <div className="text-slate-600"><b>{audit.unanswered.length}</b> question{audit.unanswered.length===1?'':'s'} not answered: {audit.unanswered.join(', ')}</div>}
        {audit.nos.length > 0 && <div className="text-red-700 font-semibold">Answered "No" (must be referred to in observations): {audit.nos.join(', ')}</div>}
      </div>
    )}

    <Section title="Report details">
      <div className="grid sm:grid-cols-2 gap-3">
        <Field label="PR No." value={p.prNo} onChange={v=>setP({prNo:v})}/>
        <Field label="Installation approx age" value={p.approxAge} onChange={v=>setP({approxAge:v})} placeholder="e.g. 20 years"/>
        <Field label="Occupant name / trading as" value={p.occupant} onChange={v=>setP({occupant:v})}/>
        <Dropdown label="Occupant in attendance?" value={p.occupantAttended} onChange={v=>setP({occupantAttended:v})} options={['Yes','No']}/>
        <Dropdown label="Installation category" value={p.category} onChange={v=>setP({category:v})} options={['Domestic','Commercial','Industrial','Other']} required/>
        <Dropdown label="Reason for inspection" value={job.periodic.reason} onChange={v=>up({periodic:{...job.periodic, reason:v}})} options={['Insurance Inspection','Safety Audit','Other']} required/>
        {(job.periodic.reason === 'Other' || p.category === 'Other') && <Field label="If other, specify" value={p.reasonOther} onChange={v=>setP({reasonOther:v})}/>}
      </div>
    </Section>

    <Section title="Extent of installation covered">
      <Dropdown label="Entire installation?" value={p.entireInstall} onChange={v=>setP({entireInstall:v})} options={['Yes','No']} required/>
      {p.entireInstall === 'No' && <Field label="If partial, specify what this report refers to" value={p.partialDetail} onChange={v=>setP({partialDetail:v})} area required/>}
      <p className="text-xs text-slate-400 mt-2">Cables concealed within trunking, conduit or the fabric of the building have not been inspected unless stated otherwise.</p>
    </Section>

    <Section title="Supply characteristics">
      <div className="grid sm:grid-cols-3 gap-3">
        <Dropdown label="System earthing" value={p.earthing} onChange={v=>setP({earthing:v})} options={['TNCS','TT','TNS','IT']} required/>
        <Dropdown label="Installation voltage" value={p.phase} onChange={v=>setP({phase:v})} options={['Single Phase','Three Phase']} required/>
        <Field label="Max prospective S/C current (A)" value={p.pscc} onChange={v=>setP({pscc:v})} inputMode="decimal"/>
        <Field label="L1 (V)" value={p.v1} onChange={v=>setP({v1:v})} inputMode="decimal"/>
        {p.phase === 'Three Phase' && <Field label="L2 (V)" value={p.v2} onChange={v=>setP({v2:v})} inputMode="decimal"/>}
        {p.phase === 'Three Phase' && <Field label="L3 (V)" value={p.v3} onChange={v=>setP({v3:v})} inputMode="decimal"/>}
        {p.phase === 'Three Phase' && <Field label="L1-L2 (V)" value={p.v12} onChange={v=>setP({v12:v})} inputMode="decimal"/>}
        {p.phase === 'Three Phase' && <Field label="L2-L3 (V)" value={p.v23} onChange={v=>setP({v23:v})} inputMode="decimal"/>}
        {p.phase === 'Three Phase' && <Field label="L3-L1 (V)" value={p.v31} onChange={v=>setP({v31:v})} inputMode="decimal"/>}
        <Dropdown label="Main isolation / overcurrent device" value={p.mainIsolation} onChange={v=>setP({mainIsolation:v})} options={['None','Switch Fuse','MCB','MCCB']}/>
        <Field label="Nominal rating (A)" value={p.nominalRating} onChange={v=>setP({nominalRating:v})} inputMode="decimal"/>
      </div>
      <p className="text-xs text-slate-500 mt-3 mb-2">If a main RCD is used as the main isolating device:</p>
      <div className="grid sm:grid-cols-2 gap-3">
        <Field label="Rated current In (A)" value={p.mainRcdIn} onChange={v=>setP({mainRcdIn:v})} inputMode="decimal"/>
        <Field label="Tripping current IΔn (mA)" value={p.mainRcdIdn} onChange={v=>setP({mainRcdIdn:v})} inputMode="decimal"/>
      </div>
    </Section>

    {PIR_Q.map(group => (
      <Section key={group.g} title={group.g}>
        {group.items.map(it => (
          <TriState key={it[0]} n={it[0]} label={it[1]} na={it[2]}
            value={(p.q||{})['q'+it[0]] || ''} onChange={v=>setQ(it[0], v)}/>
        ))}
        {group.g === 'Distribution board(s)' && (
          <div className="pt-3">
            <Dropdown label="17. Sub circuit isolation and overcurrent device type" value={p.q17type} onChange={v=>setP({q17type:v})} options={['Fuse','Mcb']}/>
          </div>
        )}
      </Section>
    ))}

    <Section title="20. RCDs" right={<button className="text-xs font-bold" style={{color:'var(--c1)'}} onClick={addRcd}>+ Add RCD</button>}>
      {(p.rcds||[]).length === 0 && <p className="text-sm text-slate-400">No RCDs added.</p>}
      {(p.rcds||[]).map(r => {
        const t = parseFloat(r.time);
        const bad = !isNaN(t) && t > 300;
        return (
          <div key={r.id} className="grid grid-cols-12 gap-2 mb-2 items-end">
            <div className="col-span-5"><Field label="Circuit description" value={r.desc} onChange={v=>upRcd(r.id,{desc:v})} placeholder="Sockets"/></div>
            <div className="col-span-3"><Field label="Tripping current (mA)" value={r.trip} onChange={v=>upRcd(r.id,{trip:v})} inputMode="decimal"/></div>
            <div className="col-span-3"><Field label="Longest trip time (ms)" value={r.time} onChange={v=>upRcd(r.id,{time:v})} inputMode="decimal" className={bad ? 'warn' : ''}/></div>
            <div className="col-span-1"><button className="btn btn-g w-full" onClick={()=>delRcd(r.id)}>✕</button></div>
            {bad && <div className="col-span-12 text-xs text-red-600 font-semibold -mt-1">Trip time over 300 ms. Raise an observation.</div>}
          </div>
        );
      })}
    </Section>

    <Section title="Summary test data">
      <div className="grid sm:grid-cols-2 gap-3">
        <Field label="Min insulation resistance (MΩ)" value={p.minIR} onChange={v=>setP({minIR:v})} inputMode="decimal"
          hint={parseFloat(p.minIR) > 0 && parseFloat(p.minIR) < 1 ? 'Below 1 MΩ minimum' : ''}/>
        <Field label="Max resistance of protective conductor (Ω)" value={p.maxRp} onChange={v=>setP({maxRp:v})} inputMode="decimal"/>
        <Field label="Max fault loop impedance (Ω)" value={p.maxZs} onChange={v=>setP({maxZs:v})} inputMode="decimal"/>
        <div className="grid grid-cols-2 gap-2">
          <Field label="Device type" value={p.zsDeviceType} onChange={v=>setP({zsDeviceType:v})} placeholder="B / C"/>
          <Field label="Device size" value={p.zsDeviceSize} onChange={v=>setP({zsDeviceSize:v})} placeholder="32A"/>
        </div>
      </div>
      {parseFloat(p.minIR) > 0 && parseFloat(p.minIR) < 1 && <p className="text-xs text-red-600 font-semibold mt-2">Insulation resistance is below the 1 MΩ minimum. This must be raised as an observation.</p>}
    </Section>

    <Section title="Quality of workmanship">
      <Seg label="" value={p.workmanship} onChange={v=>setP({workmanship:v})} options={['Very Good','Satisfactory','Poor']}/>
    </Section>

    <Section title="Test instrument serial numbers">
      <div className="grid sm:grid-cols-2 gap-3">
        <Field label="Continuity tester" value={p.instContinuity} onChange={v=>setP({instContinuity:v})}/>
        <Field label="Insulation resistance tester" value={p.instIR} onChange={v=>setP({instIR:v})}/>
        <Field label="Loop impedance tester" value={p.instLoop} onChange={v=>setP({instLoop:v})}/>
        <Field label="RCD tester" value={p.instRcd} onChange={v=>setP({instRcd:v})}/>

    <Section title="Observations and recommendations" right={<button className="text-xs font-bold" style={{color:'var(--c1)'}} onClick={addObs}>+ Add observation</button>}>
      <Seg label="" value={p.noRemedial} onChange={v=>setP({noRemedial:v})} options={['No remedial work is required','The following observations are made']}/>
      {audit.nos.length > 0 && p.noRemedial === 'No remedial work is required' && (
        <p className="text-xs text-red-600 font-semibold mt-2">Questions {audit.nos.join(', ')} were answered "No". These must be referred to in the observations.</p>
      )}
      <div className="mt-3 space-y-2">
        {(p.obs||[]).map((o, i) => (
          <div key={o.id} className="grid grid-cols-12 gap-2 items-end">
            <div className="col-span-2"><Field label="Ref no." value={o.ref} onChange={v=>upObs(o.id,{ref:v})} placeholder={String(i+1)}/></div>
            <div className="col-span-7"><Field label="Comment" value={o.comment} onChange={v=>upObs(o.id,{comment:v})} required/></div>
            <div className="col-span-2"><Dropdown label="Code" value={o.code} onChange={v=>upObs(o.id,{code:v})} options={['1','2','3','4']}/></div>
            <div className="col-span-1"><button className="btn btn-g w-full" onClick={()=>delObs(o.id)}>✕</button></div>
            <div className="col-span-12 text-xs text-slate-500 -mt-1">({o.code}) {PIR_CODES[o.code]}</div>

      <div className="mt-3 text-xs text-slate-500 leading-relaxed">
        (1) Requires urgent attention&nbsp; (2) Requires improvements&nbsp; (3) Requires some attention&nbsp; (4) Does not comply with current National Rules.
        Using (4) does not necessarily imply the installation is unsafe.
      </div>
      {audit.urgent.length > 0 && (
        <div className="mt-3 rounded-lg bg-red-600 text-white text-sm font-bold p-3">
          {audit.urgent.length} observation{audit.urgent.length===1?'':'s'} marked "requires urgent attention". The person responsible for the installation must be notified without delay.
        </div>
      )}

    <Section title="Overall condition and re-inspection">
      <Dropdown label="Overall condition of installation" value={job.periodic.condition} onChange={v=>up({periodic:{...job.periodic, condition:v}})} options={['Satisfactory','Unsatisfactory']} required/>

        <p className="text-xs text-red-600 font-semibold mt-2">An observation requires urgent attention, so this should not be recorded as Satisfactory.</p>
      )}
      <div className="grid sm:grid-cols-2 gap-3 mt-3">
        <Field label="Re-inspect after not more than" value={p.intervalValue} onChange={v=>setP({intervalValue:v})} inputMode="decimal" placeholder="5"/>
        <Dropdown label="Unit" value={p.intervalUnit} onChange={v=>setP({intervalUnit:v})} options={['months','years']}/>
        <Field label="Certifier no." value={p.certifierNo} onChange={v=>setP({certifierNo:v})}/>
      </div>
      <p className="text-xs text-slate-400 mt-2">On the basis that all observations requiring urgent attention have been completed without delay.</p>
    </Section>

    <Section title="Declaration" chip={sig.sig ? <span className="chip stagechip-done">Signed</span> : <span className="chip stagechip-post">Open</span>}>
      <p className="text-xs text-slate-500 mb-3 leading-relaxed">
        I/We are responsible for the inspection and testing of the electrical installation described in this report, and confirm to the best of my/our knowledge that the tests and observations recorded represent an accurate assessment, within the limits specified, of the condition of the electrical installation.
      </p>
      {audit.unanswered.length > 0 && (
        <div className="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-900">
          <b>{audit.unanswered.length} question{audit.unanswered.length===1?'':'s'} still unanswered:</b> {audit.unanswered.join(', ')}. All questions must be answered before signing.
        </div>
      )}
      <div className="grid sm:grid-cols-2 gap-3 mb-3">
        <Field label="Inspected and tested by" value={sig.name} onChange={v=>upSig({name:v})} required/>
        <Field label="Certifier no." value={p.certifierNo} onChange={v=>setP({certifierNo:v})}/>
        <Field label="Date" type="date" value={sig.date || job.date} onChange={v=>upSig({date:v})}/>
      </div>
      <SignaturePad value={sig.sig} onChange={v=>upSig({sig:v})}/>
      {sig.sig && <p className="text-xs text-emerald-600 font-semibold mt-2">Signed. The signature appears on both reports.</p>}
    </Section>
  </div>);
}

  };
  return (<div className="space-y-4 pb-24">
    <div className="flex gap-2">
      <input className="field" placeholder="Search customers…" value={q} onChange={e=>setQ(e.target.value)}/>

        <Field label="Email" value={edit.email} onChange={v=>setEdit({...edit, email:v})} type="email"/>

function LoginView({onLocal}){
  const [email, setEmail] = useState(store.get('lastEmail','') || '');
  const [pw, setPw] = useState('');
  const [sent, setSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [useLink, setUseLink] = useState(false);
  const signIn = async () => {
    if(!email.includes('@')) return setErr('Enter a valid email address.');
    if(!pw) return setErr('Enter your password.');
    setBusy(true); setErr('');
    try{
      await cloud.auth.signInWithEmailAndPassword(email.trim().toLowerCase(), pw);
      store.set('lastEmail', email.trim().toLowerCase());
    }catch(e){
      setErr(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password'
        ? 'Email or password is not correct.'
        : e.code === 'auth/user-not-found' ? 'No account for that email. Ask your admin to add you.'
        : e.code === 'auth/too-many-requests' ? 'Too many attempts. Wait a few minutes and try again.'
        : e.message);
      setBusy(false);
    }
  };
  const reset = async () => {
    if(!email.includes('@')) return setErr('Enter your email first, then tap reset.');
    try{ await cloud.auth.sendPasswordResetEmail(email.trim().toLowerCase()); setErr(''); alert('Password reset email sent to ' + email); }
    catch(e){ setErr(e.message); }
  };
  const send = async () => {
    if(!email.includes('@')) return setErr('Enter a valid email address.');
    setBusy(true); setErr('');
    try{
      await cloud.auth.sendSignInLinkToEmail(email.trim().toLowerCase(), { url: window.location.href, handleCodeInApp:true });
      store.set('lastEmail', email.trim().toLowerCase());
      setSent(true);
    }catch(e){ setErr(e.message); }
    setBusy(false);
  };
  return (<div className="min-h-screen flex items-center justify-center p-6" style={{background:'var(--c1)'}}>
    <div className="card p-6 w-full max-w-sm">
      <div className="text-2xl mb-1">⚡</div>
      <h1 className="text-xl font-bold text-slate-800 mb-1">{(window.APP_CONFIG && window.APP_CONFIG.companyName) || 'Site Test Record'}</h1>
      <p className="text-sm text-slate-500 mb-5">{useLink ? 'We will email you a one-time sign-in link.' : 'Sign in with your work email and password.'}</p>
      {sent ? (<div className="rounded-xl bg-emerald-50 border border-emerald-200 p-4 text-sm text-emerald-900">
        Link sent to <b>{email}</b>. Open it on this device to finish signing in.
        <button className="btn btn-g w-full mt-3" onClick={()=>setSent(false)}>Use a different email</button>
      </div>) : (<div className="space-y-3">
        <Field label="Work email" value={email} onChange={setEmail} type="email"/>
        {!useLink && (
          <div>
            <label className="block text-xs font-semibold text-slate-600 mb-1">Password</label>
            <input className="field" type="password" value={pw} onChange={e=>setPw(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') signIn(); }} autoComplete="current-password"/>
          </div>
        )}
        {err && <div className="text-xs text-red-600 font-semibold">{err}</div>}
        {useLink
          ? <button className="btn btn-p w-full" disabled={busy} onClick={send}>{busy ? 'Sending…' : 'Email me a sign-in link'}</button>
          : <button className="btn btn-p w-full" disabled={busy} onClick={signIn}>{busy ? 'Signing in…' : 'Sign in'}</button>}
        <div className="flex justify-between text-xs">
          <button className="font-semibold" style={{color:'var(--c1)'}} onClick={()=>{ setUseLink(!useLink); setErr(''); }}>
            {useLink ? 'Use a password instead' : 'Email me a link instead'}
          </button>
          {!useLink && <button className="text-slate-500 font-semibold" onClick={reset}>Forgot password?</button>}
        </div>
        { !CLOUD_ON && <button className="btn btn-g w-full" onClick={onLocal}>Work offline (Firebase not configured)</button> }
      </div>)}
    </div>
  </div>);
}

function App(){
  const [settings, setSettings] = useState(() => applyBrand(store.get('settings', null)));
  const [customers, setCustomers] = useState(() => store.get('customers', []));
  const [jobs, setJobs] = useState(() => store.get('jobs', []));
  const [templates, setTemplates] = useState(() => store.get('templates', []));
  const [members, setMembers] = useState([]);
  const [view, setView] = useState('dash');
  const [jobId, setJobId] = useState(null);
  const [toastMsg, setToastMsg] = useState('');
  const [mode, setMode] = useState(CLOUD_ON ? 'boot' : 'local');   // boot | login | onboard | cloud | local
  const [me, setMe] = useState({ email:'', role:'', name:'' });
  const [mine, setMine] = useState(false);
  const [remoteLinks, setRemoteLinks] = useState(null);
  const tapRef = useRef({ n:0, t:0 });
  const [, forceTick] = useState(0);
  const secretTap = async () => {
    const now = Date.now();
    const r = tapRef.current;
    r.n = (now - r.t < 1200) ? r.n + 1 : 1;
    r.t = now;
    if(r.n >= 7){
      r.n = 0;
      if(protechUnlocked()){
        sessionStorage.removeItem('protech_unlocked');
        forceTick(x=>x+1); toast('Protech mode off');
        return;
      }
      const pin = prompt('Maintenance PIN');
      if(!pin) return;
      toast('Checking…');
      const res = await verifyPin(pin.trim());
      if(res.ok){
        sessionStorage.setItem('protech_unlocked','1');
        forceTick(x=>x+1); setView('settings'); toast('Protech mode on');
      } else {
        toast(res.error || 'Incorrect PIN');
      }
    }
  };
  const toastTimer = useRef(null);
  const toast = (m) => { setToastMsg(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(()=>setToastMsg(''), 2200); };
  
  const isCloud = mode === 'cloud';

  /* Branding comes from the config block, seeded into defaultSettings(). */

  /* Load logo from logo.txt in the same directory - PRIMARY logo source.
     Overrides any config/stored logo when present. Config logo is fallback only. */
  useEffect(() => {
    fetch('logo.txt')
      .then(res => res.ok ? res.text() : Promise.reject('No logo.txt'))
      .then(text => {
        if(text && text.includes('data:image')){
          setSettings(s => ({...s, logo: text.trim()}));
        }
      })
      .catch(e => console.log('Checking logo.txt failed. Using stored logo if any.'));
  }, []);

  /* branding applied live, always */
  useEffect(()=>{
    const r = document.documentElement.style;
    r.setProperty('--c1', settings.c1);
    r.setProperty('--c2', settings.useC2 ? settings.c2 : settings.c1);
    r.setProperty('--c3', settings.useC3 ? settings.c3 : settings.c1);
    const [rr,gg,bb] = hexToRgb(settings.c1); r.setProperty('--c1-soft', 'rgba('+rr+','+gg+','+bb+',.08)');
    document.title = (settings.companyName || 'Site') + ' Test Record';
    if(!isCloud) store.set('settings', settings);
  }, [settings, isCloud]);
  
  useEffect(()=>{ if(!isCloud) store.set('customers', customers); }, [customers, isCloud]);
  useEffect(()=>{ if(!isCloud){ const t = setTimeout(()=>store.set('jobs', jobs), 400); return ()=>clearTimeout(t); } }, [jobs, isCloud]);
  useEffect(()=>{ store.set('templates', templates); }, [templates]);

  /* ---- auth + company bootstrap ---- */
  useEffect(()=>{
    if(!CLOUD_ON) return;
    if(!cloudInit()){ setMode('local'); return; }
    (async ()=>{
      try{
        if(cloud.auth.isSignInWithEmailLink(window.location.href)){
          let em = store.get('lastEmail','');
          if(!em) em = window.prompt('Confirm the email address you requested the link with:') || '';
          await cloud.auth.signInWithEmailLink(em.trim().toLowerCase(), window.location.href);
          window.history.replaceState({}, '', window.location.pathname);
        }
      }catch(e){ alert('Sign-in link failed: ' + e.message); }
      cloud.auth.onAuthStateChanged(async (user) => {
        if(!user){ setMode('login'); return; }
        const email = (user.email||'').toLowerCase();
        cloud.email = email;
        const membership = await cloudLookupMembership(email);
        if(!membership){ setMe({ email, role:'', name:'' }); setMode('onboard'); return; }
        cloud.companyId = membership.companyId; cloud.role = membership.role; cloud.name = membership.name || '';
        setMe({ email, role: membership.role, name: membership.name || '' });
        setMode('cloud');
      });
    })();
  }, []);

  /* ---- live sync when signed in ---- */
  useEffect(()=>{
    if(!isCloud || !cloud.companyId) return;
    const un1 = companyRef().onSnapshot(d => { const data = d.data(); if(data && data.settings) setSettings(applyBrand(data.settings)); });
    const un2 = jobsRef().orderBy('updatedAt','desc').limit(200).onSnapshot(s => {
      setJobs(prev => s.docs.map(d => {
        const remote = Object.assign({ id:d.id }, d.data());
        const local = prev.find(j => j.id === d.id);
        remote.photos = local && local.photos ? local.photos : (remote.photos || []);
        return remote;
      }));
    });
    const un3 = custRef().orderBy('name').onSnapshot(s => setCustomers(s.docs.map(d => Object.assign({ id:d.id }, d.data()))));
    const un4 = usersRef().onSnapshot(s => setMembers(s.docs.map(d => d.data())));
    return () => { un1(); un2(); un3(); un4(); };
  }, [isCloud, me.email]);

  /* ---- api: same calls whether local or cloud ---- */
  const saveTimers = useRef({});
  const api = useMemo(() => ({
    cloud: isCloud, email: me.email, role: me.role, name: me.name,
    saveJob: (job) => {
      if(!isCloud) return;
      clearTimeout(saveTimers.current[job.id]);
      saveTimers.current[job.id] = setTimeout(()=>{ jobsRef().doc(job.id).set(stripPhotos(job), { merge:true }).catch(()=>{}); }, 500);
    },
    deleteJob: async (id) => { if(isCloud) await jobsRef().doc(id).delete(); },
    savePhoto: async (jobId, p) => { if(isCloud) await photosRef(jobId).doc(p.id).set({ data:p.data, caption:p.caption, circuitId:p.circuitId, ts:p.ts, include:p.include }); },
    deletePhoto: async (jobId, pid) => { if(isCloud) await photosRef(jobId).doc(pid).delete(); },
    saveCustomer: async (c) => { if(isCloud) await custRef().doc(c.id).set(c); },
    saveSettings: async (s) => { if(isCloud && me.role === 'admin') await companyRef().set({ settings: s }, { merge:true }); },
    addMember: (email, name, role) => cloudAddMember(email, name, role),
    removeMember: (email) => cloudRemoveMember(email)
  }), [isCloud, me.email, me.role, me.name]);

  const job = jobs.find(j => j.id === jobId) || null;
  const setJob = (next) => { setJobs(prev => prev.map(j => j.id === next.id ? next : j)); api.saveJob(next); };

  const openJob = async (id) => {
    setJobId(id); setView('job');
    if(isCloud){
      const j = jobs.find(x=>x.id===id);
      if(j && (!j.photos || !j.photos.length)){
        try{ const pics = await cloudLoadPhotos(id); if(pics.length) setJobs(prev => prev.map(x => x.id===id ? Object.assign({}, x, { photos: pics }) : x)); }catch(e){}
      }
    }
  };
  const newJob = (cust) => {
    const j = blankJob();
    const lastJob = jobs[0];
    if(lastJob){ j.electrician = lastJob.electrician || me.name; j.instruments = JSON.parse(JSON.stringify(lastJob.instruments || blankInstrumentRows())).map(i => Object.assign({}, i, { id: uid() })); }
    else j.electrician = me.name;
    if(isCloud){ j.createdBy = me.email; j.assignedTo = me.email; j.assignedName = me.name; }
    
    if(cust){ 
      j.customerId = cust.id; j.customerName = cust.name; j.address = cust.address; j.phone = cust.phone; j.email = cust.email; 
      const prevJob = jobs.find(x => x.customerId === cust.id);
      if (prevJob && window.confirm(`Copy previous installation details and circuits for ${cust.name}? (Test results will be cleared)`)) {
          j.dbRef = prevJob.dbRef || '';
          j.category = prevJob.category || '';
          j.installType = prevJob.installType || '';
          j.mprn = prevJob.mprn || '';
          j.maxDemand = prevJob.maxDemand || '';
          j.supplyChar = prevJob.supplyChar || '';
          j.maxRpRe = prevJob.maxRpRe || '';
          j.maxRe = prevJob.maxRe || '';
          j.bonding = JSON.parse(JSON.stringify(prevJob.bonding || j.bonding));
          if (prevJob.circuits && prevJob.circuits.length > 0) {
              j.circuits = prevJob.circuits.map(c => Object.assign({}, c, { id: uid(), pre: blankPre(), post: blankPost(), notes: '' }));
          }
          if (prevJob.instruments && prevJob.instruments.length > 0) {
              j.instruments = prevJob.instruments.map(i => Object.assign({}, i, { id: uid() }));
          }
      }
    }
    setJobs(prev => [j, ...prev]); api.saveJob(j); setJobId(j.id); setView('job');
  };
  
  const deleteJob = (id) => {
    const j = jobs.find(x=>x.id===id);
    if(confirm('Delete job for ' + (j.customerName || 'this customer') + '?')){
      setJobs(prev => prev.filter(x=>x.id!==id)); api.deleteJob(id);
    }
  };
  const saveCustomers = (updater) => setCustomers(prev => {
    const next = typeof updater === 'function' ? updater(prev) : updater;
    if(isCloud) next.filter(c => !prev.find(p => p.id===c.id && JSON.stringify(p)===JSON.stringify(c))).forEach(c => api.saveCustomer(c));
    return next;
  });
  const saveSettings = (s) => { setSettings(s); api.saveSettings(s); };

  if(mode === 'boot') return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">Signing in…</div>;
  if(mode === 'login') return <LoginView onLocal={()=>setMode('local')}/>;
  if(mode === 'onboard') return <OnboardView email={me.email} onSignOut={()=>cloud.auth.signOut()}
    onCreate={async (companyName, name) => {
      const r = await cloudCreateCompany(companyName, me.email, name);
      cloud.companyId = r.companyId; cloud.role = 'admin'; cloud.name = name;
      setMe({ email: me.email, role:'admin', name }); setMode('cloud');
    }}/>;

  const visibleJobs = isCloud && mine ? jobs.filter(j => j.assignedTo === me.email) : jobs;
  const headerTitle = view==='job' && job ? (job.customerName || 'Job') : view==='customers' ? 'Customers' : view==='settings' ? 'Settings' : (settings.companyName || 'Site Test Record');

  return (<div className="min-h-screen">
    <header className="sticky top-0 z-40 noprint" style={{background:'var(--c1)', color: textOn(settings.c1)}}>
      <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
        {view!=='dash'
          ? <button className="text-2xl leading-none -ml-1 px-1" onClick={()=>{ setView('dash'); setJobId(null); }}>‹</button>
          : (settings.logo ? <img src={settings.logo} className="h-8 max-w-[90px] object-contain bg-white rounded-md p-0.5"/> : <span className="text-xl">⚡</span>)}
        <div className="min-w-0 flex-1">
          <div className="font-bold truncate leading-tight" onClick={secretTap}>{headerTitle}</div>
          {view==='job' && job && <div className="text-[11px] opacity-75 truncate">{[job.jobType === 'Periodic' ? 'PIR' : 'Install', job.jobNo, fmtDate(job.date), isCloud ? 'Syncing...' : 'Local Cache Autosaving'].filter(Boolean).join(' • ')}</div>}
          {view==='dash' && <div className="text-[11px] opacity-75 truncate">{isCloud ? (me.name || me.email) + ' • ' + me.role : 'Local mode • this device only'}</div>}
        </div>
        {view==='job' && job && <StatusChip job={job}/>}
        {view==='dash' && isCloud && (<div className="flex gap-1.5 shrink-0">
          <button className="text-xs font-bold px-3 py-2 rounded-full" style={{background:'rgba(255,255,255,.16)'}} onClick={()=>cloud.auth.signOut().then(()=>window.location.reload())}>Sign out</button>
        </div>)}
      </div>
      {settings.useC2 && <div style={{height:3, background:'var(--c2)'}}/>}
      {settings.useC3 && <div style={{height:2, background:'var(--c3)'}}/>}
    </header>

    <main className="max-w-3xl mx-auto px-4 pt-4">
      {view==='dash' && (<div>
        {isCloud && (<div className="flex gap-2 mb-3">
          <button className={'tabbtn ' + (mine ? 'on' : 'off')} onClick={()=>setMine(true)}>My jobs</button>
          <button className={'tabbtn ' + (!mine ? 'on' : 'off')} onClick={()=>setMine(false)}>All company jobs</button>
        </div>)}
        <Dashboard jobs={visibleJobs} openJob={openJob} newJob={()=>newJob()} go={setView} deleteJob={deleteJob}/>
      </div>)}
      {view==='customers' && <CustomersView customers={customers} setCustomers={saveCustomers} toast={toast} onNewJobFor={(c)=>newJob(c)}/>}
      {view==='settings' && <SettingsView settings={settings} setSettings={saveSettings} api={api} members={members} links={remoteLinks || BRAND.links || []}/>}
      {view==='job' && job && <JobEditor job={job} setJob={setJob} allJobs={jobs} customers={customers} setCustomers={saveCustomers} settings={settings} templates={templates} setTemplates={setTemplates} toast={toast} back={()=>setView('dash')} api={api} members={members}/>}
      {view==='job' && !job && <div className="card p-8 text-center text-slate-400">Job not found. <button className="font-bold" style={{color:'var(--c1)'}} onClick={()=>setView('dash')}>Back to dashboard</button></div>}
    </main>
    <Toast msg={toastMsg}/>
    <footer className="max-w-3xl mx-auto px-4 py-6 text-center text-[11px] text-slate-400 noprint">
      {settings.footerText || 'Site data collection tool. Not an official certification platform.'}
    </footer>
  </div>);
}
try{
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  var boot = document.getElementById('boot'); if(boot) boot.style.display = 'none';
}catch(err){ window.__err(err && err.message ? err.message : err); }
</script>
</body>
</html>
