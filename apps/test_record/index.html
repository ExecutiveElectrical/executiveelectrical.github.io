<style>
:root{
  --c1:#151e2e; --c2:#facc15; --c3:#eab308;
  --c1-soft:rgba(21,30,46,.08); --pre:#0891b2; --post:#dc2626;
}
html{ -webkit-text-size-adjust:100%; }
body{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f1f5f9; overscroll-behavior-y:none; }
input,select,textarea{ font-size:16px !important; }
.field{ width:100%; border:1.5px solid #cbd5e1; border-radius:10px; padding:10px 12px; background:#fff; min-height:46px; }
.field:focus{ outline:2px solid var(--c1); outline-offset:1px; border-color:var(--c1); }
.field.warn{ border-color:#f59e0b; background:#fffbeb; }
.field.bad{ border-color:#dc2626; background:#fef2f2; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; padding:12px 18px; font-weight:600; min-height:48px; user-select:none; cursor:pointer; border:0; transition:filter .12s, transform .05s; }
.btn:active{ transform:scale(.985); }
.btn-p{ background:var(--c1); color:#fff; } .btn-p:hover{ filter:brightness(1.12); }
.btn-o{ background:#fff; color:var(--c1); border:1.5px solid var(--c1); }
.btn-g{ background:#e2e8f0; color:#334155; }
.btn-d{ background:#fef2f2; color:#b91c1c; border:1.5px solid #fecaca; }
.card{ background:#fff; border-radius:16px; border:1px solid #e2e8f0; box-shadow:0 1px 3px rgba(15,23,42,.06); }
.tabbtn{ padding:10px 14px; border-radius:999px; font-weight:600; font-size:14px; white-space:nowrap; border:1.5px solid transparent; }
.tabbtn.on{ background:var(--c1); color:#fff; }
.tabbtn.off{ background:#fff; color:#475569; border-color:#e2e8f0; }
.chip{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }
.sigpad{ touch-action:none; background:#fff; border:1.5px dashed #94a3b8; border-radius:12px; width:100%; height:150px; }
.gridin{ border:1px solid #cbd5e1; border-radius:8px; padding:8px 6px; width:100%; text-align:center; min-height:42px; background:#fff; }
.gridin:focus{ outline:2px solid var(--c1); }
.gridin.bad{ border-color:#dc2626; background:#fef2f2; color:#b91c1c; font-weight:700; }
.gridin.warn{ border-color:#f59e0b; background:#fffbeb; color:#92400e; font-weight:600; }
.stagechip-pre{ background:rgba(8,145,178,.12); color:#0e7490; }
.stagechip-post{ background:rgba(220,38,38,.10); color:#b91c1c; }
.stagechip-done{ background:rgba(22,163,74,.12); color:#15803d; }
::-webkit-scrollbar{ height:6px; width:6px; } ::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:99px; }
@media print{ .noprint{ display:none; } }
.fadein{ animation:fi .18s ease-out; } @keyframes fi{ from{ opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
</style>

/* ================= BRANDING FROM PROTECH CONFIG ================= */
const BRAND = window.APP_CONFIG || {};
/* Protech maintenance unlock. PIN comes from the config block above (set per
   customer by the Factory). Tap the header title 7 times to enter it.
   Note: this is a client-side gate. It hides branding controls from customers;
   it is not protection against anyone who reads the page source. */
const LOCAL_PIN = BRAND.protechPin || '';
const protechUnlocked = () => {
  try{ return sessionStorage.getItem('protech_unlocked') === '1'; }catch(e){ return false; }
};
async function verifyPin(pin){
  return { ok: !!LOCAL_PIN && pin === LOCAL_PIN, error: 'Incorrect PIN' };
}

/* ================= LOCAL FALLBACK STORAGE ================= */
/* Namespaced per company: localStorage is shared across an entire
   github.io domain, so multiple customer deployments must not share keys. */
const STORE_NS = 'etr_' + ((BRAND.companyName || 'app').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 16)) + '_';
const memStore = {};
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(STORE_NS+k); return v ? JSON.parse(v) : fb; }catch(e){ return memStore[k] !== undefined ? memStore[k] : fb; } },
  set(k, v){ try{ localStorage.setItem(STORE_NS+k, JSON.stringify(v)); }catch(e){ memStore[k] = v; } }
};
/* The config block is the source of truth for branding. If a stored settings
   object was created for a different company (e.g. a file copied from another
   deployment, or an older build), re-seed the branding fields from BRAND so a
   customer never sees another company's name, logo or colours. */
function applyBrand(stored){
  const base = defaultSettings();
  if(!stored) return base;
  if(stored.companyName !== base.companyName){
    return Object.assign({}, stored, {
      companyName: base.companyName,
      logo: base.logo,
      footerText: base.footerText,
      website: base.website,
      phone: base.phone || stored.phone,
      email: base.email || stored.email,
      regNo: base.regNo || stored.regNo,
      c1: base.c1, c2: base.c2, c3: base.c3, useC3: base.useC3
    });
  }
  return Object.assign({}, base, stored);
}

const fmtDT = (iso) => { if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('en-IE') + ' ' + d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'}); };

const hexToRgb = (h) => { h=(h||'#151e2e').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const luminance = (h) => { const [r,g,b]=hexToRgb(h); return (0.299*r+0.587*g+0.114*b)/255; };
const textOn = (h) => luminance(h) > 0.6 ? '#0f172a' : '#ffffff';
const argb = (h) => 'FF' + (h||'#151e2e').replace('#','').toUpperCase();

/* Natural size of a data-URI image, cached, so exports never squash the logo. */
const logoDims = {};
function measureLogo(dataUri){
  return new Promise(function(resolve){
    if(!dataUri) return resolve(null);
    if(logoDims[dataUri]) return resolve(logoDims[dataUri]);
    const img = new Image();
    img.onload = function(){ const d = { w: img.naturalWidth, h: img.naturalHeight }; logoDims[dataUri] = d; resolve(d); };
    img.onerror = function(){ resolve(null); };
    img.src = dataUri;
  });
}
/* Fit inside a box while keeping aspect ratio. */
function fitBox(natW, natH, maxW, maxH){
  if(!natW || !natH) return { w: maxW, h: maxH };
  const r = Math.min(maxW / natW, maxH / natH);
  return { w: natW * r, h: natH * r };
}

async function cloudLookupMembership(email){

}
async function cloudCreateCompany(companyName, email, name){
  const id = cloud.db.collection('companies').doc().id;
  await cloud.db.collection('companies').doc(id).set({
    name: companyName, ownerEmail: email, created: nowISO(),
    settings: Object.assign(defaultSettings(), { companyName })
  });
  await cloud.db.collection('companies').doc(id).collection('users').doc(email).set({ email, name, role:'admin', added: nowISO() });
  await cloud.db.collection('invites').doc(email).set({ companyId: id, role:'admin', name, companyName });
  return { companyId:id, role:'admin', name, companyName };
}
async function cloudAddMember(email, name, role){
  const e = email.trim().toLowerCase();
  await usersRef().doc(e).set({ email:e, name, role, added: nowISO() });
  await cloud.db.collection('invites').doc(e).set({ companyId: cloud.companyId, role, name });
}
async function cloudRemoveMember(email){
  await usersRef().doc(email).delete();
  await cloud.db.collection('invites').doc(email).delete();
}
async function cloudLoadPhotos(jobId){
  const snap = await photosRef(jobId).get();
  return snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
}

  const q = (job.pir && job.pir.q) || {};

    condition: urgent.length ? 'Unsatisfactory' : (job.periodic && job.periodic.condition) || '' };
}

function Field({label, value, onChange, type='text', placeholder, required, area, hint, className, inputMode, max, min}){
  const missing = required && !String(value||'').trim();
  const cls = 'field' + (missing ? ' warn' : '') + (className ? ' '+className : '');
  return (<label className="block">
    <span className="text-[13px] font-semibold text-slate-600 mb-1 flex items-center gap-1.5">{label}{required && <span className="text-amber-500">•</span>}</span>
    {area
      ? <textarea className={cls} rows={3} value={value||''} placeholder={placeholder} onChange={e=>onChange(e.target.value)} />
      : <input className={cls} type={type} inputMode={inputMode} max={max} min={min} value={value||''} placeholder={placeholder} onChange={e=>onChange(e.target.value)} />}
    {hint && <span className="text-xs text-slate-400 mt-0.5 block">{hint}</span>}
  </label>);
}

/* Intelligent Dropdown that allows an "Other (specify)" fallback */
function Dropdown({label, value, onChange, options, required, className}) {
  const [custom, setCustom] = useState(value !== '' && !options.includes(value));
  const missing = required && !String(value||'').trim();
  const cls = 'field' + (missing ? ' warn' : '') + (className ? ' '+className : '');

  if (custom) {
    return (<label className="block relative">
      <span className="text-[13px] font-semibold text-slate-600 mb-1 flex items-center gap-1.5">{label}{required && <span className="text-amber-500">•</span>}</span>
      <div className="flex gap-1">
        <input className={cls} value={value||''} onChange={e=>onChange(e.target.value)} autoFocus placeholder="Specify..." />
        <button className="btn btn-g !min-h-[46px] !py-0 px-3" type="button" onClick={()=>{setCustom(false); onChange('');}}>✕</button>
      </div>
    </label>);
  }

  return (<label className="block">
    <span className="text-[13px] font-semibold text-slate-600 mb-1 flex items-center gap-1.5">{label}{required && <span className="text-amber-500">•</span>}</span>
    <select className={cls} value={value||''} onChange={e=>{
      if(e.target.value === '___OTHER___') { setCustom(true); onChange(''); }
      else { onChange(e.target.value); }

      {options.map(o => <option key={o} value={o}>{o}</option>)}

    </select>
  </label>);
}

function SignaturePad({value, onChange, disabled}){
  const ref = useRef(null); const drawing = useRef(false); const dirty = useRef(false);
  useEffect(()=>{
    const c = ref.current; if(!c) return;
    const scale = window.devicePixelRatio || 1;
    const w = c.offsetWidth, h = c.offsetHeight;
    c.width = w*scale; c.height = h*scale;
    const ctx = c.getContext('2d'); ctx.scale(scale, scale);
    ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f172a';
    if(value){ const img = new Image(); img.onload = ()=>ctx.drawImage(img,0,0,w,h); img.src = value; }
  },[]);
  const pos = (e) => { const r = ref.current.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const down = (e) => { if(disabled) return; drawing.current = true; const ctx = ref.current.getContext('2d'); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ref.current.setPointerCapture(e.pointerId); };
  const move = (e) => { if(!drawing.current) return; const ctx = ref.current.getContext('2d'); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); dirty.current = true; };
  const up = () => { if(drawing.current && dirty.current){ onChange(ref.current.toDataURL('image/png')); } drawing.current = false; };
  const clear = () => { const c = ref.current; const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); onChange(''); dirty.current = false; };
  return (<div>
    <canvas ref={ref} className="sigpad" style={disabled ? {opacity:.55, pointerEvents:'none'} : null}
      onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerLeave={up}/>
    {!disabled && <button type="button" className="btn btn-g mt-2 !min-h-[38px] !py-1.5 text-sm" onClick={clear}>Clear signature</button>}
  </div>);
}

/* photo compression */
function compressImage(file, maxDim=1400, quality=0.72){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width:w, height:h } = img;
        if(Math.max(w,h) > maxDim){ const r = maxDim/Math.max(w,h); w = Math.round(w*r); h = Math.round(h*r); }
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

function sc(ws, addr, value, opts={}){
  const cell = ws.getCell(addr);
  cell.value = value;
  cell.font = Object.assign({ name:'Calibri', size:9 }, opts.font||{});
  cell.alignment = Object.assign({ vertical:'middle', horizontal:'left', wrapText:true }, opts.align||{});
  if(opts.fill) cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:opts.fill } };
  if(opts.border !== false) cell.border = opts.border || {};
  return cell;
}

  ws.getRow(H+1).height = 16; ws.getRow(H+2).height = 46;

  const cells = 'ABCDEFGHIJKLMNOPQRSTUVWX'.split('');
  const rowsData = (job.circuits||[]).map(c => [
    c.number, c.designation, c.cableType, c.cableSize, c.points, c.device, c.deviceType, c.amps,
    c.pre.rpre, c.pre.re, c.pre.ll, c.pre.nn, c.pre.ee, c.pre.irPNE, c.pre.irPN, c.pre.ir3ph,
    c.pre.erroneous ? '✓' : '', c.pre.polarity ? '✓' : '',
    [c.post.maxZs, c.post.zs].filter(Boolean).join(' / '), c.post.rcdHalf, c.post.rcd1, c.post.rcd5, c.post.testBtn ? '✓' : '',
    [c.pre.comments, c.post.comments, c.notes].filter(Boolean).join(' | ')
  ]);
  const blankRows = Math.max(0, 12 - rowsData.length);
  const allRows = rowsData.concat(Array.from({length:blankRows}, ()=> cells.map(()=> '')));
  allRows.forEach((vals, i)=>{
    const r = H+3+i; ws.getRow(r).height = 16;
    vals.forEach((v, ci)=> sc(ws, cells[ci]+r, v === '' ? '' : (isNaN(Number(v)) || v==='' || typeof v === 'string' && v.includes('/') ? v : Number(v)), { align:{ horizontal: ci===1 || ci===23 ? 'left' : 'center' }, border: BORD }));
  });

  let r = H + 3 + allRows.length + 1;
  box(ws,`A${r}:X${r}`,'† MCB / RCBO / Fuse etc.    †† Type B-C-D etc.    * Resistance of phase conductor (Rp)    ** Resistance of earth conductor (Re)', { font:{ size:8, italic:true }, border:false });
  r += 1;
  const signRow = (rr, label, s, fallbackName) => {
    box(ws,`A${rr}:B${rr}`, label, { font:{ bold:true } });
    box(ws,`C${rr}:G${rr}`, s.name || fallbackName || '');
    box(ws,`H${rr}:I${rr}`,'Signature', { font:{ bold:true } });
    ws.mergeCells(`J${rr}:M${rr}`); sc(ws,`J${rr}`, '', { border:BORD });
    if(s.sig){ try{ const id = wb.addImage({ base64: s.sig.split(',')[1], extension:'png' }); ws.addImage(id, { tl:{ col:9.1, row:rr-1+0.05 }, ext:{ width:110, height:26 } }); }catch(e){} }
    box(ws,`N${rr}:O${rr}`,'QC No', { font:{ bold:true } }); box(ws,`P${rr}:Q${rr}`, s.qc || '');
    box(ws,`R${rr}:S${rr}`,'Reg No', { font:{ bold:true } }); box(ws,`T${rr}:U${rr}`, s.reg || '');
    box(ws,`V${rr}:V${rr}`,'Date', { font:{ bold:true } }); box(ws,`W${rr}:X${rr}`, s.date ? fmtDate(s.date) : '');
    ws.getRow(rr).height = 22;
  };
  signRow(r, 'Pre Connection Tested By', job.sig.pre, job.electrician); r += 1;
  signRow(r, 'Post Connection Tested By', job.sig.post, (job.sig.pre.name || job.electrician)); r += 2;
  const foot = [settings.companyName, settings.address, settings.phone, settings.email, settings.regNo && ('Reg ' + settings.regNo), settings.footerText].filter(Boolean).join('  •  ');
  box(ws,`A${r}:X${r}`, foot, { font:{ size:8, color:{argb:c2} }, align:{ horizontal:'center' }, border:false });

  const addDataSheet = (name, headers, rows) => {
    const s = wb.addWorksheet(name);
    s.addRow(headers); s.getRow(1).font = { bold:true, color:{argb:'FFFFFFFF'} };
    s.getRow(1).eachCell(c => { c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:c1} }; c.border = BORD; });
    rows.forEach(rw => s.addRow(rw));
    s.columns.forEach(col => { let m = 10; col.eachCell(c => { m = Math.max(m, String(c.value||'').length + 2); }); col.width = Math.min(m, 45); });
    s.autoFilter = { from:{ row:1, column:1 }, to:{ row:1, column:headers.length } };
    return s;
  };
  
  let installHeaders = ['DB Ref','Category','Type','MPRN','Cert No','Seal No','Max Demand','Supply Characteristics','Max Rp+Re (Ω)','Max Re (Ω)','Bonding Gas','Bonding Water','Supplementary','Electrode','Other','Comments'];
  let installValues = [job.dbRef, job.category, job.installType, job.mprn, job.certNo, job.sealNo, job.maxDemand, job.supplyChar, job.maxRpRe, job.maxRe, job.bonding.gas, job.bonding.water, job.bonding.supp, job.bonding.electrode, [job.bonding.other, job.bonding.otherDetails].filter(Boolean).join(' – '), job.comments];
  
  if(isPIR){
    installHeaders = ['DB Ref','Reason for Inspection','Overall Condition','MPRN','Cert No','Seal No','Max Demand','Supply Characteristics','Max Rp+Re (Ω)','Max Re (Ω)','Bonding Gas','Bonding Water','Supplementary','Electrode','Other','Comments'];
    installValues = [job.dbRef, job.periodic.reason, job.periodic.condition, job.mprn, job.certNo, job.sealNo, job.maxDemand, job.supplyChar, job.maxRpRe, job.maxRe, job.bonding.gas, job.bonding.water, job.bonding.supp, job.bonding.electrode, [job.bonding.other, job.bonding.otherDetails].filter(Boolean).join(' – '), job.comments];
  }

  addDataSheet('Customer', ['Customer Name','Installation Address','Phone','Email','Job No','Date','Electrician'],
    [[job.customerName, job.address, job.phone, job.email, job.jobNo, fmtDate(job.date), job.electrician]]);
  addDataSheet('Installation', installHeaders, [installValues]);
  addDataSheet('Circuits', ['No','Designation','Cable Type','Sq mm','Points','Device','Type','Amps','Notes'],
    job.circuits.map(c => [c.number, c.designation, c.cableType, c.cableSize, c.points, c.device, c.deviceType, c.amps, c.notes]));
  addDataSheet('Pre Tests', ['Circuit','Designation','Rp+Re','Re','L-L','N-N','E-E','IR Ph&N-E','IR Ph-N','IR 3Ph','Erroneous','Polarity','Result','Comments'],
    job.circuits.map(c => [c.number, c.designation, c.pre.rpre, c.pre.re, c.pre.ll, c.pre.nn, c.pre.ee, c.pre.irPNE, c.pre.irPN, c.pre.ir3ph, c.pre.erroneous?'Yes':'', c.pre.polarity?'Yes':'', c.pre.pass, c.pre.comments]));
  addDataSheet('Post Tests', ['Circuit','Designation','Max Zs','Measured Zs','PFC (kA)','RCD 1/2x','RCD 1x','RCD 5x','Test Button','Polarity','Functional','Result','Comments'],
    job.circuits.map(c => [c.number, c.designation, c.post.maxZs, c.post.zs, c.post.pfc, c.post.rcdHalf, c.post.rcd1, c.post.rcd5, c.post.testBtn?'Yes':'', c.post.polarity?'Yes':'', c.post.functional?'Yes':'', c.post.pass, c.post.comments]));
  addDataSheet('Photos', ['Circuit','Caption','Taken','In Report'],
    job.photos.map(p => { const c = job.circuits.find(x=>x.id===p.circuitId); return [c ? (c.number+' '+c.designation) : 'General', p.caption, fmtDT(p.ts), p.include?'Yes':'']; }));
  addDataSheet('Notes', ['Type','Note'],
    [['General', job.notes.general],['Completion', job.notes.completion],['Recommendations', job.notes.recommendations],['Observations', job.notes.observations]].filter(n=>n[1]));

  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
    `${isPIR?'PIR':'TestRecord'}_${(job.customerName||'Job').replace(/[^\w]+/g,'_')}_${job.jobNo||job.date}.xlsx`);
}

/* ================= PDF CUSTOMER REPORT (jsPDF) ================= */
function buildPDF(job, settings){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W = 210, M = 14;
  const rgb1 = hexToRgb(settings.c1);
  const rgb2 = hexToRgb(settings.useC2 ? settings.c2 : settings.c1);
  const rgb3 = hexToRgb(settings.useC3 ? settings.c3 : (settings.useC2 ? settings.c2 : settings.c1));
  const onC1 = textOn(settings.c1) === '#ffffff' ? [255,255,255] : [15,23,42];

  const isPIR = job.jobType === 'Periodic';
  const docTitle = isPIR ? 'PERIODIC INSPECTION REPORT' : 'Electrical Test Report';
  const disclaimer = isPIR 
    ? 'PERIODIC INSPECTION REPORT – FOR ON-SITE DATA COLLECTION ONLY. AN OFFICIAL SAFE ELECTRIC PIR MUST BE COMPLETED FOR FINAL CERTIFICATION.'
    : (settings.reportFooter || 'SITE TEST RECORD – FOR ON-SITE DATA COLLECTION ONLY. AN OFFICIAL SAFE ELECTRIC CERTIFICATE MUST BE COMPLETED TO RECEIVE FINAL CERTIFICATION.');

  let headerLogoW = 0;
  const header = () => {
    doc.setFillColor(...rgb1); doc.rect(0, 0, W, 26, 'F');
    doc.setFillColor(...rgb2); doc.rect(0, 26, W, 2.2, 'F');
    if(settings.useC3){ doc.setFillColor(...rgb3); doc.rect(0, 28.2, W, 1, 'F'); }
    if(settings.logo){
      try{
        const props = doc.getImageProperties(settings.logo);
        const fit = fitBox(props.width, props.height, 34, 16);
        const lx = M, ly = 5 + (16 - fit.h) / 2;
        if(settings.logoBox !== false){
          doc.setFillColor(255,255,255);
          doc.roundedRect(lx - 2, ly - 2, fit.w + 4, fit.h + 4, 2, 2, 'F');
        }
        doc.addImage(settings.logo, props.fileType === 'PNG' ? 'PNG' : 'JPEG', lx, ly, fit.w, fit.h, undefined, 'FAST');
        headerLogoW = fit.w;
      }catch(e){}
    }
    doc.setTextColor(...onC1);
    doc.setFontSize(15); doc.setFont('helvetica','bold');
    doc.text(settings.companyName || '', settings.logo ? M + headerLogoW + 8 : M, 12);
    doc.setFontSize(8); doc.setFont('helvetica','normal');
    const line = [settings.phone, settings.email, settings.website].filter(Boolean).join('   •   ');
    if(line) doc.text(line, settings.logo ? M + headerLogoW + 8 : M, 17.5);
    const line2 = [settings.address, settings.regNo && ('Reg No ' + settings.regNo)].filter(Boolean).join('   •   ');
    if(line2) doc.text(line2, settings.logo ? M + headerLogoW + 8 : M, 22);
  };
  const footer = () => {
    const n = doc.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){
      doc.setPage(i);
      doc.setFillColor(...rgb1); doc.rect(0, 288, W, 9, 'F');
      if (isPIR) {
        /* Cannot be mistaken for the official Safe Electric report */
        doc.setFillColor(254, 243, 199);
        doc.rect(0, 281.5, W, 6.5, 'F');
        doc.setTextColor(146, 64, 14); doc.setFontSize(7); doc.setFont('helvetica','bold');
        doc.text('NOT FOR OFFICIAL USE - This is not a Safe Electric Periodic Inspection Report. The official report must still be completed and submitted.', W/2, 285.7, { align:'center' });
      }
      doc.setTextColor(...onC1); doc.setFont('helvetica','normal');
      const pageLbl = `Page ${i} of ${n}`;
      doc.setFontSize(7);
      const lblW = doc.getTextWidth(pageLbl);
      /* keep the disclaimer clear of the page number: cap its width and shrink if needed */
      const availW = W - (M * 2) - lblW - 6;
      let fs = 7;
      doc.setFontSize(fs);
      while(doc.getTextWidth(disclaimer) > availW && fs > 5){ fs -= 0.25; doc.setFontSize(fs); }
      doc.text(disclaimer, M, 293.5, { maxWidth: availW });
      doc.setFontSize(7);
      doc.text(pageLbl, W - M, 293.5, { align:'right' });
    }
  };
  let y = 36;
  const room = (need) => { if(y + need > 282){ doc.addPage(); header(); y = 36; } };
  const title = (t) => {
    room(14);
    doc.setFillColor(...rgb2); doc.rect(M, y, 3, 7, 'F');
    doc.setTextColor(15,23,42); doc.setFontSize(12); doc.setFont('helvetica','bold');
    doc.text(t, M+6, y+5.2); y += 11;
  };
  const table = (head, body, opts={}) => {
    doc.autoTable(Object.assign({
      startY: y, margin:{ left:M, right:M, top:34, bottom:14 },
      head:[head], body,
      styles:{ fontSize:7.5, cellPadding:1.6, lineColor:[203,213,225], lineWidth:.2, textColor:[30,41,59] },
      headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7.5, fontStyle:'bold' },
      alternateRowStyles:{ fillColor:[248,250,252] },
      didDrawPage: () => { header(); }
    }, opts));
    y = doc.lastAutoTable.finalY + 8;
  };

  header();
  doc.setTextColor(15,23,42); doc.setFontSize(18); doc.setFont('helvetica','bold');
  doc.text(docTitle, M, y+2);
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
  doc.text([`Job ${job.jobNo || '–'}`, fmtDate(job.date), job.status === 'complete' ? 'Pre & post connection testing complete' : (job.status === 'post' ? 'Pre-connection complete' : 'In progress')].join('   •   '), M, y+8);
  y += 16;

  if (isPIR) {
    const p = job.pir || {};
    const audit = pirAudit(job);
    const kv = { showHead:false, columnStyles:{ 0:{ fontStyle:'bold', cellWidth:44, fillColor:[241,245,249] }, 1:{ cellWidth:52 }, 2:{ fontStyle:'bold', cellWidth:44, fillColor:[241,245,249] } } };

    title('Periodic Inspection Report');
    table([], [
      ['PR No.', p.prNo || '', 'Installation category', p.category || ''],
      ['Reason for inspection', job.periodic.reason || '', 'Approx age of installation', p.approxAge || ''],
      ['Occupant', p.occupant || '', 'Occupant in attendance', p.occupantAttended || ''],
      ['Entire installation?', p.entireInstall || '', 'Overall condition', audit.condition || job.periodic.condition || ''],
    ], kv);
    if (p.entireInstall === 'No' && p.partialDetail) {
      table([], [['Extent of partial inspection', p.partialDetail]], { showHead:false, columnStyles:{ 0:{ fontStyle:'bold', cellWidth:44, fillColor:[241,245,249] } } });
    }

    title('Supply Characteristics');
    table([], [
      ['System earthing', p.earthing || '', 'Installation voltage', p.phase || ''],
      ['Max prospective S/C current', p.pscc ? p.pscc + ' A' : '', 'Main isolation device', p.mainIsolation || ''],
      ['Nominal rating', p.nominalRating ? p.nominalRating + ' A' : '', 'Main RCD In / I\u0394n', [p.mainRcdIn && p.mainRcdIn+' A', p.mainRcdIdn && p.mainRcdIdn+' mA'].filter(Boolean).join(' / ')],
      ['Voltages', [p.v1 && 'L1 '+p.v1, p.v2 && 'L2 '+p.v2, p.v3 && 'L3 '+p.v3, p.v12 && 'L1-L2 '+p.v12, p.v23 && 'L2-L3 '+p.v23, p.v31 && 'L3-L1 '+p.v31].filter(Boolean).join('  '), '', ''],
    ], kv);

    /* The 30 inspection questions, two columns of answers */
    title('Schedule of Inspection');
    const qrows = [];
    PIR_Q.forEach(g => {
      g.items.forEach(it => {
        const ans = (p.q || {})['q' + it[0]] || '-';
        qrows.push([String(it[0]), it[1], ans]);
      });
    });
    qrows.push(['17', 'Sub circuit isolation and overcurrent device type', p.q17type || '-']);
    doc.autoTable({
      startY: y, margin:{ left:M, right:M, top:34, bottom:14 },
      head: [['#', 'Inspection item', 'Result']],
      body: qrows,
      theme:'grid', styles:{ fontSize:7, cellPadding:1.4, lineColor:[226,232,240] },
      headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7.5, fontStyle:'bold' },
      columnStyles:{ 0:{ cellWidth:8, halign:'center' }, 2:{ cellWidth:16, halign:'center', fontStyle:'bold' } },
      didParseCell: function(d){
        if (d.section === 'body' && d.column.index === 2) {
          if (d.cell.raw === 'No') { d.cell.styles.textColor = [185,28,28]; d.cell.styles.fillColor = [254,242,242]; }
          else if (d.cell.raw === 'Yes') { d.cell.styles.textColor = [21,128,61]; }
          else if (d.cell.raw === '-') { d.cell.styles.textColor = [148,163,184]; }
        }
      }
    });
    y = doc.lastAutoTable.finalY + 8;

    if ((p.rcds || []).length) {
      title('RCDs');
      table(['Circuit description', 'Tripping current (mA)', 'Longest tripping time (ms)'],
        p.rcds.map(r => [r.desc || '', r.trip || '', r.time || '']), {});
    }

    title('Summary Test Data');
    table([], [
      ['Min insulation resistance', p.minIR ? p.minIR + ' M\u03a9' : '', 'Max resistance of protective conductor', p.maxRp ? p.maxRp + ' \u03a9' : ''],
      ['Max fault loop impedance', p.maxZs ? p.maxZs + ' \u03a9' : '', 'Associated protective device', [p.zsDeviceType, p.zsDeviceSize].filter(Boolean).join(' ')],
      ['Quality of workmanship', p.workmanship || '', '', ''],
    ], kv);

    title('Test Instruments');
    table([], [
      ['Continuity tester', p.instContinuity || '', 'Insulation resistance tester', p.instIR || ''],
      ['Loop impedance tester', p.instLoop || '', 'RCD tester', p.instRcd || ''],
    ], kv);

    title('Observations and Recommendations');
    const obs = (p.obs || []).filter(o => (o.comment || '').trim());
    if (!obs.length) {
      table([], [['', p.noRemedial || 'No remedial work is required']], { showHead:false, columnStyles:{ 0:{ cellWidth:2 } } });
    } else {
      table(['Ref', 'Comment', 'Action'],
        obs.map((o, i) => [o.ref || String(i+1), o.comment, '(' + o.code + ') ' + (PIR_CODES[o.code] || '')]),
        { columnStyles:{ 0:{ cellWidth:12, halign:'center' }, 2:{ cellWidth:52 } },
          didParseCell: function(d){
            if (d.section === 'body' && d.column.index === 2 && String(d.cell.raw).indexOf('(1)') === 0) {
              d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold';
            }
          }
        });
    }
    doc.setFontSize(7); doc.setTextColor(100,116,139);
    room(10);
    doc.text('(1) Requires urgent attention   (2) Requires improvements   (3) Requires some attention   (4) Does not comply with current National Rules', M, y);
    y += 6;

    if (audit.urgent.length) {
      room(12);
      doc.setFillColor(220,38,38); doc.rect(M, y, W - M*2, 8, 'F');
      doc.setTextColor(255,255,255); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
      doc.text('URGENT ATTENTION REQUIRED. The person responsible for the installation must be notified without delay.', M + 3, y + 5.2);
      y += 12;
    }

    if (p.intervalValue) {
      room(10);
      doc.setTextColor(15,23,42); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
      doc.text('Recommended re-inspection: not more than ' + p.intervalValue + ' ' + (p.intervalUnit || 'years') + '.', M, y);
      y += 8;
    }
  }

  title('Customer & Installation');
  
  const custTableData = [
    ['Customer', job.customerName || '', 'MPRN No', job.mprn || ''],
    ['Address', job.address || '', 'Cert No', job.certNo || ''],
    ['Phone / Email', [job.phone, job.email].filter(Boolean).join(' / '), 'Seal No', job.sealNo || ''],
    ['Electrician', job.electrician || '', 'DB Ref', job.dbRef || '']
  ];
  
  if (!isPIR) {
    custTableData.push(['Category', job.category || '', 'Type', job.installType || '']);
  }
  custTableData.push(['Max Demand', job.maxDemand || '', 'Supply', job.supplyChar || '']);

  table(['','',' ',''], custTableData, { showHead: false, columnStyles:{ 0:{ fontStyle:'bold', cellWidth:30, fillColor:[241,245,249] }, 1:{ cellWidth:66 }, 2:{ fontStyle:'bold', cellWidth:26, fillColor:[241,245,249] } } });

  title('Bonding, Earthing & Supply');
  table(['Check','Status'], [
    ['Main bonding – Gas', job.bonding.gas || '–'],
    ['Main bonding – Water', job.bonding.water || '–'],
    ['Supplementary bonding', job.bonding.supp || '–'],
    ['Electrode earthing conductor', job.bonding.electrode || '–'],
    ['Other' + (job.bonding.otherDetails ? ' – ' + job.bonding.otherDetails : ''), job.bonding.other || '–'],
    ['Max Rp+Re (Ω)', job.maxRpRe || '–'],
    ['Max Res. Protective Conductor Re (Ω)', job.maxRe || '–']
  ]);

  const insRows = (job.instruments||[]).filter(i => i.serial || i.make || i.model);
  if(insRows.length){
    title('Test Instruments');
    table(['Instrument','Make / Model','Serial No','Calibration Expiry'],
      insRows.map(i => [i.use, [i.make, i.model].filter(Boolean).join(' '), i.serial, i.calExpiry ? fmtDate(i.calExpiry) : '']));
  }

  title('Circuit Details');
  table(['No','Designation','Cable','Sq mm','Points','Device','Type','Amps'],
    job.circuits.map(c => [c.number, c.designation, c.cableType, c.cableSize, c.points, c.device, c.deviceType, c.amps]));

  title('Pre-Connection Testing');
  table(['No','Rp+Re','Re','L-L','N-N','E-E','IR Ph&N-E','IR Ph-N','IR 3Ph','Err ✓','Pol ✓','Result','Comments'],
    job.circuits.map(c => [c.number, c.designation, c.pre.rpre, c.pre.re, c.pre.ll, c.pre.nn, c.pre.ee, c.pre.irPNE, c.pre.irPN, c.pre.ir3ph, c.pre.erroneous?'✓':'', c.pre.polarity?'✓':'', c.pre.pass, c.pre.comments]),
    { headStyles:{ fillColor:[8,145,178], textColor:[255,255,255], fontSize:7, fontStyle:'bold' } });

  title('Post-Connection Testing');
  table(['No','Max Zs','Zs','PFC kA','RCD ½×','RCD 1×','RCD 5×','Btn ✓','Pol ✓','Func ✓','Result','Comments'],
    job.circuits.map(c => [c.number, c.designation, c.post.maxZs, c.post.zs, c.post.pfc, c.post.rcdHalf, c.post.rcd1, c.post.rcd5, c.post.testBtn?'✓':'', c.post.polarity?'✓':'', c.post.functional?'✓':'', c.post.pass, c.post.comments]),
    { headStyles:{ fillColor:[220,38,38], textColor:[255,255,255], fontSize:7, fontStyle:'bold' } });

  const notes = [['General', job.notes.general],['Completion', job.notes.completion],['Recommendations', job.notes.recommendations],['Observations', job.notes.observations]].filter(n => n[1]);
  if(notes.length){ title('Notes'); table(['Type','Note'], notes, { columnStyles:{ 0:{ cellWidth:34, fontStyle:'bold' } } }); }

  const pics = job.photos.filter(p => p.include);
  if(pics.length){
    title('Photos');
    const pw = (W - M*2 - 6) / 2, ph = pw * 0.72;
    pics.forEach((p, i) => {
      const col = i % 2;
      if(col === 0) room(ph + 14);
      const x = M + col * (pw + 6);
      try{ doc.addImage(p.data, 'JPEG', x, y, pw, ph, undefined, 'FAST'); }catch(e){}
      doc.setFontSize(7.5); doc.setTextColor(71,85,105);
      const cir = job.circuits.find(c => c.id === p.circuitId);
      doc.text([(cir ? 'Circuit ' + cir.number + (cir.designation ? ' – ' + cir.designation : '') : 'General'), p.caption, fmtDT(p.ts)].filter(Boolean).join('  •  ').slice(0, 70), x, y + ph + 4);
      if(col === 1 || i === pics.length - 1) y += ph + 10;
    });
    y += 4;
  }

  title('Sign-off');
  room(46);
  const sig = (x, label, s, fallbackName) => {
    doc.setDrawColor(203,213,225); doc.setLineWidth(.3); doc.roundedRect(x, y, 86, 38, 2, 2);
    doc.setFillColor(...rgb1); doc.roundedRect(x, y, 86, 7, 2, 2, 'F'); doc.rect(x, y+4, 86, 3, 'F');
    doc.setTextColor(...onC1); doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.text(label, x+3, y+4.8);
    doc.setTextColor(30,41,59); doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text([`Name: ${s.name || fallbackName || ''}`, `QC No: ${s.qc || ''}    Reg No: ${s.reg || ''}`, `Date: ${s.date ? fmtDate(s.date) : ''}`], x+3, y+12, { lineHeightFactor:1.6 });
    if(s.sig){ try{ doc.addImage(s.sig, 'PNG', x+40, y+10, 42, 16); }catch(e){} }
  };
  sig(M, 'Pre Connection Tested By', job.sig.pre, job.electrician);
  sig(M + 92, 'Post Connection Tested By', job.sig.post, (job.sig.pre.name || job.electrician));
  y += 46;

  footer();
  doc.save(`${isPIR?'PIR':'Report'}_${(job.customerName||'Job').replace(/[^\w]+/g,'_')}_${job.jobNo||job.date}.pdf`);
}

/* ================= STRICT NUMBER FILTER ================= */
function irClass(v){ if(v==='') return ''; const n = parseFloat(v.replace(/[^0-9.]/g,'')); if(isNaN(n)) return ''; if(n < 1) return ' bad'; if(n < 2) return ' warn'; return ''; }
function zsClass(zs, maxZs){ if(zs==='') return ''; const n = parseFloat(zs.replace(/[^0-9.]/g,'')), m = parseFloat(maxZs); if(isNaN(n)) return ''; if(!isNaN(m) && n > m) return ' bad'; if(!isNaN(m) && n > m*0.8) return ' warn'; return ''; }
function rcdClass(v, limit){ if(v==='') return ''; const n = parseFloat(v.replace(/[^0-9.]/g,'')); if(isNaN(n)) return ''; return n > limit ? ' bad' : ''; }

function GridInput({value, onChange, cls='', ph, disabled}){
  const handleChange = (e) => {
    // Strip everything except numbers, decimals, <, >, -, N, A, /
    const val = e.target.value.replace(/[^0-9.<>\-naA/]/gi, '');
    onChange(val);
  };
  return <input className={'gridin' + cls} inputMode="decimal" placeholder={ph} value={value} disabled={disabled} onChange={handleChange}/>;
}

/* ================= JOB EDITOR ================= */
function JobEditor({job, setJob, allJobs, customers, setCustomers, settings, templates, setTemplates, toast, back, api, members}){
  const [tab, setTab] = useState('Job');
  const up = (patch) => setJob(Object.assign({}, job, patch, { updatedAt: nowISO() }));
  const upCircuit = (id, patch) => up({ circuits: job.circuits.map(c => c.id === id ? Object.assign({}, c, patch) : c) });
  const upPre = (id, patch) => up({ circuits: job.circuits.map(c => c.id === id ? Object.assign({}, c, { pre: Object.assign({}, c.pre, patch) }) : c) });
  const upPost = (id, patch) => up({ circuits: job.circuits.map(c => c.id === id ? Object.assign({}, c, { post: Object.assign({}, c.post, patch) }) : c) });
  const photoInput = useRef(null); const cameraInput = useRef(null);
  const [photoCircuit, setPhotoCircuit] = useState('');

  const isPIR = job.jobType === 'Periodic';

  const pickCustomer = (cust) => {
    const prevJob = allJobs.find(x => x.customerId === cust.id && x.id !== job.id);
    const updates = { customerId: cust.id, customerName: cust.name, address: cust.address, phone: cust.phone, email: cust.email };
    
    if (prevJob && window.confirm(`Copy previous installation details and circuits for ${cust.name}? (Test results will be cleared)`)) {
      updates.dbRef = prevJob.dbRef || '';
      updates.category = prevJob.category || '';
      updates.installType = prevJob.installType || '';
      updates.mprn = prevJob.mprn || '';
      updates.maxDemand = prevJob.maxDemand || '';
      updates.supplyChar = prevJob.supplyChar || '';
      updates.maxRpRe = prevJob.maxRpRe || '';
      updates.maxRe = prevJob.maxRe || '';
      updates.bonding = JSON.parse(JSON.stringify(prevJob.bonding || job.bonding));
      if (prevJob.circuits && prevJob.circuits.length > 0) {
        updates.circuits = prevJob.circuits.map(c => Object.assign({}, c, { id: uid(), pre: blankPre(), post: blankPost(), notes: '' }));
      }
      if (prevJob.instruments && prevJob.instruments.length > 0) {
        updates.instruments = prevJob.instruments.map(i => Object.assign({}, i, { id: uid() }));
      }
      toast('Copied previous job details');
    }
    up(updates);
  };

  const saveAsCustomer = () => {
    if(!job.customerName.trim()) return alert('Enter a customer name first.');
    const c = { id: uid(), name: job.customerName, address: job.address, phone: job.phone, email: job.email, notes:'' };
    setCustomers(prev => [c, ...prev]); up({ customerId: c.id }); toast('Saved to customer database');
  };
  const addCircuit = () => {
    const last = job.circuits[job.circuits.length-1];
    const nextNo = last ? (parseInt(last.number)||job.circuits.length) + 1 : 1;
    const fresh = blankCircuit(nextNo);
    if(last){ fresh.cableType = last.cableType; fresh.device = last.device; fresh.deviceType = last.deviceType; }
    up({ circuits: [...job.circuits, fresh] });
  };
  const dupCircuit = (c) => {
    const copy = JSON.parse(JSON.stringify(c)); copy.id = uid();
    copy.number = String((parseInt(c.number)||job.circuits.length) + 1);
    copy.pre = blankPre(); copy.post = blankPost();
    const i = job.circuits.findIndex(x=>x.id===c.id);
    const next = job.circuits.slice(); next.splice(i+1, 0, copy);
    up({ circuits: next }); toast('Circuit duplicated');
  };
  const delCircuit = (c) => { if(confirm('Delete circuit ' + c.number + (c.designation ? ' – '+c.designation : '') + '?')) up({ circuits: job.circuits.filter(x=>x.id!==c.id) }); };
  const moveCircuit = (c, dir) => {
    const i = job.circuits.findIndex(x=>x.id===c.id); const j = i + dir;
    if(j < 0 || j >= job.circuits.length) return;
    const next = job.circuits.slice(); [next[i], next[j]] = [next[j], next[i]];
    up({ circuits: next });
  };
  const saveTemplate = (c) => {
    const name = prompt('Template name:', c.designation || 'Circuit template'); if(!name) return;
    setTemplates(prev => [...prev, { id: uid(), name, designation:c.designation, cableType:c.cableType, cableSize:c.cableSize, points:c.points, device:c.device, deviceType:c.deviceType, amps:c.amps }]);
    toast('Template saved');
  };
  const applyTemplate = (c, t) => upCircuit(c.id, { designation:t.designation, cableType:t.cableType, cableSize:t.cableSize, points:t.points, device:t.device, deviceType:t.deviceType, amps:t.amps });

  const addPhotos = async (e) => {
    const files = Array.from(e.target.files || []); if(!files.length) return;
    const added = [];
    for(const f of files){ try{ added.push({ id: uid(), data: await compressImage(f), caption:'', circuitId: photoCircuit, ts: nowISO(), include: true }); }catch(err){} }
    up({ photos: [...job.photos, ...added] }); e.target.value = '';
    for(const p of added){ await api.savePhoto(job.id, p); }
    toast(added.length + ' photo' + (added.length===1?'':'s') + ' added');
  };
  const upPhoto = (id, patch) => {
    const next = job.photos.map(p => p.id===id ? Object.assign({}, p, patch) : p);
    up({ photos: next });
    const p = next.find(x=>x.id===id); if(p) api.savePhoto(job.id, p);
  };
  const delPhoto = (id) => { up({ photos: job.photos.filter(x=>x.id!==id) }); api.deletePhoto(job.id, id); };
  const handover = (m) => {
    up({ assignedTo: m ? m.email : '', assignedName: m ? m.name : '' });
    toast(m ? ('Job assigned to ' + (m.name || m.email)) : 'Assignment cleared');
  };

  /* STRICT VALIDATION RULES */
  const preErrors = useMemo(() => {
    const errs = [];
    if (job.circuits.length === 0) return ['No circuits added to the job yet.'];
    job.circuits.forEach(c => {
       if (!c.designation) errs.push(`Circuit ${c.number}: Missing designation.`);
       const hasCont = c.pre.rpre || c.pre.re || c.pre.ll || c.pre.nn || c.pre.ee;
       if (!hasCont) errs.push(`Circuit ${c.number}: Needs at least one Continuity reading.`);
       const hasIR = c.pre.irPNE || c.pre.irPN || c.pre.ir3ph;
       if (!hasIR) errs.push(`Circuit ${c.number}: Needs at least one Insulation Resistance reading.`);
       if (!c.pre.pass) errs.push(`Circuit ${c.number}: Must be explicitly marked Pass or Fail.`);
    });
    return errs;
  }, [job.circuits]);

  const postErrors = useMemo(() => {
    const errs = [];
    job.circuits.forEach(c => {
       if (!c.post.pass) errs.push(`Circuit ${c.number}: Must be explicitly marked Pass or Fail.`);
    });
    return errs;
  }, [job.circuits]);

  const signOffPre = () => {
    const finalName = job.sig.pre.name || job.electrician;
    if(!finalName || !job.sig.pre.sig) return alert('Pre connection sign-off needs a name and signature.');
    up({ preLocked: true, status:'post', sig:{ ...job.sig, pre:{ ...job.sig.pre, name: finalName, date: job.sig.pre.date || todayInput() } } });
    toast('Pre-connection signed off and locked');
  };
  const signOffPost = () => {
    const finalName = job.sig.post.name || job.sig.pre.name || job.electrician;
    if(!finalName || !job.sig.post.sig) return alert('Post connection sign-off needs a name and signature.');
    up({ status:'complete', sig:{ ...job.sig, post:{ ...job.sig.post, name: finalName, date: job.sig.post.date || todayInput() } } });
    toast('Job complete – ready to export');
  };

  const missing = [];
  if(!job.customerName) missing.push('customer name');
  if(!job.address) missing.push('address');
  if(!job.electrician) missing.push('electrician');
  if(isPIR){
    const p = job.pir || {};
    if(!p.category) missing.push('installation category');
    if(!p.entireInstall) missing.push('extent of installation');
    if(!p.earthing) missing.push('system earthing');
    const un = pirAudit(job).unanswered;
    if(un.length) missing.push(un.length + ' unanswered inspection question' + (un.length===1?'':'s'));
    if(!job.periodic.condition) missing.push('overall condition');
    if(!((job.sig && job.sig.post && job.sig.post.sig))) missing.push('signature');
  } else {
    if(!job.instruments.some(i => i.serial)) missing.push('instruments');
  }

  /* Periodic drops the installation-only tabs. Instrument serials live in the PIR tab. */
  /* A periodic inspection records summary test data and its own declaration, so the
     installation-only tabs (Install, Instruments, Circuits, Pre/Post tests, Sign-off)
     are hidden. Signature and instrument serials live in the PIR tab. */
  const JOB_TABS = (job && job.jobType === 'Periodic')
    ? ['Job','PIR','Photos','Notes','Export']
    : ['Job','Install','Instruments','Circuits','Pre tests','Post tests','Photos','Notes','Sign-off','Export'];
  const nextTab = (curr) => {
    const idx = JOB_TABS.indexOf(curr);
    if (idx >= 0 && idx < JOB_TABS.length - 1) setTab(JOB_TABS[idx + 1]);
  };
  const nextBtn = (curr) => {
    const idx = JOB_TABS.indexOf(curr);
    if (idx >= 0 && idx < JOB_TABS.length - 1) {
      return (<div className="mt-4 fadein"><button className="btn btn-g w-full !bg-slate-200" onClick={()=>nextTab(curr)}>Next section: {JOB_TABS[idx + 1]} ➔</button></div>);
    }
    return null;
  };

  const sigBlock = (key, locked, onSign, label, done, errors=[]) => {
    const s = job.sig[key];
    const fallbackName = key === 'pre' ? job.electrician : (job.sig.pre.name || job.electrician);
    const upSig = (patch) => up({ sig: Object.assign({}, job.sig, { [key]: Object.assign({}, s, patch) }) });

    return (<Section title={label} chip={done ? <span className="chip stagechip-done">Signed</span> : <span className={'chip ' + (key==='pre' ? 'stagechip-pre' : 'stagechip-post')}>Open</span>}>
      {errors.length > 0 && !done && (
        <div className="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-sm text-red-900">
          <div className="font-bold mb-1">Cannot sign off yet:</div>
          <ul className="list-disc pl-5 space-y-0.5">
            {errors.slice(0, 5).map((e, i) => <li key={i}>{e}</li>)}
            {errors.length > 5 && <li className="italic">...and {errors.length - 5} more fields need checking.</li>}
          </ul>
        </div>
      )}
      <div className="grid sm:grid-cols-2 gap-3 mb-3">
        <Field label="Tested by" value={s.name !== undefined ? s.name : ''} placeholder={fallbackName} onChange={v=>upSig({name:v})} required/>
        <Field label="Date" type="date" value={s.date} onChange={v=>upSig({date:v})}/>
        <Field label="QC No" value={s.qc} onChange={v=>upSig({qc:v})}/>
        <Field label="Reg No" value={s.reg} onChange={v=>upSig({reg:v})}/>
      </div>
      <SignaturePad value={s.sig} onChange={v=>upSig({sig:v})} disabled={done}/>
      {!done && <button className={'btn w-full mt-3 ' + (errors.length > 0 ? 'btn-g opacity-50 cursor-not-allowed' : 'btn-p')} onClick={errors.length > 0 ? undefined : onSign}>
        {key==='pre' ? 'Sign off pre-connection & lock' : 'Sign off post-connection & complete job'}
      </button>}
      {done && key==='pre' && <button className="btn btn-g w-full mt-3" onClick={()=>{ if(confirm('Unlock pre-connection data for editing? The sign-off stays recorded.')) up({ preLocked:false }); }}>Unlock pre-connection data</button>}
    </Section>);
  };

  return (<div className="pb-24">
    <div className="flex gap-2 overflow-x-auto pb-2 mb-3 -mx-1 px-1 noprint" style={{scrollbarWidth:'thin'}}>

    {tab==='Job' && (<div className="space-y-4">
      {customers.length > 0 && (<Section title="Quick fill from customer database">
        <div className="flex flex-wrap gap-1.5">{customers.slice(0,12).map(c => <button key={c.id} className="tabbtn off text-sm" onClick={()=>pickCustomer(c)}>{c.name}</button>)}</div>

      <Section title="Job Configuration" chip={<span className="chip" style={{background:'var(--c1-soft)', color:'var(--c1)'}}>Report Type</span>}>

        {isPIR && (<div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3 mb-4">
